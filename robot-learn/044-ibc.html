    <textarea id="md-source" class="hidden" readonly># 044｜IBC：用能量函数表示多峰动作

[系列首页](README.md) · [上一篇](043-robomimic.md) · [下一篇](045-learning-to-walk.md)

**原论文**：*Implicit Behavioral Cloning*，Pete Florence 等，2021，本文依据v1。[论文](https://arxiv.org/abs/2109.00137)。

## 一、一分钟理解：不直接报动作，而是评价候选动作

普通行为克隆接收图像，直接输出动作。IBC换了一个接口：网络同时接收图像和候选动作，输出一个“能量”；控制时寻找能量最低的动作。

这种变化适合某些存在分支的操作。例如既可以向左绕，也可以向右绕，但不能取两者平均直冲障碍。能量函数可以为两个合理动作各保留一个低谷。即使能量网络连续，最低点的位置也可以突然从一个低谷跳到另一个，因此能够表达动作切换。

论文在函数拟合、仿真操作、D4RL及真实推块中验证这一表示选择。真实任务包含毫米级间隙的推入，但机器人运动被限制在桌面上方二维平面。**在存在多模态与接触动作切换的示范学习中，通过学习条件能量并在推理时搜索动作，改善了部分闭环操作表现，代价是额外优化开销和能量搜索可能失效。**

## 二、背景：动作不连续并不代表网络必须不连续

接触操作经常有阶段边界：推到目标附近要转为微调，物体滑脱要重新接近，扫完一堆要转向另一堆。同一观测附近的适当动作可能变化很快，甚至存在多个同样可行的选择。

确定性平方误差回归倾向于条件均值；混合密度网络能建模多个峰，但仍需要设计分布形式。IBC从更一般的能量函数入手，不预先指定“动作必须服从几组高斯”。

它是离线模仿学习，不需要普通版本的奖励标签、价值函数或学习环境模型。名称中的implicit指动作通过优化隐式定义，与后来 IQL 的 implicit 不是同一个算法机制。预测得分也不是估计未来累积回报的Q值。

实验设定很多，不能混成一个统一机器人：D4RL用低维状态；仿真推块使用脚本示范；平面扫粒子使用人类示范；双臂铲取使用脚本示范；真实xArm6使用鼠标遥操作与RGB图像。真实策略输入只有图像，但执行系统仍需要逆运动学与低层关节控制。

## 三、方法：把监督学习变成动作能量排序

### 1. 学习目标与动作选择

设观察为 $o$，动作为 $a$，能量网络为 $E_\theta(o,a)$：

$$
\pi_\theta(o)=\arg\min_{a\in\mathcal A}E_\theta(o,a).
$$

对每个示范动作 $a^+$，生成若干候选负动作 $\tilde a_j$，使用对比损失

$$
L=-\log\frac{\exp[-E_\theta(o,a^+)]}
{\exp[-E_\theta(o,a^+)]+\sum_{j=1}^{N}\exp[-E_\theta(o,\tilde a_j)]}.
$$

这会压低示范动作相对候选的能量。它近似条件分布 $p(a|o)\propto\exp[-E(o,a)]$ 的学习，但有限负样本的归一化不是精确计算连续动作空间的积分。

“负动作”只是本次候选，没有来自真实试验的失败标签。另一条成功路径也可能被随机采成负例；足够的数据覆盖、负采样与模型优化共同决定最终分布。不能把这种训练写成已经知道所有动作成败的监督分类。

### 2. 搜索也是策略的一部分

论文使用无导数搜索、自回归无导数搜索、带梯度惩罚的Langevin方法。真实图像任务采用无导数版本，训练负例从动作范围均匀采样。范围由数据逐维最小最大值加缓冲，再截断到环境允许范围。

无导数推理先均匀采样动作，按负能量softmax重采样，添加逐渐减小的噪声，再次评分。它类似CEM，但没有固定精英数量，也不从精英经验方差更新搜索方差（附录B.1）。因此不宜直接把原算法叫成标准CEM。

视觉特征采用后期融合：先编码图像，再把同一图像特征与很多候选动作组合评分，避免每个候选都重复运行整套视觉编码器。网络参数固定，搜索更新的是候选动作，不是现场重新训练模型。

~~~text
训练无导数版本：
    由示范统计动作边界，添加缓冲并约束到合法范围
    重复：
        采样观察o和示范动作a+
        在动作范围内均匀生成N个候选负动作
        编码o，分别计算a+与全部负动作的能量
        用对比交叉熵更新能量网络
部署单步：
    编码当前观察
    均匀生成候选动作集合A
    重复规定次数：
        计算每个候选的能量，得到softmax(-E)权重
        若还要继续搜索：
            按权重有放回重采样
            加噪声、裁剪范围，并缩小下轮噪声
    返回最终能量最低的候选
    执行动作，读取新观察，再进行下一轮闭环决策
~~~

该流程改变了策略表示和推理方式；监督目标仍然是示范匹配，改善指标是任务表现。没有通过贝尔曼备份提高Q值，也没有凭空解决行为克隆的分布偏移。

### 3. 理论证明到哪里为止

定理1讨论闭图的非空集合值映射可以表示为连续函数的argmin；定理2给出与目标函数图像距离相关的近似结论。关键直觉是两个连续能量谷的高低顺序可以交换，最佳动作的位置随之跳变。

这不是“所有神经网络都能学到最优策略”的证明。附录G明确说明，它没有保证训练算法找到这样的能量，也没有保证非凸搜索求得全局最小值。图距离接近也不自动等于每个固定观察下的动作误差都一样小，更不等于闭环控制稳定。

## 四、实验设置与比较预算

| 项目 | 原文设置 |
|---|---|
| 对照 | 显式MSE、混合密度MDN、最近邻；部分D4RL基线引用原作者结果 |
| 粒子维度实验 | 每个维度2000条脚本示范，维度1至32，隔离动作切换与数据稀疏性 |
| 仿真推块 | 2000条脚本示范，单目标、多目标及图像输入 |
| 平面扫粒子 | 50条人类示范，粒子数量50至100，测试不同排列 |
| 双臂铲取 | 1000条脚本示范，12维笛卡尔动作，700步、10 Hz |
| 真机四任务数据 | 95、410、223、502条遥操作示范 |
| 真机评估 | 每种方法每任务3种子，每种子20回合，共60次 |
| 真机控制 | 图像策略5 Hz，设定点插值为100 Hz，经逆运动学传给关节控制 |
| 真机训练 | 10万更新；不同任务批次与网络宽度存在差别 |
| 测试指标 | 既有整任务二元成功，也有部分插入与粒子/物块完成比例 |

学习器的动作界限来自示范数据，会缩小搜索范围并提高分辨率，同时可能排除没有被示范覆盖的有用动作。毫米级结果还依赖固定桌面、目标夹具和受限平面运动，不能当作任意六自由度装配的证据。

D4RL实验还额外研究只取回报最高50%示范的版本，表中标为RWR。这个版本使用奖励进行数据筛选，不能沿用基础IBC“不使用奖励”的描述。

## 五、五组证据：收益和失败一起看

**图2至图4：表示能力诊断。** 简单函数显示隐式形式能够维持分支而不输出中间动作；视觉坐标回归在少数据下也更好。这些实验帮助解释假设，但不是对复杂接触机器人成功原因的完整因果证明。

**表2：D4RL并不全面胜出。** kitchen-complete中IBC回报3.37、MSE1.76；kitchen-partial中IBC1.45反而低于MSE1.69。hammer-human中IBC为−133，MSE为−38，CQL为300.2。它们是任务回报，不是成功百分比；不能说IBC在所有人类专家任务上击败离线RL。

**表3：图像推块的明显优势。** 单目标图像任务IBC100%、MSE87%、MDN10%。但多目标状态输入任务MDN99.7%，IBC99.0%，差异很小。结论应是表示与输入条件交互，而不是MDN普遍不能学习多模态。

**真实任务结果表：部分得分要单独识别。** 顺序推红绿块85.0%对35.0%，多模态推块88.3%对55.0%，是二元任务成功。蓝块插入83.3%对6.7%，但部分插入计0.5；分类48.3%对19.6%，按每个正确物块计八分之一。因此后两项是平均完成分数，不能直接称为完整任务成功率。双臂扫粒子的78.2%同样是粒子完成比例。

**附录C.2：性能需付推理成本。** 单RTX2080Ti上示例IBC推理7.22毫秒，显式模型3.49毫秒；增加搜索候选到2048后为9.25毫秒。D4RL door示例训练加评估3.4小时对0.66小时。两组设备、输入与算法不同，不应拼成统一加速比，也不能把7.22毫秒倒数直接当作论文真实闭环频率。

证据来自[论文正文和附录](https://arxiv.org/html/2109.00137)。HTML的浮动表格编号有转换混乱，真实结果以“Real-world robot results”标题与四个任务名识别更可靠。附录表7的步速与总训练小时也不完全相容，本文仅使用明确的推理测量，不从该表推导训练吞吐结论。

## 六、贡献与局限：表示更灵活，优化也更重要

主要新意是把能量式条件建模作为完整BC策略，而非仅作为RL中的价值组件，并把理论表达能力与真实闭环证据联系起来。作者明确强调具体EBM采样技巧不是这篇最核心的原创点。

更灵活表示的代价是推理不再一次直接输出：候选数量、噪声日程、动作范围和局部最优都会影响结果。能量函数在数据外出现虚假低谷，搜索可能更积极地找到错误动作；低能量不是经过校准的成功概率。

原文承认计算和实现复杂度增加。本文进一步分析，真实测试只与MSE显式基线比较，不能据此证明胜过所有高质量混合策略或后来的动作生成方法。部分实验所选网络宽度、批次和图像结构也不完全一样，表示能力之外的因素需要在复现时控制。

| 原有问题 | 作者改动 | 为什么可能有效 | 实验证据 | 代价与局限 |
|---|---|---|---|---|
| 动作平均破坏分支 | 能量景观保留多个低谷 | 搜索选择可行动作分支 | 函数、多目标、真机实验 | 搜索可能遗漏低谷 |
| 接触阶段动作突变 | 连续能量加argmin | 最佳点可发生离散切换 | 定理1、2与诊断图 | 表达存在不等于训练保证 |
| 显式视觉控制泛化不足 | 后期融合候选评分 | 观察和动作联合建模 | 图像推块结果 | 额外候选计算 |

阅读范围为v1方法、结果、推理算法、真机配置、理论讨论和局限；未独立复现，未逐项核对全部超参数扫描。没有将部分完成分数改写成完整成功率。

## 七、一个例子与五个前置概念

自构例子，未运行：在插入前，块体略偏左时需要向右轻推，略偏右时需要向左轻推。过渡区域存在两种接触模式，直接平均可能把动作变成零。能量网络可形成左推与右推两个谷，由当前图像改变它们的相对高度。但如果视觉无法分辨偏向，任何策略都缺少信息，能量形式不会自动补出传感真值。

五个概念：**能量模型**给观察动作匹配程度评分；**对比学习**降低正例相对负例的能量；**argmin**返回使目标最小的动作或动作集合；**多模态**表示多个不同动作同时合理；**闭环控制**每执行一步重新观察并修正。

## 八、三个问题及答案

**问题1：能量网络是连续的，为什么动作可以不连续？**

答案：连续性约束作用于能量值，不约束最小值位置。当两个相隔很远的低谷连续地交换高低，argmin会从一个位置跳到另一个。代价是边界附近的小能量误差也可能导致动作分支切换，理论表达力不自动保证平滑控制。

**问题2：为什么IBC不能直接视为Q-learning？**

答案：IBC通过示范与候选的对比学习能量，没有奖励和贝尔曼目标；Q-learning则估计动作后的长期回报。两者都能通过优化一个标量选择动作，但标量含义、数据需求和训练目标不同。

**问题3：蓝块83.3%能否写成“每100次有83次完整插入”？**

答案：不能，部分插入也记0.5，83.3%是平均得分。要恢复完整插入次数必须有每回合分类结果，仅靠均值不够。正确比较还需匹配夹具、二维运动约束、示范数量和60次评估协议。
