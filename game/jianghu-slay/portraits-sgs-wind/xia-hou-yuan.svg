<svg xmlns="http://www.w3.org/2000/svg" width="300" height="380" viewBox="0 0 300 380" role="img" aria-labelledby="xia-hou-yuan-title xia-hou-yuan-desc"><title id="xia-hou-yuan-title">夏侯渊 · 原创人物立绘</title><desc id="xia-hou-yuan-desc">锐利瘦面疾行将军，束发小冠、长缨与绛红飞扬披风，斜握轻矛，身后山道和疾风；人物前倾并用斜线构图区分重甲守将。 原创手绘矢量立绘，非官方美术；未下载图片、未嵌入位图，无文字头像。服饰与场景为艺术演绎，不声称历史复原。</desc><defs><linearGradient id="xia-hou-yuan-bg" x2=".8" y2="1"><stop stop-color="#6a5c59"/><stop offset="1" stop-color="#242e3c"/></linearGradient><linearGradient id="xia-hou-yuan-robe" x2=".8" y2="1"><stop stop-color="#7c5b4e"/><stop offset="1" stop-color="#354958"/></linearGradient><linearGradient id="xia-hou-yuan-skin" x2=".8" y2=".8"><stop stop-color="#efd4ad"/><stop offset="1" stop-color="#ae7654"/></linearGradient><linearGradient id="xia-hou-yuan-metal" x2="1" y2="1"><stop stop-color="#e2c991"/><stop offset=".45" stop-color="#a6804d"/><stop offset="1" stop-color="#544b3d"/></linearGradient><radialGradient id="xia-hou-yuan-shade"><stop offset=".5" stop-color="#111923" stop-opacity="0"/><stop offset="1" stop-color="#111923" stop-opacity=".45"/></radialGradient></defs><g stroke-linecap="round" stroke-linejoin="round"><path d="M0 0h300v380H0Z" fill="url(#xia-hou-yuan-bg)" stroke="none" stroke-width="1" /><path d="M0 205 52 140l52 38 70-94 54 51 72-45v290H0Z" fill="#3b4954" stroke="none" stroke-width="1" /><path d="M0 245q121-81 300-67M5 161l70-22m138-69 71-20M4 280l87-35" fill="none" stroke="#b9ad94" stroke-width="1.3" opacity=".35"/><path d="M127 173Q68 170 23 117l18 91-41 7 55 60-43 80q61-15 118-94Z" fill="#9d4b45" stroke="#c68e70" stroke-width="1.2" /><path d="M92 189q-43-12-61-44m69 69-61 7m60 25-49 61" fill="none" stroke="#ce9272" stroke-width="1.2" /><path d="M121 171q-48 31-53 87L47 380h233l-28-145q-25-51-78-70Z" fill="url(#xia-hou-yuan-robe)" stroke="#afa38a" stroke-width="1.4" /><path d="M130 198 92 230l-14 110 131 36 35-37-35-115Z" fill="#374c58" stroke="#9da99e" stroke-width="1.2" /><path d="M108 244h15v6l-7.5 5-7.5-5