  <linearGradient id="cao-copper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e1bd83"/><stop offset=".35" stop-color="#b78454"/><stop offset="1" stop-color="#75543e"/></linearGradient>
  <linearGradient id="cao-skin" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#efc49a"/><stop offset=".52" stop-color="#d9a980"/><stop offset="1" stop-color="#a77459"/></linearGradient>
  <linearGradient id="cao-paper" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f4e4b8"/><stop offset=".55" stop-color="#d9c697"/><stop offset="1" stop-color="#b49f74"/></linearGradient>
