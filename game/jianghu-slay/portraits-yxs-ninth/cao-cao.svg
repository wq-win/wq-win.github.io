<svg xmlns="http://www.w3.org/2000/svg" width="300" height="380" viewBox="0 0 300 380" role="img" aria-labelledby="cao-cao-title cao-cao-desc">
<title id="cao-cao-title">曹操 · 原创人物立绘</title>
<desc id="cao-cao-desc">深青铜色衣袍的中年谋略家，额角微露，眉目沉静，细髭与短长须分明。他一手举起带有谋略纹样的牌，另一手托着折叠军略册，同一纹样出现在另一张牌上，呼应借用牌效果的奸雄。背景是营帐屏风与细绘军阵路线。原生矢量原创，不使用官方游戏美术、外部图像或文字头像；服饰为艺术演绎。</desc>
<defs>
  <linearGradient id="cao-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123036"/><stop offset=".55" stop-color="#293d3d"/><stop offset="1" stop-color="#14272d"/></linearGradient>
  <linearGradient id="cao-screen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a67c4f" stop-opacity=".04"/><stop offset=".58" stop-color="#c5a775" stop-opacity=".21"/><stop offset="1" stop-color="#355955" stop-opacity=".08"/></linearGradient>
  <linearGradient id="cao-robe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4b7776"/><stop offset=".38" stop-color="#285455"/><stop offset="1" stop-color="#132e38"/></linearGradient>
