<svg xmlns="http://www.w3.org/2000/svg" width="300" height="380" viewBox="0 0 300 380" role="img" aria-labelledby="zhen-ji-title zhen-ji-desc">
<title id="zhen-ji-title">甄姬 · 原创人物立绘</title><desc id="zhen-ji-desc">魏地宫装女子披青蓝水纹长袖，墨色垂髻戴银色水滴冠与珍珠，神情沉静，一手抚弦一手执黑纹判定牌；月与洛水波纹围绕，莲叶及反光表现洛神。原生SVG原创，不使用官方美术、外部图片、文字头像或字母占位；服饰与场景为艺术演绎，不声称历史复原。</desc>
