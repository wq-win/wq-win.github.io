<svg xmlns="http://www.w3.org/2000/svg" width="300" height="380" viewBox="0 0 300 380" role="img" aria-labelledby="sima-yi-title sima-yi-desc">
<title id="sima-yi-title">司马懿 · 原创人物立绘</title><desc id="sima-yi-desc">高冠瘦面谋士披紫黑大氅，银灰鬓发与细长胡须，一手持判定替换牌，一手按住星盘；背景为夜色观象楼与星线，衣袖银线如回旋羽翼。原生SVG原创，不使用官方美术、外部图片、文字头像或字母占位；服饰与场景为艺术演绎，不声称历史复原。</desc>
