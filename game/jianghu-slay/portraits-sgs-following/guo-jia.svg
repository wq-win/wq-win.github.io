<svg xmlns="http://www.w3.org/2000/svg" width="300" height="380" viewBox="0 0 300 380" role="img" aria-labelledby="guo-jia-title guo-jia-desc">
<title id="guo-jia-title">郭嘉 · 原创人物立绘</title><desc id="guo-jia-desc">苍白瘦面谋士略微侧倾，松散乌发、青灰额带与厚披巾；双手摊开连星竹纸卷，天际星座、低楼轮廓与冷蓝衣褶呼应天妒和遗计。原创矢量立绘；所有图形为本项目手工编写的原生SVG路径。未使用官方美术、下载图片、嵌入位图或文字头像。服饰与场景为艺术演绎，不声称历史复原。</desc>
