<svg xmlns="http://www.w3.org/2000/svg" width="300" height="380" viewBox="0 0 300 380" role="img" aria-labelledby="diao-chan-title diao-chan-desc">
<title id="diao-chan-title">貂蝉 · 原创人物立绘</title><desc id="diao-chan-desc">侧目含蓄的舞者，乌发双环高髻、梅色层叠长袖与金色簪饰；双手持展开折扇，月轮隐在梅枝后，柔软绸带构成独立的弧线轮廓，呼应闭月和离间。原创矢量立绘；所有图形为本项目手工编写的原生SVG路径。未使用官方美术、下载图片、嵌入位图或文字头像。服饰与场景为艺术演绎，不声称历史复原。</desc>
