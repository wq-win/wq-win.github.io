<svg xmlns="http://www.w3.org/2000/svg" width="300" height="380" viewBox="0 0 300 380" role="img" aria-labelledby="sun-shang-xiang-title sun-shang-xiang-desc">
<title id="sun-shang-xiang-title">孙尚香 · 原创人物立绘</title><desc id="sun-shang-xiang-desc">英气短圆面女弓手，扬起的侧马尾与朱红发带、铜金肩甲和层叠札甲；一臂握箭，另一侧有长弓，背后箭囊和旌旗构成鲜明的武将剪影，呼应枭姬与结姻。原创矢量立绘；所有图形为本项目手工编写的原生SVG路径。未使用官方美术、下载图片、嵌入位图或文字头像。服饰与场景为艺术演绎，不声称历史复原。</desc>
