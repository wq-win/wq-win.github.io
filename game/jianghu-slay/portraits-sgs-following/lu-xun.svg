<svg xmlns="http://www.w3.org/2000/svg" width="300" height="380" viewBox="0 0 300 380" role="img" aria-labelledby="lu-xun-title lu-xun-desc">
<title id="lu-xun-title">陆逊 · 原创人物立绘</title><desc id="lu-xun-desc">青年儒将微低头审视折叠水军地图，方形青冠、温和窄面、青绿交领与浅金衣缘；远处江船、火苗与水线呼应谦逊和连营。原创矢量立绘；所有图形为本项目手工编写的原生SVG路径。未使用官方美术、下载图片、嵌入位图或文字头像。服饰与场景为艺术演绎，不声称历史复原。</desc>
