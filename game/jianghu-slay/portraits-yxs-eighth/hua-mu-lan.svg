<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" role="img" aria-labelledby="title desc">
<title id="title">花木兰 · 原创矢量立绘</title>
<desc id="desc">侧身回望的女战士身着青绿甲胄与梅紫战袍，长发系飘带，臂弯抱着映出衣襟纹样的战盔。背景为苍山、月轮与行军旗影。独立绘制的原生矢量设计，无官方美术、外部图像或文字头像。</desc>
