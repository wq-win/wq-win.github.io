<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3eb"><title>倒水分色 · 游戏小筑</title>
<meta name="description" content="把散落的颜色，慢慢收进玻璃瓶。8 关原创倒水分色谜题，不赶时间，轻点倒水。">
<link rel="stylesheet" href="../css/game-view.css"><link rel="stylesheet" href="assets/water-sort.css">
<script src="js/water-sort-levels.js" defer></script><script src="js/water-sort-engine.js" defer></script><script src="js/third-games-feedback.js" defer></script><script src="js/water-sort.js" defer></script><script src="../js/game-view.js" defer></script>
</head>
<body>
<main class="water-app" data-game-view aria-labelledby="water-title">
<nav class="topbar" aria-label="游戏导航"><a href="index.html" class="back-link">‹ <span>游戏小筑</span></a><span class="wordmark">THE COLOUR ROOM</span><button type="button" class="fullscreen" data-game-fullscreen aria-pressed="false">全屏游戏 ⛶</button></nav>
<header class="heading"><div><p class="eyebrow">一瓶一色 · 慢慢整理</p><h1 id="water-title">倒水<span>分色</span><i aria-hidden="true"></i></h1></div><p class="heading-note">把散落的颜色，<br>收进一份小小的秩序。</p></header>
<section class="play-layout" aria-label="分色谜题">
<div class="play-column">
<div class="board-meta"><div class="level-heading"><span class="level-tag">配色 <b id="level-number">01</b><small> / 08</small></span><h2 id="level-name">先留余地</h2></div><span class="sorted-tag">已分好 <b id="sorted-count">0</b><span id="color-count"> / 5</span></span></div>
<div class="scene" id="scene"><div class="sunbeam" aria-hidden="true"></div><span class="scene-mark" aria-hidden="true">a little less mixed.</span><div id="water-board" class="water-board" role="group" aria-label="玻璃瓶。从来源瓶倒到空瓶或顶色相同的瓶子。"></div><div class="pour-layer" id="pour-layer" aria-hidden="true"></div>
<div class="win-card" id="win-card" hidden><div class="win-drop" aria-hidden="true">✦</div><p class="win-eyebrow">颜色，找到了自己的家</p><h2 id="win-title">这一瓶，刚刚好。</h2><p id="win-detail">本关的颜色都分好了</p><button id="next-level" type="button">下一份色彩 →</button></div>
</div>
<div class="feedback" id="feedback" role="status" aria-live="polite">先选一瓶，再点空瓶或顶色相同的瓶子</div>
<div class="controls"><button type="button" id="restart">↶ 重新开始</button><button type="button" id="undo" disabled>撤销一步</button><label class="level-picker"><span class="sr-only">选择关卡</span><select id="level-select" aria-label="选择关卡"></select><i aria-hidden="true">⌄</i></label><span id="saved" class="saved">进度自动保存</span></div>
</div>
<aside class="guide"><div class="guide-top"><span class="guide-kicker">COLOUR STUDY / 01—08</span><span class="little-star" aria-hidden="true">✳</span></div><h2>让每种颜色，<br>都有一只<br><em>自己的瓶子。</em></h2><div class="guide-illustration" aria-hidden="true"><svg viewBox="0 0 240 160"><defs><linearGradient id="guide-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#bed8d8" stop-opacity=".15"/></linearGradient></defs><ellipse cx="123" cy="142" rx="93" ry="8" fill="#294e4910"/><g transform="rotate(-22 67 68)"><path d="M43 22H91V105Q91 124 67 124Q43 124 43 105Z" fill="url(#guide-glass)" stroke="#789a9b" stroke-width="2"/><path d="M48 62H86V104Q86 119 67 119Q48 119 48 104Z" fill="#87c3cb"/><path d="M48 86H86V104Q86 119 67 119Q48 119 48 104Z" fill="#e9a08e"/><path d="M41 22H93M51 31V99" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M41 22H93" stroke="#789a9b" stroke-width="2"/></g><path d="M113 46Q147 51 153 80" fill="none" stroke="#87c3cb" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 11"/><path d="M139 72H187V119Q187 139 163 139Q139 139 139 119Z" fill="url(#guide-glass)" stroke="#789a9b" stroke-width="2"/><path d="M144 107H182V118Q182 134 163 134Q144 134 144 118Z" fill="#87c3cb"/><path d="M137 72H189M148 81V121" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M137 72H189" stroke="#789a9b" stroke-width="2"/><text x="157" y="126" font-size="15" fill="#233d43">◆</text></svg></div><div class="guide-rules"><p><b>01</b> 先选来源，再选目标</p><p><b>02</b> 空瓶，或顶部颜色相同</p><p><b>03</b> 一次倒尽能装下的连续同色</p></div><p class="guide-footer">装满同色的瓶子，就完成了。<br>不赶时间，给思路留一点空白。</p><div class="palette" id="palette" aria-label="颜色与辨识符号"></div></aside>
</section><p class="sr-only" data-game-view-status role="status"></p>
</main></body></html>
