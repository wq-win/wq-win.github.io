<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>位置编码 | MyLog</title>
    <script>try { if (localStorage.getItem('mylog-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#3b82f6' } } } };</script>
    <link rel="alternate" type="application/rss+xml" title="MyLog RSS" href="../../rss.xml">
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="site-header"></div>
    <main class="container mx-auto px-4 py-10 max-w-5xl">
        <p class="text-sm text-gray-500 mb-3"><a href="../index.html" class="text-primary">演示</a> / <a href="index.html" class="text-primary">大语言模型</a> / 位置编码</p>
        <h1 class="text-3xl font-bold mb-3">正弦位置编码</h1>
        <p class="text-gray-600 mb-4">横轴是位置，纵轴是维度。低频维变化慢，高频维变化快。点两列看它们的余弦相似度：邻近位置更像，不是一条直线。</p>
        <div class="demo-toolbar">
            <span id="status" class="text-sm text-gray-500">点两列做比较</span>
        </div>
        <canvas id="c" class="demo-canvas"></canvas>
        <p class="text-sm mt-4"><a class="text-primary" href="../../llm/015-transformer.html">对照精读：Transformer</a> · <a class="text-primary" href="../../llm/046-rope.html">RoPE</a></p>
    </main>
    <div id="site-footer"></div>
    <script src="../../js/site-config.js"></script>
    <script src="../../js/site-chrome.js"></script>
    <script src="../js/demo-kit.js"></script>
    <script>
        SeriesChrome.mount({ root: '../../', active: 'llm' });
        const POS = 32, DIM = 24, W = 920, H = 520;
        const view = DemoKit.setupCanvas(document.getElementById('c'), W, H), ctx = view.ctx;
        const pe = [];
        for (let p = 0; p < POS; p += 1) {
            pe[p] = [];
            for (let i = 0; i < DIM; i += 1) {
                const exp = Math.pow(10000, Math.floor(i / 2) * 2 / DIM);
                pe[p][i] = (i % 2 === 0) ? Math.sin(p / exp) : Math.cos(p / exp);
            }
        }
        let a = 3, b = 10;
        const left = 70, top = 40, cw = 22, ch = 14;
        function cosine(i, j) {
            let dot = 0, na = 0, nb = 0;
            for (let k = 0; k < DIM; k += 1) {
                dot += pe[i][k] * pe[j][k];
                na += pe[i][k] * pe[i][k];
                nb += pe[j][k] * pe[j][k];
            }
            return dot / Math.sqrt(na * nb);
        }
        function draw() {
            DemoKit.drawPanel(ctx, W, H);
            for (let p = 0; p < POS; p += 1) {
                for (let i = 0; i < DIM; i += 1) {
                    const t = (pe[p][i] + 1) / 2;
                    ctx.fillStyle = DemoKit.viridis(t);
                    ctx.fillRect(left + p * cw, top + i * ch, cw - 1, ch - 1);
                }
            }
            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 2;
            ctx.strokeRect(left + a * cw, top, cw - 1, DIM * ch);
            ctx.strokeStyle = '#fbbf24';
            ctx.strokeRect(left + b * cw, top, cw - 1, DIM * ch);
            ctx.fillStyle = '#94a3b8';
            ctx.font = '12px ui-sans-serif';
            for (let p = 0; p < POS; p += 4) ctx.fillText(String(p), left + p * cw, top + DIM * ch + 18);
            ctx.fillText('位置 →', left, H - 24);
            ctx.save(); ctx.translate(22, top + 80); ctx.rotate(-Math.PI / 2); ctx.fillText('维度', 0, 0); ctx.restore();
            const sim = cosine(a, b);
            ctx.fillStyle = '#e2e8f0';
            ctx.font = '16px ui-sans-serif';
            ctx.fillText('pos ' + a + ' 与 pos ' + b + ' 的余弦相似度  ' + sim.toFixed(3), left, H - 48);
            document.getElementById('status').textContent = '已选位置 ' + a + ' 和 ' + b;
        }
        document.getElementById('c').onclick = (event) => {
            const p = DemoKit.pointer(document.getElementById('c'), event, view);
            const col = Math.floor((p.x - left) / cw);
            if (col >= 0 && col < POS) { a = b; b = col; draw(); }
        };
        draw();
    </script>
</body>
</html>
