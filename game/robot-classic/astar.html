<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A* 寻路 | MyLog</title>
    <script>try { if (localStorage.getItem('mylog-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#3b82f6' } } } };</script>
    <link rel="alternate" type="application/rss+xml" title="MyLog RSS" href="../../rss.xml">
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="site-header"></div>
    <main class="container mx-auto px-4 py-10 max-w-5xl">
        <p class="text-sm text-gray-500 mb-3"><a href="../index.html" class="text-primary">演示</a> / <a href="index.html" class="text-primary">机器人经典</a> / A*</p>
        <h1 class="text-3xl font-bold mb-3">A* 与 Dijkstra</h1>
        <p class="text-gray-600 mb-4">墙把直线堵死了。A* 用曼哈顿启发，展开的格子会偏向终点；Dijkstra 把启发关掉，展开得更圆。点格子改墙，Shift+点改终点。启发权重大于 1 会更贪心、不一定最优。</p>
        <div class="demo-toolbar">
            <button id="astar" class="bg-primary text-white">A*</button>
            <button id="dijkstra" class="border">Dijkstra</button>
            <button id="reset" class="border">恢复迷宫</button>
            <label>启发权重 <input id="hw" type="range" min="0" max="30" value="10" data-scale="0.1" data-digits="1"></label>
            <label>速度 <input id="speed" type="range" min="1" max="40" value="16"></label>
            <span id="status" class="text-sm text-gray-500"></span>
        </div>
        <canvas id="c" class="demo-canvas"></canvas>
        <div class="demo-legend">
            <span><i style="background:#fde68a"></i>open</span>
            <span><i style="background:#38bdf8"></i>已扩展</span>
            <span><i style="background:#4ade80"></i>路径</span>
        </div>
        <p class="text-sm mt-3"><a class="text-primary" href="../../robot-classic/003-astar.html">对照精读：A*</a></p>
    </main>
    <div id="site-footer"></div>
    <script src="../../js/site-config.js"></script>
    <script src="../../js/site-chrome.js"></script>
    <script src="../js/demo-kit.js"></script>
    <script>
        SeriesChrome.mount({ root: '../../', active: 'robot-classic' });
        const maze = DemoKit.parseMaze(DemoKit.DETOUR_MAZE);
        const W = 900, H = 540, view = DemoKit.setupCanvas(document.getElementById('c'), W, H), ctx = view.ctx;
        const cell = Math.min((W - 36) / maze.width, (H - 36) / maze.height);
        const ox = (W - maze.width * cell) / 2, oy = (H - maze.height * cell) / 2;
        let paint = {}, path = [], searching = false;
        function key(x, y) { return x + ',' + y; }
        function draw() {
            DemoKit.drawPanel(ctx, W, H);
            for (let y = 0; y < maze.height; y += 1) {
                for (let x = 0; x < maze.width; x += 1) {
                    const px = ox + x * cell, py = oy + y * cell, k = key(x, y);
                    let color = '#0f172a';
                    if (maze.walls.has(k)) color = '#334155';
                    else if (paint[k] === 'path') color = '#4ade80';
                    else if (paint[k] === 'closed') color = '#0ea5e9';
                    else if (paint[k] === 'open') color = '#f59e0b';
                    ctx.fillStyle = color;
                    DemoKit.roundRect(ctx, px + 1.5, py + 1.5, cell - 3, cell - 3, 6);
                    ctx.fill();
                }
            }
            ctx.fillStyle = '#7dd3fc';
            ctx.beginPath(); ctx.arc(ox + (maze.start.x + 0.5) * cell, oy + (maze.start.y + 0.5) * cell, cell * 0.22, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#86efac';
            ctx.beginPath(); ctx.arc(ox + (maze.goal.x + 0.5) * cell, oy + (maze.goal.y + 0.5) * cell, cell * 0.24, 0, Math.PI * 2); ctx.fill();
        }
        function h(x, y, useH) { return useH ? DemoKit.rangeValue('hw') * (Math.abs(x - maze.goal.x) + Math.abs(y - maze.goal.y)) : 0; }
        async function search(useH) {
            if (searching) return;
            searching = true;
            paint = {}; path = [];
            const open = [{ x: maze.start.x, y: maze.start.y, g: 0, f: h(maze.start.x, maze.start.y, useH) }];
            const came = {}, gScore = { [key(maze.start.x, maze.start.y)]: 0 }, seen = new Set();
            let expanded = 0;
            while (open.length) {
                open.sort((a, b) => a.f - b.f || a.g - b.g);
                const cur = open.shift();
                const ck = key(cur.x, cur.y);
                if (seen.has(ck)) continue;
                seen.add(ck);
                paint[ck] = 'closed';
                expanded += 1;
                if (cur.x === maze.goal.x && cur.y === maze.goal.y) {
                    let p = ck;
                    while (came[p]) { paint[p] = 'path'; p = came[p]; }
                    paint[key(maze.start.x, maze.start.y)] = 'path';
                    document.getElementById('status').textContent = (useH ? 'A*' : 'Dijkstra') + ' 扩展 ' + expanded + ' 格 · 路径 ' + cur.g;
                    draw();
                    searching = false;
                    return;
                }
                [[1,0],[0,1],[-1,0],[0,-1]].forEach(([dx, dy]) => {
                    const nx = cur.x + dx, ny = cur.y + dy, nk = key(nx, ny);
                    if (nx < 0 || ny < 0 || nx >= maze.width || ny >= maze.height || maze.walls.has(nk)) return;
                    const g = cur.g + 1;
                    if (g < (gScore[nk] === undefined ? Infinity : gScore[nk])) {
                        gScore[nk] = g; came[nk] = ck;
                        open.push({ x: nx, y: ny, g, f: g + h(nx, ny, useH) });
                        if (!seen.has(nk)) paint[nk] = 'open';
                    }
                });
                draw();
                await new Promise((r) => setTimeout(r, DemoKit.frameDelay(16)));
            }
            document.getElementById('status').textContent = '无路径';
            searching = false;
            draw();
        }
        document.getElementById('c').onclick = (event) => {
            const p = DemoKit.pointer(document.getElementById('c'), event, view);
            const x = Math.floor((p.x - ox) / cell), y = Math.floor((p.y - oy) / cell);
            if (x <= 0 || y <= 0 || x >= maze.width - 1 || y >= maze.height - 1) return;
            if (x === maze.start.x && y === maze.start.y) return;
            if (event.shiftKey && !maze.walls.has(key(x, y))) {
                maze.goal = { x: x, y: y };
                paint = {}; draw();
                return;
            }
            if (x === maze.goal.x && y === maze.goal.y) return;
            const k = key(x, y);
            if (maze.walls.has(k)) maze.walls.delete(k); else maze.walls.add(k);
            paint = {}; draw();
        };
        document.getElementById('astar').onclick = () => search(true);
        document.getElementById('dijkstra').onclick = () => search(false);
        document.getElementById('reset').onclick = () => {
            const fresh = DemoKit.parseMaze(DemoKit.DETOUR_MAZE);
            maze.walls = fresh.walls; paint = {}; draw();
        };
        draw();
    </script>
</body>
</html>
