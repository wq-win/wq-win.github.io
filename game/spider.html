<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>蜘蛛纸牌 | MyLog</title>
    <script>try { if (localStorage.getItem('mylog-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
    <script src="/js/vendor/tailwind.js"></script>
    <link href="/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/game-view.css?v=single-viewport-20261018">
    <link rel="stylesheet" href="../css/spider.css?v=single-viewport-20261018">
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#3b82f6' } } } };</script>
    <link rel="alternate" type="application/rss+xml" title="MyLog RSS" href="../rss.xml">
</head>
<body class="bg-gray-50 text-gray-800 card-page game-page-body">
    <div id="site-header"></div>
    <main class="game-page mx-auto px-4 py-10">
        <p class="text-sm text-gray-500 mb-3"><a href="index.html" class="text-primary">演示</a> / 休闲</p>
        <h1 class="text-3xl font-bold mb-3">蜘蛛纸牌</h1>
        <p class="text-gray-600 mb-4">两副牌，十列。点数可以递减着接，只有同花色的一段才能一起搬走。收齐同一花色的 K 到 A 就消掉一组。</p>
        <div class="game-view card-table spider-table" data-game-view>
            <div class="spider-topbar game-view-toolbar">
                <span class="spider-room"><span aria-hidden="true">♠</span> 蜘蛛纸牌 <small>两副 · 十列</small></span>
                <span id="spider-status" class="spider-status"></span>
                <button type="button" id="spider-new">新局 ↻</button>
                <button type="button" data-game-fullscreen class="game-fullscreen" aria-pressed="false">全屏游戏 ⛶</button>
                <span data-game-view-status class="game-view-status" role="status" aria-live="polite"></span>
            </div>
            <div class="spider-controls">
                <div class="spider-actions">
                    <button type="button" id="spider-undo">撤销</button>
                    <button type="button" id="spider-hint">提示</button>
                    <button type="button" data-suits="1">一色</button>
                    <button type="button" data-suits="2">两色</button>
                    <button type="button" data-suits="4">四色</button>
                </div>
                <div class="spider-reserve">
                    <div id="spider-stock" class="spider-stock"></div>
                    <div id="spider-done" class="spider-done"></div>
                </div>
            </div>
            <div class="spider-board" role="region" aria-label="十列牌区，窄屏可左右滑动" tabindex="0">
                <div id="spider-cols" class="spider-cols"></div>
            </div>
            <p class="spider-note">先点要移动的牌，再点目标列。空列可以放任意一段。有空列时不能从牌堆发牌。窄屏可左右滑动牌区。</p>
        </div>
    </main>
    <div id="site-footer"></div>
    <script src="../js/site-config.js"></script>
    <script src="../js/site-chrome.js"></script>
    <script>SeriesChrome.mount({ root: '../' });</script>
    <script src="../js/spider.js?v=faces"></script>
    <script src="../js/game-view.js"></script>
</body>
</html>
