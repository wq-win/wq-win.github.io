<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗地主残局 | MyLog</title>
    <script>try { if (localStorage.getItem('mylog-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
    <script src="/js/vendor/tailwind.js"></script>
    <link href="/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cards.css">
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#3b82f6' } } } };</script>
    <link rel="alternate" type="application/rss+xml" title="MyLog RSS" href="../rss.xml">
</head>
<body class="bg-gray-50 text-gray-800 card-page">
    <div id="site-header"></div>
    <main class="container mx-auto px-4 py-10 max-w-5xl">
        <p class="text-sm text-gray-500 mb-3"><a href="index.html" class="text-primary">演示</a> / 休闲</p>
        <h1 class="text-3xl font-bold mb-3">斗地主残局</h1>
        <p class="text-gray-600 mb-4">1v1 明牌。一手大约八到十二张，先把对手的 2、王或炸弹引出来，该不出就不出，再把剩下的牌走完。对手只走必胜着法。</p>
        <div class="card-table">
            <div id="dd-win" class="dd-win" hidden>
                <div class="dd-win-copy">
                    <strong id="dd-win-title">过关</strong>
                    <span id="dd-win-sub">下一关</span>
                </div>
            </div>
            <div id="dd-levels" class="dd-levels"></div>
            <div class="dd-label">对手</div>
            <div id="dd-opp" class="dd-row"></div>
            <div id="dd-trick" class="dd-trick">你先出</div>
            <div class="dd-actions">
                <button type="button" id="dd-play">出牌</button>
                <button type="button" id="dd-pass">不出</button>
                <button type="button" id="dd-retry">重来</button>
                <span id="dd-status" class="dd-status"></span>
            </div>
            <div class="dd-label">你</div>
            <div id="dd-you" class="dd-row"></div>
        </div>
        <p class="dd-note">点选手牌再出牌。单张、对子、三张、三带、顺子、连对、飞机、炸弹和王炸都算。走错之后，对手会按能赢的方式把牌出完。过关后自动进入下一关。</p>
    </main>
    <div id="site-footer"></div>
    <script src="../js/site-config.js"></script>
    <script src="../js/site-chrome.js"></script>
    <script>SeriesChrome.mount({ root: '../' });</script>
    <script src="../js/doudizhu-engine.js"></script>
    <script src="../js/doudizhu-levels.js"></script>
    <script>
        (function () {
            var host = document.getElementById('dd-levels');
            (window.DOUDIZHU_LEVELS || []).forEach(function (level) {
                var button = document.createElement('button');
                button.type = 'button';
                button.setAttribute('data-level', String(level.id));
                button.textContent = String(level.id);
                button.title = '你 ' + level.youText + ' / 对手 ' + level.oppText;
                host.appendChild(button);
            });
        }());
    </script>
    <script src="../js/doudizhu.js"></script>
</body>
</html>
