<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e9f2e8"><title>泊车出逃 · 游戏小筑</title><meta name="description" content="看清车头，找到出路。50 辆起步、每关增加 20 辆，16 关原创单人停车解谜，轻点彩色小车，让整个停车场轻松出发。"><link rel="stylesheet" href="../css/game-view.css"><link rel="stylesheet" href="assets/parking.css"><script src="js/parking-engine.js" defer></script><script src="js/parking.js" defer></script><script src="../js/game-view.js" defer></script></head>
<body><main class="parking-app" data-game-view aria-labelledby="parking-title">
<nav class="topbar" aria-label="游戏导航"><a href="index.html">‹ 游戏小筑</a><span class="wordmark">LITTLE DEPARTURES</span><button type="button" data-game-fullscreen aria-pressed="false">全屏游戏 ⛶</button></nav>
<header class="heading"><div class="eyebrow">慢慢来，每辆车都有出口</div><h1 id="parking-title">泊车<span>出逃</span><i aria-hidden="true">↗</i></h1><p>看清车头 · 轻点出发</p></header>
<section class="play-layout" aria-label="停车谜题"><div class="play-column"><div class="board-meta"><span class="level-tag">关卡 <b id="level-number">01</b><small>/ 16</small></span><span class="remaining"><i></i> 待出发 <b id="remaining">50</b></span></div>
<div class="scene" id="scene"><div class="scene-label" aria-hidden="true">PARK & GO</div><div class="tree tree-a" aria-hidden="true"></div><div class="tree tree-b" aria-hidden="true"></div><div class="tree tree-c" aria-hidden="true"></div><div class="board-viewport" id="board-viewport"><div class="board" id="parking-board" role="group" aria-label="停车场，按 Tab 选车，回车或空格出发"></div></div><span class="street-mark" aria-hidden="true">出发，去兜风 ↗</span>
<div class="win-card" id="win-card" hidden><span class="win-icon" aria-hidden="true">✦</span><p>一路畅通</p><h2 id="win-title">小车都出发啦！</h2><button id="next-level" type="button">下一站 →</button></div></div>
<div class="zoom-tools" aria-label="停车场缩放"><button type="button" id="zoom-out" aria-label="缩小停车场">−</button><button type="button" id="zoom-reset">全景</button><button type="button" id="zoom-in" aria-label="放大停车场">＋</button><span id="zoom-hint">车辆多时可放大，滑动查看</span><button type="button" id="sound-toggle" aria-pressed="false">声音：关</button></div><div class="feedback" id="feedback" role="status" aria-live="polite">箭头是车头方向，前方空了就能走</div><div class="actions"><button type="button" id="restart">↶ 重新开始</button><label class="level-picker">关卡 <select id="level-select" aria-label="选择关卡"></select><span aria-hidden="true">⌄</span></label></div></div>
<aside class="guide"><div class="guide-number">01—16</div><h2>给小车<br>让一条路。</h2><div class="mini-car" aria-hidden="true">➜</div><p>每辆车只会沿车头方向直行。<br>先让外侧的小车离开，<br>再慢慢解开拥挤的停车场。</p><div class="guide-foot"><span aria-hidden="true">✦</span> 不赶时间，试试也没关系</div><p class="saved" id="saved">进度自动保存在此浏览器</p></aside></section>
<p class="sr-only" data-game-view-status role="status"></p></main></body></html>
