<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMP 运动基元 | MyLog</title>
    <script>try { if (localStorage.getItem('mylog-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#3b82f6' } } } };</script>
    <link rel="alternate" type="application/rss+xml" title="MyLog RSS" href="../../rss.xml">
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="site-header"></div>
    <main class="container mx-auto px-4 py-10 max-w-5xl">
        <p class="text-sm text-gray-500 mb-3"><a href="../index.html" class="text-primary">演示</a> / <a href="index.html" class="text-primary">机器人学习</a> / DMP</p>
        <h1 class="text-3xl font-bold mb-3">DMP 运动基元</h1>
        <p class="text-gray-600 mb-4">灰虚线是示范，绿线是动力学系统重放。拟合在归一化坐标里做，拱形不会因为起点终点同高而被抹成直线。点选新目标看形状怎么被拉过去，或切到绘制再画一条示范。</p>
        <div class="demo-toolbar">
            <button id="mode-goal" class="bg-primary text-white">点选新目标</button>
            <button id="mode-draw" class="border">绘制示范</button>
            <button id="sine" class="border">拱形</button>
            <button id="s" class="border">S 形</button>
            <button id="play" class="border">重放</button>
            <span id="status" class="text-sm text-gray-500">当前：点画布设置终点</span>
        </div>
        <canvas id="c" class="demo-canvas"></canvas>
        <p class="text-sm mt-4"><a class="text-primary" href="../../robot-learn/001-dmp.html">对照精读：DMP</a></p>
    </main>
    <div id="site-footer"></div>
    <script src="../../js/site-config.js"></script>
    <script src="../../js/site-chrome.js"></script>
    <script src="../js/demo-kit.js"></script>
    <script>
        SeriesChrome.mount({ root: '../../', active: 'robot-learn' });
        const W = 900, H = 520, canvas = document.getElementById('c');
        const view = DemoKit.setupCanvas(canvas, W, H), ctx = view.ctx;
        const K = 40, alphaZ = 25, betaZ = alphaZ / 4, alphaS = 4;
        let demo = [], goal, weights = { x: [], y: [] }, origin, scale = 1, playing = false, playPath = [], mode = 'goal';
        let g0;
        function makeSine() {
            const pts = [];
            for (let i = 0; i <= 180; i += 1) {
                const t = i / 180;
                pts.push({ x: 90 + t * 620, y: 380 - Math.sin(t * Math.PI) * 220 });
            }
            return pts;
        }
        function makeS() {
            const pts = [];
            for (let i = 0; i <= 200; i += 1) {
                const t = i / 200;
                pts.push({ x: 110 + t * 580 + Math.sin(t * Math.PI * 2) * 70, y: 90 + t * 310 });
            }
            return pts;
        }
        function resample(pts, n) {
            if (pts.length < 2) return pts.slice();
            let len = 0;
            const acc = [0];
            for (let i = 1; i < pts.length; i += 1) {
                len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
                acc.push(len);
            }
            if (len < 1e-6) return pts.slice(0, 1);
            const out = [];
            for (let i = 0; i < n; i += 1) {
                const target = len * i / (n - 1);
                let k = 1;
                while (k < acc.length && acc[k] < target) k += 1;
                const a = pts[k - 1], b = pts[Math.min(k, pts.length - 1)];
                const span = acc[k] - acc[k - 1] || 1;
                const u = (target - acc[k - 1]) / span;
                out.push({ x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u });
            }
            return out;
        }
        const C = [];
        const Hwidth = [];
        for (let i = 0; i < K; i += 1) C.push(Math.exp(-alphaS * i / (K - 1)));
        for (let i = 0; i < K; i += 1) Hwidth[i] = Math.pow(K, 1.5) / C[i];
        function psi(s, k) {
            return Math.exp(-Hwidth[k] * (s - C[k]) * (s - C[k]));
        }
        function deriv(arr, dt) {
            const d = [];
            for (let i = 0; i < arr.length; i += 1) {
                if (i === 0) d.push((arr[1] - arr[0]) / dt);
                else if (i === arr.length - 1) d.push((arr[i] - arr[i - 1]) / dt);
                else d.push((arr[i + 1] - arr[i - 1]) / (2 * dt));
            }
            const s = [d[0]];
            for (let i = 1; i < d.length - 1; i += 1) s.push(0.25 * d[i - 1] + 0.5 * d[i] + 0.25 * d[i + 1]);
            s.push(d[d.length - 1]);
            return s;
        }
        function fitDim(values) {
            const dt = 1 / (values.length - 1);
            const yd = deriv(values, dt), ydd = deriv(yd, dt);
            const g = values[values.length - 1];
            const w = [];
            for (let k = 0; k < K; k += 1) {
                let num = 0, den = 0;
                for (let i = 0; i < values.length; i += 1) {
                    const t = i / (values.length - 1);
                    const s = Math.exp(-alphaS * t);
                    const f = ydd[i] - alphaZ * (betaZ * (g - values[i]) - yd[i]);
                    const p = psi(s, k);
                    num += p * s * f;
                    den += p * s * s;
                }
                w.push(Math.abs(den) > 1e-8 ? num / den : 0);
            }
            return w;
        }
        function force(s, w) {
            let num = 0, den = 0;
            for (let k = 0; k < K; k += 1) {
                const p = psi(s, k);
                num += p * w[k];
                den += p;
            }
            return (den ? num / den : 0) * s;
        }
        function integrate(dim, gNorm) {
            const n = 800, dt = 1 / (n - 1);
            let y = 0, yd = 0, s = 1;
            const out = [y];
            for (let i = 1; i < n; i += 1) {
                const f = force(s, weights[dim]);
                const ydd = alphaZ * (betaZ * (gNorm - y) - yd) + f;
                yd += ydd * dt;
                y += yd * dt;
                s += -alphaS * s * dt;
                if (!Number.isFinite(y)) y = gNorm;
                out.push(y);
            }
            return out;
        }
        function rollout() {
            const gx = (goal.x - origin.x) / scale;
            const gy = (goal.y - origin.y) / scale;
            const xs = integrate('x', gx);
            const ys = integrate('y', gy);
            return xs.map((x, i) => ({ x: origin.x + x * scale, y: origin.y + ys[i] * scale }));
        }
        function clampGoal(p) {
            return { x: DemoKit.clamp(p.x, 24, W - 24), y: DemoKit.clamp(p.y, 24, H - 24) };
        }
        function setDemo(pts, keepGoal) {
            demo = resample(pts, 200);
            origin = { x: demo[0].x, y: demo[0].y };
            g0 = { x: demo[demo.length - 1].x, y: demo[demo.length - 1].y };
            scale = 1;
            demo.forEach((p) => { scale = Math.max(scale, Math.hypot(p.x - origin.x, p.y - origin.y)); });
            weights.x = fitDim(demo.map((p) => (p.x - origin.x) / scale));
            weights.y = fitDim(demo.map((p) => (p.y - origin.y) / scale));
            if (!keepGoal || !goal) {
                let gx = g0.x + 80, gy = g0.y - 40;
                if (gx > W - 30) gx = g0.x - 80;
                if (gy < 30) gy = g0.y + 40;
                goal = clampGoal({ x: gx, y: gy });
            }
            playPath = rollout();
            draw();
        }
        function draw(cursor) {
            DemoKit.drawPanel(ctx, W, H);
            ctx.strokeStyle = '#64748b';
            ctx.setLineDash([7, 6]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            demo.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.strokeStyle = '#4ade80';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            playPath.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
            ctx.stroke();
            if (cursor) {
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 7, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(origin.x, origin.y, 7, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.arc(g0.x, g0.y, 6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#86efac'; ctx.beginPath(); ctx.arc(goal.x, goal.y, 8, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#94a3b8';
            ctx.font = '13px ui-sans-serif';
            ctx.fillText('灰：示范    绿：DMP    亮绿点：新目标', 24, 28);
        }
        async function play() {
            const path = rollout();
            playPath = [];
            playing = true;
            for (let i = 0; i < path.length; i += 6) {
                playPath = path.slice(0, i + 1);
                draw(path[i]);
                await new Promise((r) => setTimeout(r, 10));
            }
            playPath = path;
            playing = false;
            draw();
        }
        function setMode(next) {
            mode = next;
            document.getElementById('mode-goal').className = next === 'goal' ? 'bg-primary text-white' : 'border';
            document.getElementById('mode-draw').className = next === 'draw' ? 'bg-primary text-white' : 'border';
            document.getElementById('status').textContent = next === 'goal' ? '当前：点画布设置终点' : '当前：按住拖动画示范';
        }
        let drawing = false, sketch = [];
        canvas.addEventListener('pointerdown', (event) => {
            const p = DemoKit.pointer(canvas, event, view);
            if (mode === 'draw') {
                drawing = true;
                sketch = [p];
                canvas.setPointerCapture(event.pointerId);
            } else {
                goal = clampGoal(p);
                playPath = rollout();
                draw();
                document.getElementById('status').textContent = '新目标已设置，可点重放';
            }
        });
        canvas.addEventListener('pointermove', (event) => {
            if (!drawing) return;
            sketch.push(DemoKit.pointer(canvas, event, view));
            DemoKit.drawPanel(ctx, W, H);
            ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 3; ctx.beginPath();
            sketch.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
            ctx.stroke();
        });
        function endDraw() {
            if (!drawing) return;
            drawing = false;
            if (sketch.length > 12) {
                setDemo(sketch, false);
                document.getElementById('status').textContent = '已用你画的轨迹拟合，再切回点选新目标';
            } else {
                draw();
            }
            sketch = [];
        }
        canvas.addEventListener('pointerup', endDraw);
        canvas.addEventListener('pointercancel', endDraw);
        document.getElementById('mode-goal').onclick = () => setMode('goal');
        document.getElementById('mode-draw').onclick = () => setMode('draw');
        document.getElementById('sine').onclick = () => setDemo(makeSine(), false);
        document.getElementById('s').onclick = () => setDemo(makeS(), false);
        document.getElementById('play').onclick = play;
        setDemo(makeSine(), false);
    </script>
</body>
</html>
