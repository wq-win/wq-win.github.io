<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>域随机化 | MyLog</title>
    <script>try { if (localStorage.getItem('mylog-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#3b82f6' } } } };</script>
    <link rel="alternate" type="application/rss+xml" title="MyLog RSS" href="../../rss.xml">
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="site-header"></div>
    <main class="container mx-auto px-4 py-10 max-w-5xl">
        <p class="text-sm text-gray-500 mb-3"><a href="../index.html" class="text-primary">演示</a> / <a href="index.html" class="text-primary">机器人学习</a> / 域随机化</p>
        <h1 class="text-3xl font-bold mb-3">域随机化</h1>
        <p class="text-gray-600 mb-4">打开就会飞。红点只用质量=1 时的增益，质量变大后同样时间内还在半路；绿点把多种质量上的增益平均起来，能更靠近目标。点画布改终点。</p>
        <div class="demo-toolbar">
            <button id="run" class="bg-primary text-white">再跑一次</button>
            <label>质量 <input id="mass" type="range" min="28" max="60" value="34" data-scale="0.1" data-digits="1"></label>
            <label>风力 <input id="wind" type="range" min="0" max="30" value="14"></label>
            <label>Kp <input id="kp" type="range" min="8" max="30" value="12" data-scale="0.1" data-digits="1"></label>
            <span id="status" class="text-sm text-gray-500"></span>
        </div>
        <canvas id="c" class="demo-canvas"></canvas>
        <p class="text-sm mt-4"><a class="text-primary" href="../../robot-learn/018-domain-randomization.html">对照精读：Domain Randomization</a></p>
    </main>
    <div id="site-footer"></div>
    <script src="../../js/site-config.js"></script>
    <script src="../../js/site-chrome.js"></script>
    <script src="../js/demo-kit.js"></script>
    <script>
        SeriesChrome.mount({ root: '../../', active: 'robot-learn' });
        const W = 900, H = 520, view = DemoKit.setupCanvas(document.getElementById('c'), W, H), ctx = view.ctx;
        const start = { x: 110, y: 380, vx: 0, vy: 0 };
        let goal = { x: 680, y: 130 };
        const dt = 0.05, kd = 2.2;
        let scaleBC = 1, scaleDR = 1.5, bcPath = [], drPath = [], test = { mass: 3.4, wind: 14 }, playing = false;
        function control(s, scale) {
            const kp = DemoKit.rangeValue('kp');
            return [
                scale * (kp * (goal.x - s.x) - kd * s.vx),
                scale * (kp * (goal.y - s.y) - kd * s.vy)
            ];
        }
        function step(s, u, mass, wind) {
            const ax = (u[0] + wind) / mass;
            const ay = u[1] / mass;
            return {
                x: DemoKit.clamp(s.x + s.vx * dt, 18, W - 18),
                y: DemoKit.clamp(s.y + s.vy * dt, 18, H - 18),
                vx: s.vx + ax * dt,
                vy: s.vy + ay * dt
            };
        }
        function rollout(scale, mass, wind) {
            const path = [];
            let s = { x: start.x, y: start.y, vx: 0, vy: 0 };
            for (let t = 0; t < 62; t += 1) {
                path.push({ x: s.x, y: s.y });
                s = step(s, control(s, scale), mass, wind);
            }
            path.push({ x: s.x, y: s.y });
            return path;
        }
        function dist(path) {
            const p = path[path.length - 1];
            return Math.hypot(p.x - goal.x, p.y - goal.y);
        }
        function draw(cut) {
            const n = cut == null ? 9999 : cut;
            const bc = bcPath.slice(0, n);
            const dr = drPath.slice(0, n);
            DemoKit.drawPanel(ctx, W, H);
            ctx.fillStyle = '#14532d';
            DemoKit.roundRect(ctx, goal.x - 18, goal.y - 18, 36, 36, 6);
            ctx.fill();
            ctx.strokeStyle = '#4ade80';
            ctx.lineWidth = 3;
            ctx.strokeRect(goal.x - 18, goal.y - 18, 36, 36);
            ctx.fillStyle = '#bbf7d0';
            ctx.font = '13px ui-sans-serif';
            ctx.fillText('目标', goal.x - 14, goal.y - 26);
            function strokePath(path, color, width) {
                if (!path.length) return;
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                path.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
                ctx.stroke();
            }
            strokePath(bc, '#ef4444', 5);
            strokePath(dr, '#4ade80', 4);
            if (bc.length) {
                const p = bc[bc.length - 1];
                ctx.fillStyle = '#ef4444';
                ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI * 2); ctx.fill();
                ctx.font = '14px ui-sans-serif';
                DemoKit.strokeLabel(ctx, '红：单环境', p.x - 78, p.y + 22);
            }
            if (dr.length) {
                const p = dr[dr.length - 1];
                ctx.fillStyle = '#4ade80';
                ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI * 2); ctx.fill();
                ctx.font = '14px ui-sans-serif';
                DemoKit.strokeLabel(ctx, '绿：域随机化', p.x + 14, p.y - 12);
            }
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(start.x, start.y, 7, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#e2e8f0';
            ctx.font = '13px ui-sans-serif';
            ctx.fillText('质量 ' + test.mass.toFixed(2) + ' · 红线停得更远，绿线更靠近目标', 24, 28);
        }
        async function run() {
            if (playing) return;
            playing = true;
            scaleBC = 1;
            let sum = 0;
            for (let i = 0; i < 24; i += 1) sum += 1.15 + Math.random() * 1.2;
            scaleDR = sum / 24;
            test = { mass: DemoKit.rangeValue('mass'), wind: DemoKit.rangeValue('wind') };
            bcPath = rollout(scaleBC, test.mass, test.wind);
            drPath = rollout(scaleDR, test.mass, test.wind);
            for (let i = 1; i <= bcPath.length; i += 2) {
                draw(i);
                await new Promise((r) => setTimeout(r, 16));
            }
            draw();
            playing = false;
            document.getElementById('status').textContent = '红终点距 ' + dist(bcPath).toFixed(0) + ' · 绿终点距 ' + dist(drPath).toFixed(0);
        }
        document.getElementById('run').onclick = run;
        document.getElementById('c').onclick = (event) => {
            goal = DemoKit.pointer(document.getElementById('c'), event, view);
            goal.x = DemoKit.clamp(goal.x, 40, W - 40);
            goal.y = DemoKit.clamp(goal.y, 40, H - 40);
            run();
        };
        ['mass', 'wind', 'kp'].forEach((id) => {
            document.getElementById(id).addEventListener('input', () => {
                if (playing) return;
                test = { mass: DemoKit.rangeValue('mass'), wind: DemoKit.rangeValue('wind') };
                bcPath = rollout(1, test.mass, test.wind);
                drPath = rollout(scaleDR, test.mass, test.wind);
                draw();
                document.getElementById('status').textContent = '红终点距 ' + dist(bcPath).toFixed(0) + ' · 绿终点距 ' + dist(drPath).toFixed(0);
            });
        });
        run();
    </script>
</body>
</html>
