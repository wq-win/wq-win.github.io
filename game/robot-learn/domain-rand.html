<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>域随机化 | MyLog</title>
    <script>try { if (localStorage.getItem('mylog-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#3b82f6' } } } };</script>
    <link rel="alternate" type="application/rss+xml" title="MyLog RSS" href="../../rss.xml">
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="site-header"></div>
    <main class="container mx-auto px-4 py-10 max-w-5xl">
        <p class="text-sm text-gray-500 mb-3"><a href="../index.html" class="text-primary">演示</a> / <a href="index.html" class="text-primary">机器人学习</a> / 域随机化</p>
        <h1 class="text-3xl font-bold mb-3">域随机化</h1>
        <p class="text-gray-600 mb-4">质点要飞向绿色方块，但测试时质量会变大。红线只用质量=1 时合适的增益，同样时间内还在半路；绿线把多种质量上的增益平均起来，能更靠近目标。</p>
        <div class="demo-toolbar">
            <button id="fit" class="bg-primary text-white">训练两种策略</button>
            <button id="test" class="border">在新环境测试</button>
            <span id="status" class="text-sm text-gray-500">先训练，再测试</span>
        </div>
        <canvas id="c" class="demo-canvas"></canvas>
        <p class="text-sm mt-4"><a class="text-primary" href="../../robot-learn/018-domain-randomization.html">对照精读：Domain Randomization</a></p>
    </main>
    <div id="site-footer"></div>
    <script src="../../js/site-config.js"></script>
    <script src="../../js/site-chrome.js"></script>
    <script src="../js/demo-kit.js"></script>
    <script>
        SeriesChrome.mount({ root: '../../', active: 'robot-learn' });
        const W = 900, H = 520, view = DemoKit.setupCanvas(document.getElementById('c'), W, H), ctx = view.ctx;
        const start = { x: 110, y: 380, vx: 0, vy: 0 };
        const goal = { x: 680, y: 130 };
        const dt = 0.05, kp = 1.2, kd = 2.2;
        let scaleBC = 1, scaleDR = 1.5, bcPath = [], drPath = [], test = { mass: 2.2, wind: 18 }, trained = false;
        function control(s, scale) {
            return [
                scale * (kp * (goal.x - s.x) - kd * s.vx),
                scale * (kp * (goal.y - s.y) - kd * s.vy)
            ];
        }
        function step(s, u, mass, wind) {
            const ax = (u[0] + wind) / mass;
            const ay = u[1] / mass;
            return {
                x: DemoKit.clamp(s.x + s.vx * dt, 18, W - 18),
                y: DemoKit.clamp(s.y + s.vy * dt, 18, H - 18),
                vx: s.vx + ax * dt,
                vy: s.vy + ay * dt
            };
        }
        function rollout(scale, mass, wind) {
            const path = [];
            let s = { x: start.x, y: start.y, vx: 0, vy: 0 };
            for (let t = 0; t < 62; t += 1) {
                path.push({ x: s.x, y: s.y });
                s = step(s, control(s, scale), mass, wind);
            }
            path.push({ x: s.x, y: s.y });
            return path;
        }
        function dist(path) {
            const p = path[path.length - 1];
            return Math.hypot(p.x - goal.x, p.y - goal.y);
        }
        function draw() {
            DemoKit.drawPanel(ctx, W, H);
            ctx.fillStyle = '#1e293b';
            DemoKit.roundRect(ctx, goal.x - 16, goal.y - 16, 32, 32, 6);
            ctx.fill();
            ctx.strokeStyle = '#4ade80';
            ctx.lineWidth = 2;
            ctx.strokeRect(goal.x - 16, goal.y - 16, 32, 32);
            function strokePath(path, color) {
                if (!path.length) return;
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                path.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
                ctx.stroke();
                const last = path[path.length - 1];
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.arc(last.x, last.y, 6, 0, Math.PI * 2); ctx.fill();
            }
            strokePath(bcPath, '#f87171');
            strokePath(drPath, '#4ade80');
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(start.x, start.y, 7, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#7dd3fc';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(40, 80);
            ctx.lineTo(40 + test.wind * 1.4, 80);
            ctx.stroke();
            ctx.fillStyle = '#94a3b8';
            ctx.font = '13px ui-sans-serif';
            ctx.fillText('红：只在质量=1 上学的增益    绿：在随机质量上平均后的增益    风 →  质量 ' + test.mass.toFixed(2), 24, 28);
        }
        document.getElementById('fit').onclick = () => {
            scaleBC = 1;
            let sum = 0;
            for (let i = 0; i < 24; i += 1) sum += 1.15 + Math.random() * 1.2;
            scaleDR = sum / 24;
            trained = true;
            bcPath = [];
            drPath = [];
            draw();
            document.getElementById('status').textContent = '单环境增益 1.0，域随机化平均增益 ' + scaleDR.toFixed(2) + '，再点测试';
        };
        document.getElementById('test').onclick = () => {
            if (!trained) document.getElementById('fit').click();
            test = { mass: 3.2 + Math.random() * 0.4, wind: 12 + Math.random() * 8 };
            bcPath = rollout(scaleBC, test.mass, test.wind);
            drPath = rollout(scaleDR, test.mass, test.wind);
            draw();
            document.getElementById('status').textContent = '测试质量 ' + test.mass.toFixed(2) + '、风力 ' + test.wind.toFixed(0) + ' · 红终点距 ' + dist(bcPath).toFixed(0) + ' · 绿终点距 ' + dist(drPath).toFixed(0);
        };
        draw();
    </script>
</body>
</html>
