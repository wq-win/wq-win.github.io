<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAgger 模仿 | MyLog</title>
    <script>try { if (localStorage.getItem('mylog-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#3b82f6' } } } };</script>
    <link rel="alternate" type="application/rss+xml" title="MyLog RSS" href="../../rss.xml">
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="site-header"></div>
    <main class="container mx-auto px-4 py-10 max-w-5xl">
        <p class="text-sm text-gray-500 mb-3"><a href="../index.html" class="text-primary">演示</a> / <a href="index.html" class="text-primary">机器人学习</a> / DAgger</p>
        <h1 class="text-3xl font-bold mb-3">行为克隆 vs DAgger</h1>
        <p class="text-gray-600 mb-4">灰带是路。红线只模仿专家在路上的动作，稍一偏就按“沿路开”把误差放大；绿线会在自己走偏的地方问专家怎么回来。噪声是测试扰动：拉大后红更容易冲出，绿仍应贴路，不该在坡顶打转。</p>
        <div class="demo-toolbar">
            <button id="run" class="bg-primary text-white">再跑一次</button>
            <label>噪声 <input id="noise" type="range" min="2" max="30" value="14" data-scale="0.01" data-digits="2"></label>
            <label>DAgger 轮数 <input id="rounds" type="range" min="4" max="12" value="8"></label>
            <span id="status" class="text-sm text-gray-500"></span>
        </div>
        <canvas id="c" class="demo-canvas"></canvas>
        <p class="text-sm mt-4"><a class="text-primary" href="../../robot-learn/006-dagger.html">对照精读：DAgger</a></p>
    </main>
    <div id="site-footer"></div>
    <script src="../../js/site-config.js"></script>
    <script src="../../js/site-chrome.js"></script>
    <script src="../js/demo-kit.js"></script>
    <script>
        SeriesChrome.mount({ root: '../../', active: 'robot-learn' });
        const W = 900, H = 520, canvas = document.getElementById('c');
        const view = DemoKit.setupCanvas(canvas, W, H), ctx = view.ctx;
        function center(t) {
            const u = DemoKit.clamp(t, 0, 1);
            return { x: 70 + u * 760, y: 270 + Math.sin(u * Math.PI * 2.4) * 145 + Math.sin(u * Math.PI * 5) * 28 };
        }
        function tangent(t) {
            const a = center(Math.max(0, t - 0.008)), b = center(Math.min(1, t + 0.008));
            const dx = b.x - a.x, dy = b.y - a.y, n = Math.hypot(dx, dy) || 1;
            return { x: dx / n, y: dy / n };
        }
        function nearestT(p) {
            let bestT = 0, bestD = 1e12;
            for (let i = 0; i <= 400; i += 1) {
                const t = i / 400, c = center(t);
                const d = (p.x - c.x) * (p.x - c.x) + (p.y - c.y) * (p.y - c.y);
                if (d < bestD) { bestD = d; bestT = t; }
            }
            return { t: bestT, dist: Math.sqrt(bestD) };
        }
        function wrap(a) {
            while (a > Math.PI) a -= Math.PI * 2;
            while (a < -Math.PI) a += Math.PI * 2;
            return a;
        }
        function expertSteer(p) {
            const near = nearestT(p);
            const tg = tangent(near.t);
            const road = center(near.t);
            const look = center(Math.min(1, near.t + 0.08));
            const target = near.dist > 10
                ? { x: road.x + tg.x * 34, y: road.y + tg.y * 34 }
                : look;
            const want = Math.atan2(target.y - p.y, target.x - p.x);
            const heading = Math.atan2(p.hy, p.hx);
            const gain = near.dist > 10 ? 2.45 : 1.9;
            return DemoKit.clamp(gain * wrap(want - heading), -0.48, 0.48);
        }
        function feat(p) {
            return [p.x, p.y, p.hx * 110, p.hy * 110];
        }
        function knnAct(data, p, k) {
            if (!data.length) return 0;
            const f = feat(p);
            const scored = data.map((d) => {
                let s = 0;
                for (let i = 0; i < 4; i += 1) s += (d.f[i] - f[i]) * (d.f[i] - f[i]);
                return { s: s, a: d.a };
            });
            scored.sort((a, b) => a.s - b.s);
            const n = Math.min(k, scored.length);
            let num = 0, den = 0;
            for (let i = 0; i < n; i += 1) {
                const w = 1 / (scored[i].s + 40);
                num += w * scored[i].a;
                den += w;
            }
            return den ? num / den : 0;
        }
        function startPose() {
            const p = center(0), tg = tangent(0);
            return { x: p.x, y: p.y, hx: tg.x, hy: tg.y };
        }
        function run(steerFn, noise) {
            const p = startPose();
            const path = [{ x: p.x, y: p.y, hx: p.hx, hy: p.hy }];
            let off = 0, lastT = 0, stall = 0;
            for (let i = 0; i < 340; i += 1) {
                let a = steerFn(p);
                if (noise) a += (Math.random() - 0.5) * noise;
                a = DemoKit.clamp(a, -0.48, 0.48);
                const ang = Math.atan2(p.hy, p.hx) + a;
                p.hx = Math.cos(ang); p.hy = Math.sin(ang);
                p.x += p.hx * 3.05; p.y += p.hy * 3.05;
                path.push({ x: p.x, y: p.y, hx: p.hx, hy: p.hy });
                const near = nearestT(p);
                if (near.dist > 22) off += 1;
                if (near.t + 0.003 < lastT) stall += 1; else stall = 0;
                lastT = Math.max(lastT, near.t);
                if (stall > 18 || p.x > 890 || p.y < 8 || p.y > 512) break;
            }
            const last = path[path.length - 1];
            return { path: path, off: off, done: last.x >= 820 && nearestT(last).dist < 28 };
        }
        function expertData() {
            const path = run(expertSteer, 0).path;
            return path.map((p) => ({ f: feat(p), a: expertSteer(p), x: p.x, y: p.y }));
        }
        let expertPath = [], bcPath = null, daggerPath = null, playing = false, bcResult = null, dgResult = null;
        function draw(cut) {
            const n = cut == null ? 9999 : cut;
            DemoKit.drawPanel(ctx, W, H);
            ctx.lineWidth = 36;
            ctx.strokeStyle = '#1e293b';
            ctx.lineCap = 'round';
            ctx.beginPath();
            for (let i = 0; i <= 120; i += 1) {
                const p = center(i / 120);
                if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#475569';
            ctx.beginPath();
            for (let i = 0; i <= 120; i += 1) {
                const p = center(i / 120);
                if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
            function strokePath(path, color, width) {
                if (!path || !path.length) return;
                const pts = path.slice(0, n);
                if (!pts.length) return;
                ctx.strokeStyle = color; ctx.lineWidth = width || 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.beginPath();
                pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
                ctx.stroke();
                const last = pts[pts.length - 1];
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.arc(last.x, last.y, 7, 0, Math.PI * 2); ctx.fill();
                return last;
            }
            strokePath(expertPath, 'rgba(148,163,184,0.55)', 2.5);
            const bcLast = strokePath(bcPath, '#ef4444', 4);
            const dgLast = strokePath(daggerPath, '#4ade80', 3.4);
            ctx.font = '14px ui-sans-serif';
            if (bcLast) DemoKit.strokeLabel(ctx, '红：行为克隆', bcLast.x - 86, bcLast.y - 14);
            if (dgLast) DemoKit.strokeLabel(ctx, '绿：DAgger', dgLast.x + 12, dgLast.y + 18);
            ctx.fillStyle = '#94a3b8';
            ctx.font = '13px ui-sans-serif';
            ctx.fillText('灰带是路    红：只模仿专家    绿：走偏了会问专家', 24, 28);
        }
        function trainBc() {
            const noise = DemoKit.rangeValue('noise');
            const data = expertData();
            return run((p) => knnAct(data, p, 4), noise);
        }
        function trainDagger() {
            const noise = DemoKit.rangeValue('noise');
            const collect = Math.max(noise, 0.16);
            const rounds = Math.round(DemoKit.rangeValue('rounds'));
            let data = expertData();
            for (let round = 0; round < rounds; round += 1) {
                const w = data.slice();
                const path = run((p) => knnAct(w, p, 4), collect).path;
                path.forEach((p) => data.push({ f: feat(p), a: expertSteer(p) }));
            }
            return run((p) => knnAct(data, p, 4), noise);
        }
        function phrase(result, color) {
            if (result.off < 20) return color + '贴着路（离路 ' + result.off + ' 步）';
            return color + '冲出赛道（离路 ' + result.off + ' 步）';
        }
        async function play() {
            if (playing) return;
            playing = true;
            document.getElementById('status').textContent = '正在对比两条策略…';
            bcResult = trainBc();
            dgResult = trainDagger();
            bcPath = bcResult.path;
            daggerPath = dgResult.path;
            const len = Math.max(bcPath.length, daggerPath.length);
            for (let i = 2; i <= len; i += 3) {
                draw(i);
                await new Promise((r) => setTimeout(r, 12));
            }
            draw();
            document.getElementById('status').textContent = phrase(bcResult, '红') + ' · ' + phrase(dgResult, '绿');
            playing = false;
        }
        document.getElementById('run').onclick = play;
        expertPath = run(expertSteer, 0).path;
        draw();
        play();
    </script>
</body>
</html>
