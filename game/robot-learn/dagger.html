<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAgger 模仿 | MyLog</title>
    <script>try { if (localStorage.getItem('mylog-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#3b82f6' } } } };</script>
    <link rel="alternate" type="application/rss+xml" title="MyLog RSS" href="../../rss.xml">
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="site-header"></div>
    <main class="container mx-auto px-4 py-10 max-w-5xl">
        <p class="text-sm text-gray-500 mb-3"><a href="../index.html" class="text-primary">演示</a> / <a href="index.html" class="text-primary">机器人学习</a> / DAgger</p>
        <h1 class="text-3xl font-bold mb-3">行为克隆 vs DAgger</h1>
        <p class="text-gray-600 mb-4">灰带是道路。只模仿专家轨迹时，小误差会把车带离训练分布，蓝线容易冲出弯道。DAgger 在学习者自己走到的位置询问专家，绿线更能收回来。</p>
        <div class="demo-toolbar">
            <button id="bc" class="border">只做行为克隆</button>
            <button id="dagger" class="bg-primary text-white">跑 DAgger</button>
            <span id="status" class="text-sm text-gray-500"></span>
        </div>
        <canvas id="c" class="demo-canvas"></canvas>
        <p class="text-sm mt-4"><a class="text-primary" href="../../robot-learn/006-dagger.html">对照精读：DAgger</a></p>
    </main>
    <div id="site-footer"></div>
    <script src="../../js/site-config.js"></script>
    <script src="../../js/site-chrome.js"></script>
    <script src="../js/demo-kit.js"></script>
    <script>
        SeriesChrome.mount({ root: '../../', active: 'robot-learn' });
        const W = 900, H = 520, view = DemoKit.setupCanvas(document.getElementById('c'), W, H), ctx = view.ctx;
        function center(t) {
            return { x: 70 + t * 760, y: 260 + Math.sin(t * Math.PI * 2.2) * 150 + Math.sin(t * Math.PI * 4) * 40 };
        }
        function tangent(t) {
            const a = center(Math.max(0, t - 0.01)), b = center(Math.min(1, t + 0.01));
            const dx = b.x - a.x, dy = b.y - a.y, n = Math.hypot(dx, dy) || 1;
            return { x: dx / n, y: dy / n };
        }
        function normal(t) {
            const tg = tangent(t);
            return { x: -tg.y, y: tg.x };
        }
        function expertSteer(p) {
            let bestT = 0, bestD = 1e9;
            for (let i = 0; i <= 80; i += 1) {
                const t = i / 80, c = center(t);
                const d = (p.x - c.x) ** 2 + (p.y - c.y) ** 2;
                if (d < bestD) { bestD = d; bestT = t; }
            }
            const c = center(bestT), n = normal(bestT), tg = tangent(bestT);
            const offset = (p.x - c.x) * n.x + (p.y - c.y) * n.y;
            const heading = Math.atan2(p.hy, p.hx);
            const want = Math.atan2(tg.y, tg.x);
            let err = want - heading;
            while (err > Math.PI) err -= Math.PI * 2;
            while (err < -Math.PI) err += Math.PI * 2;
            return DemoKit.clamp(-0.045 * offset + 1.3 * err, -0.28, 0.28);
        }
        function features(p) {
            let bestT = 0, bestD = 1e9;
            for (let i = 0; i <= 80; i += 1) {
                const t = i / 80, c = center(t);
                const d = (p.x - c.x) ** 2 + (p.y - c.y) ** 2;
                if (d < bestD) { bestD = d; bestT = t; }
            }
            const c = center(bestT), n = normal(bestT), tg = tangent(bestT);
            const offset = (p.x - c.x) * n.x + (p.y - c.y) * n.y;
            let err = Math.atan2(tg.y, tg.x) - Math.atan2(p.hy, p.hx);
            while (err > Math.PI) err -= Math.PI * 2;
            while (err < -Math.PI) err += Math.PI * 2;
            return [1, offset / 80, err];
        }
        function fit(data) {
            // 3 weights least squares
            const xtx = [[0,0,0],[0,0,0],[0,0,0]], xty = [0,0,0];
            data.forEach((d) => {
                for (let i = 0; i < 3; i += 1) {
                    xty[i] += d.f[i] * d.a;
                    for (let j = 0; j < 3; j += 1) xtx[i][j] += d.f[i] * d.f[j];
                }
            });
            for (let i = 0; i < 3; i += 1) xtx[i][i] += 1e-4;
            // gaussian elimination
            const A = xtx.map((row, i) => row.concat([xty[i]]));
            for (let i = 0; i < 3; i += 1) {
                let max = i;
                for (let r = i + 1; r < 3; r += 1) if (Math.abs(A[r][i]) > Math.abs(A[max][i])) max = r;
                const tmp = A[i]; A[i] = A[max]; A[max] = tmp;
                const piv = A[i][i] || 1e-9;
                for (let j = i; j < 4; j += 1) A[i][j] /= piv;
                for (let r = 0; r < 3; r += 1) if (r !== i) {
                    const f = A[r][i];
                    for (let j = i; j < 4; j += 1) A[r][j] -= f * A[i][j];
                }
            }
            return [A[0][3], A[1][3], A[2][3]];
        }
        function policy(w, p) {
            const f = features(p);
            return DemoKit.clamp(w[0] * f[0] + w[1] * f[1] + w[2] * f[2], -0.28, 0.28);
        }
        function run(steerFn) {
            const p = { x: 70, y: 260, hx: 1, hy: 0 };
            const path = [];
            for (let i = 0; i < 260; i += 1) {
                const a = steerFn(p);
                const ang = Math.atan2(p.hy, p.hx) + a;
                p.hx = Math.cos(ang); p.hy = Math.sin(ang);
                p.x += p.hx * 3.1; p.y += p.hy * 3.1;
                path.push({ x: p.x, y: p.y, hx: p.hx, hy: p.hy });
                if (p.x > 880 || p.y < 20 || p.y > 500) break;
            }
            return path;
        }
        function expertDataset() {
            const data = [];
            const path = run((p) => expertSteer(p));
            path.forEach((p) => data.push({ f: features(p), a: expertSteer(p) }));
            return { data, path };
        }
        function draw(learnerPath, expertPath) {
            DemoKit.drawPanel(ctx, W, H);
            ctx.lineWidth = 34;
            ctx.strokeStyle = '#1e293b';
            ctx.lineCap = 'round';
            ctx.beginPath();
            for (let i = 0; i <= 80; i += 1) {
                const p = center(i / 80);
                if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#475569';
            ctx.beginPath();
            for (let i = 0; i <= 80; i += 1) {
                const p = center(i / 80);
                if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
            function strokePath(path, color) {
                if (!path || !path.length) return;
                ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath();
                path.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
                ctx.stroke();
            }
            strokePath(expertPath, 'rgba(148,163,184,0.7)');
            strokePath(learnerPath, '#4ade80');
            ctx.fillStyle = '#94a3b8';
            ctx.font = '13px ui-sans-serif';
            ctx.fillText('灰：专家    绿：当前学习者', 24, 28);
        }
        document.getElementById('bc').onclick = () => {
            const exp = expertDataset();
            const w = fit(exp.data);
            const path = run((p) => policy(w, p));
            draw(path, exp.path);
            document.getElementById('status').textContent = '行为克隆：只在专家轨迹上训练，弯道后容易冲出';
        };
        document.getElementById('dagger').onclick = () => {
            let data = expertDataset().data;
            let w = fit(data);
            for (let round = 0; round < 6; round += 1) {
                const path = run((p) => policy(w, p));
                path.forEach((p) => data.push({ f: features(p), a: expertSteer(p) }));
                w = fit(data);
            }
            const exp = expertDataset();
            const path = run((p) => policy(w, p));
            draw(path, exp.path);
            document.getElementById('status').textContent = 'DAgger：在学习者自己访问的状态上问专家，6 轮后收回弯道';
        };
        draw(null, expertDataset().path);
    </script>
</body>
</html>
