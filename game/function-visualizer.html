<script>
(() => {
'use strict';
const PI=Math.PI, TAU=2*PI;
const fmt=(n,d=2)=>!Number.isFinite(n)?'不可计算':n===0?'0':(Math.abs(n)>=1e6||Math.abs(n)<1e-3)?Number(n.toPrecision(5)).toExponential().replace('e+','e'):Number(n.toFixed(d)).toString();
const par=(id,name,symbol,min,max,step,value,hint)=>({id,name,symbol,min,max,step,value,hint});
const commonTrig=[par('A','幅值','A',0,3,.05,1,'|A| 控制高度；A < 0 时上下翻转。'),par('w','角频率','ω',.2,3,.05,1,'|ω| 越大，波形越密；单位为 rad/x。'),par('phi','相位','φ',-3.14,3.14,.01,0,'单位为弧度；水平移位量为 −φ/ω。')];
const trigDetail=p=>p.w===0?'ω = 0：当前为常数函数。':`幅值 |A| = ${fmt(Math.abs(p.A))}；周期 T = ${fmt(TAU/Math.abs(p.w))}；水平平移 ${fmt(-p.phi/p.w)}。`;
const gaussian=(x,mu,sigma)=>Math.exp(-.5*((x-mu)/sigma)**2)/(sigma*Math.sqrt(TAU));
const stirlingCorrection=z=>{const r=1/z;return r/12-r**3/360+r**5/1260-r**7/1680+r**9/1188;};
function logBeta(a,b){
 let correction=0;
 while(a<8){correction+=Math.log1p(b/a);a++;}
 while(b<8){correction+=Math.log1p(a/b);b++;}
 const logSum=Math.log(Math.max(a,b))+Math.log1p(Math.min(a,b)/Math.max(a,b));
 return -a*Math.log1p(b/a)-b*Math.log1p(a/b)+.5*(Math.log(TAU)+logSum-Math.log(a)-Math.log(b))+stirlingCorrection(a)+stirlingCorrection(b)-stirlingCorrection(a+b)+correction;
}
function betaDensity(x,p){
 if(x<0||x>1)return NaN;
 if(x===0)return p.alpha<1?Infinity:p.alpha===1?p.beta:0;
 if(x===1)return p.beta<1?Infinity:p.beta===1?p.alpha:0;
 return Math.exp((p.alpha-1)*Math.log(x)+(p.beta-1)*Math.log1p(-x)-logBeta(p.alpha,p.beta));
}
function poissonMass(k,p){
 if(!Number.isSafeInteger(k)||k<0)return NaN;
 if(p.lambda===0)return k===0?1:0;
 if(k===0)return Math.exp(-p.lambda);
 let logP;
 if(k<30){let lf=0;for(let j=2;j<=k;j++)lf+=Math.log(j);logP=k*Math.log(p.lambda)-p.lambda-lf;}
 else{const d=(p.lambda-k)/k;logP=k*(Math.log1p(d)-d)-.5*Math.log(TAU*k)-stirlingCorrection(k);}
 return Math.exp(logP);
}
const shiftParams=()=>[par('a','伸缩系数','a',-3,3,.1,1,'控制竖直伸缩；负数时上下翻转。'),par('h','水平平移','h',-4,4,.1,0,'改变图形的横向位置。'),par('k','竖直平移','k',-4,4,.1,0,'将图形上下移动。')];
const functions=[
 {id:'normal',name:'正态分布',en:'Normal distribution',icon:'M1 18 C8 18 8 3 13 3 S18 18 25 18',formula:'f(x) = exp[−(x − μ)² / (2σ²)] / (σ√(2π))',range:[-10,10,-.05,.9],params:[par('mu','均值','μ',-4,4,.05,0,'决定钟形曲线的中心位置。'),par('sigma','标准差','σ',.5,3,.05,1,'σ 越大，曲线越宽、峰值越低；σ 必须大于 0。')],fn:(x,p)=>Math.exp(-.5*((x-p.mu)/p.sigma)**2)/(p.sigma*Math.sqrt(TAU)),insight:'<b>μ 控制位置，σ 控制分散程度。</b>方差为 σ²；这是概率密度，不是某个点的概率。',detail:p=>`μ = ${fmt(p.mu)}，σ = ${fmt(p.sigma)}，方差 σ² = ${fmt(p.sigma**2,4)}。峰值 = ${fmt(1/(p.sigma*Math.sqrt(TAU)),3)}。`},

function validParameter(p,value){

}
function commitNumber(p){const n=el('number-'+p.id);if(n.value.trim()===''){el('validation-'+p.id).textContent='请输入数值；曲线保留上一次有效值。';n.setAttribute('aria-invalid','true');return;}updateParameter(p,n.value,'number');}

function paintSlider(p){
 const r=el('range-'+p.id),v=values[p.id],b=sliderBounds[current.id][p.id];
 if(v<b.min||v>b.max){
  let span=Math.abs(v)*.5||Math.max(1,p.max-p.min);
  b.min=v-span;b.max=v+span;
  if(!Number.isFinite(b.min))b.min=v;
  if(!Number.isFinite(b.max))b.max=v;
  if(['sigma','sigma1','sigma2','sigmaX','sigmaY'].includes(p.id)||current.id==='beta'||current.id==='logarithm'&&p.id==='base')b.min=Math.max(Number.MIN_VALUE,v*.5);
  if(current.id==='mixture'&&p.id==='w'||current.id==='leakyrelu'&&p.id==='alpha'){b.min=0;b.max=1;}
  if(current.id==='poisson'||current.id==='damped'&&p.id==='decay')b.min=Math.max(0,b.min);

function viewRange(f,p){
 let [xmin,xmax,ymin,ymax]=f.range;

 const scaledY=(ys,force)=>{ys=ys.filter(Number.isFinite);if(!ys.length)return;let lo=Math.min(...ys),hi=Math.max(...ys);if(!force&&Math.max(Math.abs(lo),Math.abs(hi))>(ymax-ymin)*.001)return;let pad=(hi-lo)*.12;if(!(pad>0))pad=Math.abs(lo)*.2||1;ymin=lo-pad;ymax=hi+pad;};

 }else if(f.id==='exponential'){
  if(Math.abs(p.k)>2){xmin=-4/Math.abs(p.k);xmax=4/Math.abs(p.k);}
 }else if(f.id==='power'){
  if(p.p>4)xmax=Math.exp(Math.log(8)/p.p);

 }else if(f.id==='sigmoid'||f.id==='tanh'){

function updateDetail(){if(current.id==='power')el('formula').innerHTML=`y = a x<sup>p</sup>　(${values.p>0?'x ≥ 0':'x > 0'})`;el('current-detail').textContent=current.detail(values);if(el('chart-description'))el('chart-description').textContent=`${current.name}；${current.params.map(p=>p.name+' '+fmt(values[p.id],3)).join('，')}。${current.detail(values)} 坐标随参数自适应。`;}
function ticks(min,max,count){const raw=(max-min)/count;if(!(raw>0)||!Number.isFinite(raw))return [min,max];const power=10**Math.floor(Math.log10(raw));if(!(power>0))return [min,max];const ratio=raw/power;const step=(ratio<=1?1:ratio<=2?2:ratio<=2.5?2.5:ratio<=5?5:10)*power;const first=Math.ceil(min/step)*step,out=[];for(let i=0;i<20;i++){const n=first+i*step;if(n>max+step*.001)break;out.push(Math.abs(n)<step*1e-8?0:n);}return out;}

 for(const tick of yTicks){const y=tick+yoff;grid.appendChild(svg('line',{x1:margin.left,x2:margin.left+W,y1:py(y),y2:py(y),stroke:'var(--grid)','stroke-width':1}));grid.appendChild(svg('text',{x:margin.left-10,y:py(y)+4,'text-anchor':'end'},tickText(tick)));}chart.appendChild(grid);
 chart.appendChild(svg('rect',{x:margin.left,y:margin.top,width:W,height:H,fill:'none',stroke:'var(--border)','stroke-width':1}));const axes=svg('g',{stroke:'var(--axis)','stroke-width':1});if(ymin<=0&&ymax>=0)axes.appendChild(svg('line',{x1:margin.left,x2:margin.left+W,y1:py(0),y2:py(0)}));if(xmin<=0&&xmax>=0)axes.appendChild(svg('line',{x1:px(0),x2:px(0),y1:margin.top,y2:margin.top+H}));chart.appendChild(axes);chart.appendChild(svg('text',{class:'axis-title',x:margin.left,y:14,'text-anchor':'start'},(current.kind==='discrete'?'P(k)':current.id==='normal'||current.density?'f(x)':'y')+(yoff?' − ('+fmt(yoff)+')':'')));chart.appendChild(svg('text',{class:'axis-title',x:margin.left+W/2,y:height-4,'text-anchor':'middle'},(current.kind==='discrete'?'k':'x')+(xoff?' − ('+fmt(xoff)+')':'')));

 const N=Math.max(1200,Math.ceil(W*3));let path='',open=false,previousSegment=null;const points=[];const samples=Array.from({length:N+1},(_,i)=>xmin+(xmax-xmin)*i/N);
