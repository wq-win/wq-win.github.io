<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f4eee2"><meta name="description" content="拆开层层彩色织物，把同色毛线绕成线团。16 关原创单人拆线谜题。"><title>慢慢拆线 · 毛线工坊</title><link rel="stylesheet" href="assets/yarn.css"><script defer src="js/yarn-engine.js"></script><script defer src="js/workshop-feedback.js"></script><script defer src="js/yarn.js"></script></head>
<body><main id="yarn-app" class="workshop"><nav class="topbar" aria-label="游戏导航"><a href="index.html">‹ 游戏小筑</a><span>THE LITTLE YARN STUDIO</span><button id="fullscreen" aria-pressed="false">全屏 ⛶</button></nav>
<header><div><p class="eyebrow">一点耐心，解开一团柔软</p><h1>慢慢拆线<span class="title-star" aria-hidden="true">✳</span></h1><p class="subtitle">挑一缕线头，让颜色慢慢归位。</p></div><div class="level-picker"><label for="level">工坊手记 · 关卡</label><select id="level" aria-label="选择关卡"></select></div></header>
<section class="play-layout"><section class="loom" aria-label="分层织物棋盘"><div class="scene-label"><span>手作台 / <b id="stage-name">初识线头</b></span><span id="remaining"></span></div><div class="wood-rail" aria-hidden="true"></div><div id="threads" class="threads"></div><div class="loom-note"><span aria-hidden="true">↟</span> 点顶部线头 · 下层颜色会依次露出</div><div id="flight" class="flight" aria-hidden="true"></div></section>
<aside class="bench"><div class="bench-heading"><p class="eyebrow">COLLECT & UNWIND</p><h2>收线小篮</h2><p>凑齐 3 缕同色，自动绕成线团。</p></div><div class="tray-caption"><span>暂存位置</span><span><b id="slot-count">0</b> / 6</span></div><div id="tray" class="tray" aria-label="六格暂存篮"></div><div class="progress-label"><span>已收好</span><span><b id="cleared">0</b> / <span id="total">9</span> 缕</span></div><progress id="progress" value="0" max="9" aria-label="收线进度"></progress><p id="status" role="status" aria-live="polite">先观察下层颜色，再选择线头。</p><div id="result" class="result" hidden><h2 id="result-title"></h2><p id="result-copy"></p><button id="next" class="primary">下一关 →</button></div><button id="restart" class="restart">↻ 重新整理本关</button><div class="workshop-actions"><button id="undo" type="button">↶ 撤销一步</button><button id="sound" type="button" aria-pressed="false">音效：关</button></div><div class="rules"><h3>一缕一缕，慢慢来</h3><p>每块织物只能拆最上方一层。6 格全部占满且未凑成三缕，本关就需重试。</p><p>没有倒计时。看清顺序，比手快重要。</p></div></aside></section>
<footer><span>16 页手作手记 · 进度自动保存在此设备</span><span>UNRAVEL A LITTLE JOY</span></footer></main></body></html>
