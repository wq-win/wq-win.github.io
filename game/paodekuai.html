<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑得快 | MyLog</title>
    <script>try { if (localStorage.getItem('mylog-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
    <script src="/js/vendor/tailwind.js"></script>
    <link href="/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cards.css">
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#3b82f6' } } } };</script>
    <link rel="alternate" type="application/rss+xml" title="MyLog RSS" href="../rss.xml">
</head>
<body class="bg-gray-50 text-gray-800 card-page">
    <div id="site-header"></div>
    <main class="container mx-auto px-4 py-10 max-w-5xl">
        <p class="text-sm text-gray-500 mb-3"><a href="index.html" class="text-primary">演示</a> / 休闲</p>
        <h1 class="text-3xl font-bold mb-3">跑得快</h1>
        <p class="text-gray-600 mb-4">三人各十六张。黑桃 3 先出，有牌必压。下家只剩一张时，单张必须出手里最大的。</p>
        <div class="card-table">
            <div id="pdk-score" class="pdk-score"></div>
            <div class="pdk-board">
                <section class="pdk-seat" id="pdk-left">
                    <div class="dd-label">上家</div>
                    <div class="pdk-backs"></div>
                    <div class="pdk-meta"></div>
                </section>
                <section class="pdk-mid">
                    <div id="pdk-result" class="pdk-result" hidden>
                        <strong id="pdk-result-title"></strong>
                        <span id="pdk-result-sub"></span>
                    </div>
                    <div id="pdk-trick" class="dd-trick"></div>
                    <div class="dd-actions">
                        <button type="button" id="pdk-play">出牌</button>
                        <button type="button" id="pdk-pass">要不起</button>
                        <button type="button" id="pdk-again">再来一局</button>
                        <span id="pdk-status" class="dd-status"></span>
                    </div>
                </section>
                <section class="pdk-seat" id="pdk-right">
                    <div class="dd-label">下家</div>
                    <div class="pdk-backs"></div>
                    <div class="pdk-meta"></div>
                </section>
                <div id="pdk-you" class="pdk-hand"></div>
            </div>
        </div>
        <p class="dd-note">点选手牌再出牌。能压就必须压，只剩炸弹能压也要炸。三带二、顺子、连对、飞机和炸弹都算；三张要带两张，最后一手可以少带。</p>
    </main>
    <div id="site-footer"></div>
    <script src="../js/site-config.js"></script>
    <script src="../js/site-chrome.js"></script>
    <script>SeriesChrome.mount({ root: '../' });</script>
    <script src="../js/paodekuai-engine.js"></script>
    <script src="../js/paodekuai.js"></script>
</body>
</html>
