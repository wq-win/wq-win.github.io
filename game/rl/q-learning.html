<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-learning 迷宫 | MyLog</title>
    <script>try { if (localStorage.getItem('mylog-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#3b82f6' } } } };</script>
    <link rel="alternate" type="application/rss+xml" title="MyLog RSS" href="../../rss.xml">
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="site-header"></div>
    <main class="container mx-auto px-4 py-10 max-w-5xl">
        <p class="text-sm text-gray-500 mb-3"><a href="../index.html" class="text-primary">演示</a> / <a href="index.html" class="text-primary">强化学习</a> / Q-learning</p>
        <h1 class="text-3xl font-bold mb-3">Q-learning 迷宫</h1>
        <p class="text-gray-600 mb-4">迷宫必须绕行，不会学成一条直线。格子颜色是状态价值，四个小三角是 Q(s,a)。橙点是正在走的智能体。点格子改墙，Shift+点改终点。</p>
        <div class="demo-toolbar">
            <button id="run" class="bg-primary text-white">开始</button>
            <button id="pause" class="border">暂停</button>
            <button id="reset" class="border">重置</button>
            <label>ε <input id="eps" type="range" min="0" max="60" value="25" data-scale="0.01" data-digits="2"></label>
            <label>α <input id="alpha" type="range" min="15" max="80" value="25" data-scale="0.01" data-digits="2"></label>
            <label>γ <input id="gamma" type="range" min="90" max="99" value="97" data-scale="0.01" data-digits="2"></label>
            <label>速度 <input id="speed" type="range" min="1" max="40" value="12"></label>
            <span id="status" class="text-sm text-gray-500">回合 0 · 步 0</span>
        </div>
        <canvas id="c" class="demo-canvas"></canvas>
        <div class="demo-legend">
            <span><i style="background:#334155"></i>墙</span>
            <span><i style="background:#38bdf8"></i>起点</span>
            <span><i style="background:#4ade80"></i>终点</span>
            <span><i style="background:#f59e0b"></i>智能体</span>
            <span>三角越亮，该方向 Q 越大</span>
        </div>
        <p class="text-sm mt-4"><a class="text-primary" href="../../rl/04-q-learning.html">对照精读：Q-learning</a></p>
    </main>
    <div id="site-footer"></div>
    <script src="../../js/site-config.js"></script>
    <script src="../../js/site-chrome.js"></script>
    <script src="../js/demo-kit.js"></script>
    <script>
        SeriesChrome.mount({ root: '../../', active: 'rl' });
        const maze = DemoKit.parseMaze(DemoKit.DETOUR_MAZE);
        const W = 900, H = 540;
        const view = DemoKit.setupCanvas(document.getElementById('c'), W, H);
        const ctx = view.ctx;
        const pad = 18;
        const cell = Math.min((W - pad * 2) / maze.width, (H - pad * 2) / maze.height);
        const ox = (W - maze.width * cell) / 2;
        const oy = (H - maze.height * cell) / 2;
        const ACT = [[1,0],[0,1],[-1,0],[0,-1]];
        let Q = {}, episode = 0, steps = 0, running = false, agent, path = [];
        function key(x, y) { return x + ',' + y; }
        function wall(x, y) { return maze.walls.has(key(x, y)); }
        function qs(x, y) {
            const k = key(x, y);
            if (!Q[k]) Q[k] = [0, 0, 0, 0];
            return Q[k];
        }
        function maxQ(x, y) { return Math.max.apply(null, qs(x, y)); }
        function greedy(x, y) {
            const v = qs(x, y);
            let a = 0;
            for (let i = 1; i < 4; i += 1) if (v[i] > v[a]) a = i;
            return a;
        }
        function resetAgent() {
            agent = { x: maze.start.x, y: maze.start.y };
            path = [{ x: agent.x, y: agent.y }];
        }
        resetAgent();
        function draw() {
            DemoKit.drawPanel(ctx, W, H);
            let vmax = 0.001;
            for (let y = 0; y < maze.height; y += 1) {
                for (let x = 0; x < maze.width; x += 1) {
                    if (!wall(x, y)) vmax = Math.max(vmax, maxQ(x, y));
                }
            }
            for (let y = 0; y < maze.height; y += 1) {
                for (let x = 0; x < maze.width; x += 1) {
                    const px = ox + x * cell, py = oy + y * cell;
                    if (wall(x, y)) {
                        ctx.fillStyle = '#1e293b';
                        DemoKit.roundRect(ctx, px + 1, py + 1, cell - 2, cell - 2, 4);
                        ctx.fill();
                        continue;
                    }
                    ctx.fillStyle = DemoKit.viridis(maxQ(x, y) / vmax);
                    DemoKit.roundRect(ctx, px + 1, py + 1, cell - 2, cell - 2, 5);
                    ctx.fill();
                    const v = qs(x, y);
                    const cx = px + cell / 2, cy = py + cell / 2;
                    const m = Math.max(0.08, Math.max.apply(null, v.map(Math.abs)));
                    v.forEach((q, a) => {
                        const len = 0.18 * cell + 0.28 * cell * Math.max(0, q) / m;
                        ctx.fillStyle = q === Math.max.apply(null, v) ? '#f8fafc' : 'rgba(248,250,252,0.35)';
                        ctx.beginPath();
                        if (a === 0) { ctx.moveTo(cx + len, cy); ctx.lineTo(cx + 4, cy - 5); ctx.lineTo(cx + 4, cy + 5); }
                        if (a === 1) { ctx.moveTo(cx, cy + len); ctx.lineTo(cx - 5, cy + 4); ctx.lineTo(cx + 5, cy + 4); }
                        if (a === 2) { ctx.moveTo(cx - len, cy); ctx.lineTo(cx - 4, cy - 5); ctx.lineTo(cx - 4, cy + 5); }
                        if (a === 3) { ctx.moveTo(cx, cy - len); ctx.lineTo(cx - 5, cy - 4); ctx.lineTo(cx + 5, cy - 4); }
                        ctx.closePath();
                        ctx.fill();
                    });
                }
            }
            ctx.strokeStyle = 'rgba(248,250,252,0.25)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            path.forEach((p, i) => {
                const x = ox + (p.x + 0.5) * cell, y = oy + (p.y + 0.5) * cell;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(ox + (maze.start.x + 0.5) * cell, oy + (maze.start.y + 0.5) * cell, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#4ade80';
            ctx.beginPath();
            ctx.arc(ox + (maze.goal.x + 0.5) * cell, oy + (maze.goal.y + 0.5) * cell, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(ox + (agent.x + 0.5) * cell, oy + (agent.y + 0.5) * cell, cell * 0.28, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff7ed';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        function step() {
            const eps = DemoKit.rangeValue('eps');
            const a = Math.random() < eps ? Math.floor(Math.random() * 4) : greedy(agent.x, agent.y);
            let nx = agent.x + ACT[a][0], ny = agent.y + ACT[a][1];
            let r = -0.02;
            let done = false;
            if (wall(nx, ny) || nx < 0 || ny < 0 || nx >= maze.width || ny >= maze.height) {
                nx = agent.x; ny = agent.y; r = -0.35;
            }
            if (nx === maze.goal.x && ny === maze.goal.y) { r = 1; done = true; }
            const target = done ? r : r + DemoKit.rangeValue('gamma') * maxQ(nx, ny);
            qs(agent.x, agent.y)[a] += DemoKit.rangeValue('alpha') * (target - qs(agent.x, agent.y)[a]);
            agent = { x: nx, y: ny };
            path.push(agent);
            if (path.length > 80) path.shift();
            steps += 1;
            if (done || steps > 180) {
                episode += 1;
                steps = 0;
                resetAgent();
            }
            document.getElementById('status').textContent = '回合 ' + episode + ' · 步 ' + steps;
            draw();
        }
        let timer = 0;
        function loop() {
            if (!running) return;
            step();
            timer = setTimeout(loop, DemoKit.frameDelay(16));
        }
        document.getElementById('run').onclick = () => { if (!running) { running = true; loop(); } };
        document.getElementById('pause').onclick = () => { running = false; clearTimeout(timer); };
        document.getElementById('reset').onclick = () => { running = false; clearTimeout(timer); Q = {}; episode = 0; steps = 0; resetAgent(); draw(); document.getElementById('status').textContent = '回合 0 · 步 0'; };
        document.getElementById('c').onclick = (event) => {
            const p = DemoKit.pointer(document.getElementById('c'), event, view);
            const x = Math.floor((p.x - ox) / cell), y = Math.floor((p.y - oy) / cell);
            const k = key(x, y);
            if (x <= 0 || y <= 0 || x >= maze.width - 1 || y >= maze.height - 1) return;
            if (x === maze.start.x && y === maze.start.y) return;
            if (event.shiftKey && !wall(x, y)) {
                maze.goal = { x: x, y: y };
                draw();
                return;
            }
            if (x === maze.goal.x && y === maze.goal.y) return;
            if (maze.walls.has(k)) maze.walls.delete(k); else maze.walls.add(k);
            draw();
        };
        draw();
    </script>
</body>
</html>
