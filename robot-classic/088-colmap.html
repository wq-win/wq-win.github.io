    <textarea id="md-source" class="hidden" readonly># 088｜COLMAP 的 SfM 基础：重建质量取决于整条链，而不只取决于 BA

[返回总览](00-发展时间线总览.md) · [上一篇：GPMP2](087-gpmp2.md) · [下一篇：ORB-SLAM2](089-orbslam2.md)

**论文**：Johannes L. Schönberger、Jan-Michael Frahm，*Structure-from-Motion Revisited*，CVPR 2016。[作者原文](https://demuc.de/papers/schoenberger2016sfm.pdf) · [COLMAP 官方文档](https://colmap.github.io/)。

**阅读范围**：原文增量 SfM 方法、第 4 节各模块与第 5 节实验、表 1–2。未执行当前版本软件。COLMAP 今天同时提供 SfM 与 MVS，但本文研究的是这篇论文的稀疏重建；不能把后来稠密立体或其他插件能力全部归给本篇。

## 一、一分钟讲明白

给计算机几千张顺序混乱的景点照片，它需要推断每张照片在哪里拍，以及场景中的三维点在哪里。增量 SfM 从少数照片开始，一张张加入。难处是错误会传染：某个相机位置估错，三角化会错；错误三维点又会误导后续相机。

本文没有把希望寄托在一个新的大公式上，而是系统改进这条链：验证图像对的几何类型、挑选更可靠的下一张照片、鲁棒三角化、反复 BA 与重新三角化、把冗余相机分组加速。

实验支持更完整的重建和较好的精度，但它不是所有方法中最快，也不总产生最多三维点。更多注册照片、更多点和更小重投影误差分别反映不同方面。

一句话：**在无序照片的增量 SfM 中，通过更稳健的注册顺序、三角化与迭代修正提高重建完整性，代价是额外优化及依赖图像匹配、场景纹理和几何条件。**

## 二、问题定义

输入是照片集合及可用的相机先验；输出是相机内外参和稀疏三维结构。它通常是离线几何重建，不是按视频时间执行的实时里程计，也不是强化学习。没有奖励、训练回合或控制动作。

SfM 的“运动”可以来自不同游客在不同时间拍摄，并不需要一个真实连续移动的机器人。无外部尺度参考时，重建通常只有相似变换意义上的唯一性。真实物体移动、季节变化、玻璃反射或重复纹理会破坏静态对应假设。

问题不仅是最后的 BA 是否收敛。图像之间匹配太稀可能使模型断开；纯旋转图像对不能稳定提供深度；错误匹配可以把两个物理点合成一条轨迹；选择病态的下一视图会导致后续连锁错误。本文把这些问题分别处理。

## 三、方法：沿着错误传播链逐段改进

### 1. 场景图中的边需要几何解释

第 4.1 节验证基础矩阵、单应性及有标定时的本质矩阵，区分一般场景、平面或全景式关系，并检查图像边缘的水印、时间戳等造成的假连接。

“照片有很多一致匹配”仍不足以初始化三维模型。如果相机只是绕光心转动，匹配可以很好，但缺少深度基线。系统用几何分类避免把这种连接误当成可靠三角化条件。

### 2. 下一张照片：不仅数点，还看分布

一张照片看见很多已知点，不代表位姿一定稳定。如果点都挤在角落，或集中在退化结构上，估计仍可能脆弱。论文以多层网格统计可见点覆盖，给更分散的观测更高分。

教学形式为：

$$S(I)=\sum_{l=1}^{L}w_l\sum_{c\in grid_l}\mathbf1[c\text{ 中有可见点}].$$

同一格被占据一次后不会因为挤入许多点反复加分。粗层反映整体覆盖，细层反映数量。这是计算便宜的几何可靠性代理，不是精确协方差最小化，也不是机器人主动去拍摄新视角的完整策略。

### 3. 一条错误合并的轨迹可能包含多个物理点

第 4.3 节采用基于 RANSAC 的鲁棒三角化。两视图样本要有足够夹角和正深度，再验证其余观测是否支持同一个点。找到一致集合后，把它移除并继续处理剩余观测，恢复错误合并轨迹中的其他点。

普通“所有观测一起最小二乘”可能被大比例外点拖走。递归方案允许一条输入轨迹被拆成多个三维解释。随机采样仍有概率与预算条件，“可处理高外点率”不能写成任意有限时间内百分之百恢复。

### 4. BA、过滤、再三角化形成循环

核心 BA 目标仍是熟悉的鲁棒重投影误差：

$$\min_{P,X}\sum_{(i,k)}\rho\big(\|\pi(P_i,X_k)-x_{ik}\|^2\big).$$

$P_i$ 是相机参数，$X_k$ 是三维点，$x_{ik}$ 是图像观测。新照片加入后做局部 BA；模型增长到一定程度再做全局 BA。姿态修正后，之前无法三角化的观测可能变得可用，所以再三角化、轨迹合并和外点过滤要重新检查。

这一设计不是简单放宽阈值以留下更多点。论文强调新增观测仍应符合过滤阈值，以增加冗余而非积累垃圾。非凸 BA 仍依赖初值；鲁棒损失也无法保证纠正所有错误关联。

### 5. 冗余视图分组

对已经较稳定、重叠很高的一小组照片，固定组内相对参数，优化共同组变换，减少全局 BA 的独立相机变量。最近受新观测影响的照片则保留独立调整能力。

这是近似计算取舍，不等于删掉所有相似照片，也不是所有视图都永久绑在一起。组越大、重叠门槛越宽松，可能更快，也可能牺牲精度。

### 6. 教学伪代码

```text
输入：照片、匹配、可用内参
几何验证图像对，标注退化类型并剔除伪连接
选择可三角化的初始图像对，建立初始相机和点
只要仍有可注册照片：
    根据可见三维点数量及多尺度覆盖选择下一张
    鲁棒估计相机位姿，验证注册质量
    对关联轨迹递归三角化，检查正深度与夹角
    局部 BA，过滤坏观测
    模型增长触发全局修正时：
        再三角化；BA；过滤；补全或合并轨迹
        必要时再次迭代，直到变化变小
        对稳定且高重叠视图使用分组参数化
输出：注册相机、内参、稀疏点及其观测轨迹
```

数学目标主要是重投影一致性；机制改进涉及顺序、关联和变量组织；最终指标还有完整性和耗时。不能把低重投影误差当作唯一目标并通过大量删点“刷好看”。

## 四、实验设置与预算

| 项目 | 原文设置及含义 |
|---|---|
| 数据规模 | 17 个互联网照片集合，共 144,953 张；照片分布无序且视角密度不均 |
| 真值 | Quad 提供相机位置参考；其他集合不能一律宣称有完整三维真值 |
| 对照 | Bundler、VisualSFM、Theia 等；Theia 结果由其作者提供 |
| 匹配输入 | RootSIFT，每张匹配词汇树检索的 100 个近邻；词汇树在无关数据上训练 |
| 计时范围 | 2.7 GHz、256 GB RAM；不含对应搜索，不能称端到端全流程耗时 |
| 输出统计 | 每个集合报告最大重建连通分量，而不是所有成功子模型总和 |
| 模块实验 | 选视图、鲁棒三角化、分组 BA 的独立研究；随机种子与误差条未完整报告 |

## 五、五组结果怎样读

**图 5：顺序影响精度。** 在 Quad 上，不同策略最终注册集合接近，但本文顺序获得较低位置误差。这支持“注册数量相同也可能质量不同”，不能证明覆盖分数等于真实不确定性的精确排序。

**表 2：递归恢复与计算预算。** 非递归穷举得到 861,591 点、约 120.44M 样本；表中非递归 RANSAC 的一个配置得到同样点数、约 3.89M 样本。样本数量约减少 96.8%，并不是运行时间必然同比下降。递归 RANSAC 可恢复更多点，但平均轨迹长度略变，不能只挑点数讲胜利。该表与图 6 的置信参数标注并不完全相同，复现应核对具体配置而非混用。

**表 1：完整性改善。** Rome 74,394 张输入中，本文最大分量注册 20,918 张，VisualSFM 为 14,797 张。差值 6,121，按后者为基线约增加 41.4%；仍有大量照片未进入这一分量，所以不是“所有输入都重建成功”。本方法 10,912 s，VisualSFM 6,012 s，也不是速度全面领先。

**Quad 的位置精度。** 正文报告本方法 0.85 m、VisualSFM 0.89 m、Bundler 1.01 m。相对 VisualSFM 的差值为 0.04 m；不能把其他无真值集合的像素误差都称为厘米级空间精度。表 1 中某些数据的重投影误差也并非本方法最小。

**图 8：分组有收益也有代价。** 不同重叠阈值下，总耗时改善和重投影误差共同变化；论文举例从 0.26 px 到 0.27/0.28/0.29 px，对应不同压缩程度。Colosseum 的特定配置报告整条重建管线耗时下降 36%，不能推广到每个集合，也不能加上已排除的匹配阶段后仍照搬该比例。

以上证据见[原文第 5 节](https://demuc.de/papers/schoenberger2016sfm.pdf)。重建更多照片与更长观测轨迹增强冗余，是合理解释；“一定更准确”仍需真值支持。

## 六、贡献、代价与局限

论文的重要性在于系统工程与算法机制相互配合，缓解增量错误传播。它沿用经典匹配、PnP、三角化和 BA，新增的是更稳健的组织与修正策略，而非从零创造 SfM。

作者的实验证据主要是无序照片集合。我的分析是，它不直接覆盖动态场景、无纹理物体或在线控制延迟；大量 RAM 的实验也不能当成移动机器人板载实时方案。重复纹理仍可能生成几何自洽但物理错误的结构。使用当前 COLMAP 时应固定版本、相机模型、匹配方法与过滤阈值，现代默认选项不必与 2016 年一致。

## 七、教学例子与前置概念

**自构例子，未运行。** 候选照片 A 看见 100 个点，全挤在左上角；B 看见 70 个点，分布在整幅图像。只数点会先选 A，多尺度覆盖可能更偏向 B。没有数值仿真时不能断言 B 一定误差更小，因为三维布局和基线同样重要。这个反例帮助理解“可靠性代理”与“保证”之间的距离。

1. **特征轨迹**：多个图像观测被认为对应同一个物理点的集合。
2. **三角化**：由多条观察射线估计三维点，依赖基线和夹角。
3. **PnP**：由已知三维点及二维观测估计相机位姿。
4. **Bundle Adjustment**：联合优化相机和三维点以降低重投影误差。
5. **退化几何**：某些拍摄运动或点分布无法稳定决定待估参数。

| 原有问题 | 作者的改动 | 为什么可能有效 | 实验证据 | 代价与局限 |
|---|---|---|---|---|
| 早期注册错误传播 | 多尺度覆盖选视图 | 优先较有几何约束的观测 | 图 5 | 代理分数不等于精确协方差 |
| 错匹配合并多个点 | 递归鲁棒三角化 | 分离多个一致集合 | 表 2 | 仍有采样预算和阈值依赖 |
| 一轮 BA 后结构不完整 | BA、过滤、再三角化迭代 | 利用改善的位姿恢复观测 | 系统与模块实验 | 更多计算，仍可能局部失败 |
| 冗余相机增加成本 | 高重叠视图分组 | 减少独立优化变量 | 图 8 | 过度分组会损害精度 |

## 八、理解检查：问题与答案

**问题 1：为什么重投影误差更小不一定代表 SfM 更好？**

**答案：** 大量删掉困难照片和点也能降低误差；错误但自洽的结构也可能残差小。应结合注册照片数、轨迹长度、空间真值和失败案例，且保证评估对象相当。

**问题 2：一条特征轨迹为什么需要递归三角化？**

**答案：** 错误匹配可能把不同物理点的观测合在一起。先找一个一致集合，只解释其中一个点；移除后继续处理剩余观测，才能恢复被误合并的其他点，而不是把它们全部当外点丢掉。

**问题 3：论文的下一视图选择能否直接控制机器人去拍照？**

**答案：** 不能直接等同。这里从已有照片集合中选择注册顺序；主动机器人还要选择可达相机位姿、考虑碰撞、运动成本和未知区域的信息收益。两者共享视图质量思想，但决策空间和约束不同。
