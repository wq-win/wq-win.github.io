    <textarea id="md-source" class="hidden" readonly># 063｜g2o：把不同估计问题放进同一个稀疏优化框架

[返回总览](00-发展时间线总览.md) · [上一篇：RRT*](062-rrtstar.md) · [下一篇：KinectFusion](064-kinfu.md)

**论文**：Rainer Kümmerle、Giorgio Grisetti、Hauke Strasdat、Kurt Konolige、Wolfram Burgard，*g2o: A General Framework for Graph Optimization*，ICRA 2011。[作者论文入口](https://ais.informatik.uni-freiburg.de/publications/papers/kuemmerle11icra.pdf) · [可读全文镜像](https://mengwenhe-cmu.github.io/Reading-Reports/Research/Localization/Graph_Optimization/g2o_A_General_Framework_for_Graph_Optimization/paper.pdf) · [官方代码](https://github.com/RainerKuemmerle/g2o)。

**阅读范围**：七页正式论文，第 3607—3613 页，包含方法、三张表及实验图；官方仓库只用于核对项目入口，没有把当前软件新增功能算作 2011 年贡献。未编译实现，未重跑基准。

## 一、一分钟理解

机器人估计位置、相机恢复三维点，都可以写成同一种问题：调整一组未知变量，让它们尽量解释测量。

如果为每个应用重新写非线性优化器，许多工作会重复；如果使用完全忽略结构的通用求解器，大型问题又可能太慢。g2o 在两者之间提供了一种设计：应用只定义变量、误差和更新方式，框架负责稀疏线性化、矩阵组织与数值求解。

它的贡献主要是**通用而高效的优化基础设施**，不是一个新的相机特征检测器，也不是靠神经网络学习图表示。论文比较的关键是计算效率、扩展能力及不同数值选择的影响。

一句话：**在可表示为稀疏非线性最小二乘的估计问题中，通过图结构、块矩阵和可替换求解器复用计算框架，减少重复开发并保持较好的效率，代价是建模、初始化和求解器选择仍需领域判断。**

## 二、背景：图究竟表示什么

### 2.1 顶点是未知量，边是测量约束

位姿图中，每个顶点是一时刻的机器人位姿；边可以表示里程计或回环给出的相对位姿。BA 中，一类顶点是相机，另一类是三维点；图像观测约束相机与点之间的投影关系。

这里的“图优化”不是在地图上找最短路线，而是优化图中各变量的数值。连接关系通常来自前端数据关联，优化器并不知道一条错误回环为何被加入。

没有 RL 的动作、奖励或终止回合。输入是测量与初值，输出是优化后的变量；停止条件是收敛判据或迭代上限。若定位系统持续收到新测量，可以重复调用优化器，但这不等于框架本身使用了专门的增量分解算法。

### 2.2 稀疏性是效率来源

一张图像只看见部分三维点，一个里程计测量通常只联系两个相邻位姿。因此一个残差只依赖全部变量中的小部分。

假设共有一百万个变量，而一个残差只连接六个。如果每次都构造对所有变量的稠密导数，就会存储大量零。图结构让框架提前知道哪些块可能非零，把内存和计算集中到实际关系上。

但稀疏输入不保证消元后的矩阵同样稀疏。变量消去会产生填充，排序和问题结构因此十分重要。

## 三、方法：沿用成熟数学，组织高效实现

### 3.1 目标函数和统计解释

论文式（1）的基本形式为：

$$
F(x)=\sum_{(i,j)}e_{ij}(x_i,x_j)^\top
\Omega_{ij}e_{ij}(x_i,x_j).
$$

$x_i$ 是参数块，$e_{ij}$ 是预测与测量不一致的残差，$\Omega_{ij}$ 是信息矩阵。高斯噪声假设下，它与最大似然估计相联系。

信息矩阵不是任意“置信度分数”。若某个方向噪声较小，那个方向的误差通常应受到更大惩罚。坐标单位和协方差约定写错，会让求解器高效地优化错误目标。

### 3.2 一次迭代做什么

在当前估计附近线性化残差：

$$
e(x\boxplus\Delta x)\approx e(x)+J\Delta x,
\quad H=\sum J^\top\Omega J,
\quad b=\sum J^\top\Omega e.
$$

Gauss–Newton 求解 $H\Delta x=-b$。LM 则增加阻尼，并根据新状态的实际成本决定是否接受更新。框架并没有发明这两种算法，它将其与高效构建线性系统的实现组合。

论文图 3 的方程示意把右侧画成 $b$，而式（14）、（16）及上面的 $b$ 定义对应 $-b$。复现应坚持一套一致符号约定；不能把示意图中的正号混入正文推导。

### 3.3 为什么使用 $\boxplus$

三维旋转不是任意九个数，也不是任意四元数。直接把普通向量增量加到旋转矩阵，可能破坏正交性；任意改变四元数分量也可能离开单位球面。

框架允许状态采用稳定的冗余表示，而增量采用局部最小表示，再通过合法组合更新。这将“变量如何存储”与“优化在什么局部坐标中前进”分开。

### 3.4 Schur 补为什么有时有效

把相机变量记作 $p$，三维点记作 $l$，线性系统分为四块。先消去点变量，得到相机系统：

$$
(H_{pp}-H_{pl}H_{ll}^{-1}H_{lp})\Delta p
=-b_p+H_{pl}H_{ll}^{-1}b_l.
$$

普通 BA 的点之间没有直接观测约束，$H_{ll}$ 是块对角，局部求解便宜。相机通常远少于三维点，消元能大幅缩小主系统。

这是代数消元，不是把三维点永久删除。求出相机增量后还要回代点增量。如果相机很多而点很少，消元可能只缩小一点规模，却让剩余相机之间变得密集，反而更慢。

### 3.5 教学伪代码

```text
输入：变量初值、测量图、各类残差及信息矩阵
为变量定义合法局部更新，为测量定义误差与雅可比
固定必要的规范自由度，选择线性求解器
重复直到收敛或达到预算：
    清空稀疏块矩阵 H 和向量 b
    遍历测量约束：
        计算残差及解析或数值雅可比
        仅向相连变量对应的矩阵块累加贡献
    按需要加入 LM 阻尼
    若结构适合：先消去地标，求相机增量，再回代
    否则：直接或迭代求解稀疏系统
    用各变量的 boxplus 构造候选状态
    按所选算法接受更新或调大阻尼重试
输出：估计状态、最终成本及停止信息
```

固定规范自由度是实际建模的必要检查：若只有相对位姿约束，整体平移和旋转不改变残差，线性系统可能有零空间。阻尼使方程可解也不能替代对可观性和参考系的理解。

## 四、实验设计与公平性

实验口径见 §V、表 I；不同实验测量的时间范围不同。

| 项目 | 设置与实际检验问题 |
|---|---|
| 任务类型 | 二维/三维位姿图、地标 SLAM、BA、尺度漂移图 |
| 规模示例 | Venice：871 相机、530,304 点、2,838,740 约束 |
| 计算资源 | i7-930 2.8 GHz 的一个核心 |
| 主要基线 | √SAM、SPA、sSBA、RobotVision；各自覆盖不同任务子集 |
| 图 7 预算 | 完整问题运行 10 次迭代，比较每迭代平均时间 |
| 线性求解设置 | 主框架对照共享 CHOLMOD；另比较 CSparse 与 PCG |
| PCG 停止 | §V.C 使用相对残差阈值 $10^{-8}$ |
| 在线对照 | Manhattan3500，每节点或每 10 节点触发优化 |
| 重复与统计 | 迭代平均不能等同独立随机试验；公开种子和跨机器重复未报告 |

公平性的亮点是主框架对照采用相同底层求解器，有助于观察组装效率。局限是十次迭代不保证每个方法达到完全相同终止精度；要比较“达到指定误差所需时间”，还需成本收敛曲线。

## 五、四组关键结果

### 5.1 图 7：通用性不必意味着巨大开销

论文中 g2o 与专用 SPA、sSBA 的表现接近，sSBA 在 BA 上还略快。结论应是通用框架具有竞争力，而非所有场景第一。

Garage 的数值雅可比与解析雅可比对照，在 §V.A 给出每迭代 80 毫秒与 40 毫秒。这说明建模接口的选择有实际代价；不能把两个数字误写成不同地图精度。

### 5.2 图 9：相同问题，不同局部参数化

两种位姿更新方式在所测 BA 数据上趋向相同解，但迭代过程不同。这支持局部坐标会影响数值收敛，却不证明某种参数化对所有初始化都更好。横轴是迭代次数，也不直接等于总时间。

### 5.3 表 II：没有万能线性求解器

Venice 的线性求解时间，CHOLMOD 为 1.86 秒、PCG 为 0.287 秒；Victoria 则分别为 0.026 和 1.559 秒。两组反向结果是本篇最值得记住的证据：选择要考虑矩阵结构、条件与停止精度。

表 II 是线性求解阶段，不能与表 III 的组装、消元总时间随意交叉相除，宣称端到端加速。

### 5.4 表 III：消元也有适用边界

Venice 的直接求解为 33.87 秒，Schur 构建加求解合计 13.03 秒；Victoria 则从 0.026 秒变为 0.150 秒。地标数量多不多、消元后系统有多密，比“用了 Schur 补”这个名字更能解释性能。

这些结果来自旧硬件和特定版本，不能当作现代机器的性能预报。它们的长期价值是指出该测量哪些阶段、哪些结构会改变求解器排名。

## 六、贡献、局限与复现障碍

**作者贡献**是将通用图表达、合法参数更新、稀疏块计算和可替换求解器统一为可扩展实现。许多数学组件沿用已有方法，新意在于共同架构及效率实现。

**实验支持**的是测试数据上的优化速度和扩展能力。图中地图更一致不等于每处几何都有独立真值验证；残差降低也不自动消除错误数据关联。

**本文分析**认为最重要的使用边界有三点。第一，非线性最小二乘依赖初值，不能默认全局最优。第二，测量权重、残差定义和坐标方向仍由使用者负责。第三，线性求解快不等于前端提特征、匹配、回环检测和建图整体都快。

历史版本、编译优化、底层稀疏库和线程设置会影响运行时间。官方仓库持续发展，复现论文应记录具体提交，而非直接把当前默认配置作为原论文设置。

## 七、建立直觉

### 自构、未运行的三节点例子

固定 $x_0=0$，测得 $x_1-x_0=1$、$x_2-x_1=1$、$x_2-x_0=2.2$，各测量权重相同。三个等式无法同时成立，优化器会在残差间折中，而不是挑一个等式作为绝对事实。

若把最后一个错误回环的权重放大一万倍，结果会更接近 2.2，即使真实位移只有 2。这说明框架的工作是服从目标函数；判断哪条测量可信，需要模型或额外鲁棒机制。

### 五个前置概念

1. **残差**：预测与观测的差异，是优化直接压低的量。
2. **信息矩阵**：协方差的逆，用于按不确定性加权误差。
3. **雅可比**：描述变量微小变化怎样影响残差。
4. **填充**：稀疏消元时出现原矩阵中没有的非零项。
5. **规范自由度**：不改变观测预测的整体坐标变换，需要参考约束处理。

| 原有问题 | 作者的改动 | 为什么可能有效 | 实验证据 | 代价与局限 |
|---|---|---|---|---|
| 每个估计任务重复写优化器 | 统一顶点、边与更新接口 | 分离领域建模和求解 | 多类数据、图 7 | 残差仍需正确定义 |
| 大量零矩阵浪费计算 | 稀疏块组织与结构化消元 | 仅计算实际连接 | 表 II、III | 消元可能增加填充 |
| 一套数值选择难以适配所有图 | 可替换参数化与线性求解器 | 按问题选择计算方式 | 图 9、表 II | 需要精度与时间权衡 |

## 八、理解检查：三个问题与答案

### 问题 1：g2o 能把一个错误回环优化正确吗？

**答案**：仅凭最小二乘框架不能。它会按设定权重解释该测量，错误回环可能扭曲整张图。正确数据关联、异常处理和优化求解是不同环节；低残差只说明更符合所给模型。

### 问题 2：为什么地标消元之后可能更慢？

**答案**：消元会让共同观察一个地标的相机相互耦合，增加剩余矩阵的连接密度。若消去的变量很少，规模收益不足以抵消构建与填充开销，表 III 的 Victoria 就展示了这种情况。

### 问题 3：论文里 PCG 快很多，为什么不能统一换成 PCG？

**答案**：它的迭代次数与矩阵条件、初始估计和容差有关。Venice 上的优势不能推广到 Victoria；比较时还必须分清线性求解时间、完整迭代时间与达到相同最终精度的总时间。
