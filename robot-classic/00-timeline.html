    <textarea id="md-source" class="hidden" readonly># 机器人经典基础发展时间线：从几何表示到完整自主系统

[100篇论文目录](README.md) · [系列总结](101-系列总结.md)

机器人研究没有一条替代所有旧方法的单线历史。位置表示、状态估计、规划和控制长期并行发展，并在完整系统中结合。更准确的地图是：数学工具使某类问题变得可解，算法使它变得可算，传感器和计算平台使它能够实时运行，公开基准再暴露系统边界。

## 技术架构

```mermaid
flowchart TD
  A[机器人任务] --> B[感知与状态估计]
  A --> C[几何与动力学模型]
  B --> D[地图与不确定性]
  C --> E[运动学 雅可比 刚体动力学]
  D --> F[规划与轨迹优化]
  E --> F
  F --> G[反馈控制]
  E --> G
  G --> H[接触与真实运动]
  H --> B
  B --> I[SLAM: 前端关联与后端优化]
  F --> J[图搜索 采样规划 连续优化]
  G --> K[位置 力 阻抗 操作空间 MPC]
  H --> L[抓取 摩擦 腿足 平衡]
  M[软件与基准] --> B
  M --> F
  M --> G
```

这张图中的箭头是信息依赖。例如 SLAM 输出的位姿误差会改变碰撞距离，规划轨迹又会影响未来可见的特征。单独提高某个模块的指标，不必然改善完整任务成功率。

## 1955—1984：把机构、状态与运动变成可计算对象

Denavit–Hartenberg 用矩阵统一描述连杆关系；Kalman 把历史观测的信息压缩成递归状态估计与误差协方差；A* 把启发信息纳入最短路搜索；Whitney 将任务速度转换为关节速度。随后 Newton–Euler 递推、构型空间和铰接体惯量分别解决动力学计算、碰撞几何抽象及前向动力学效率问题。指数积表示则从刚体运动群的角度重新组织运动学。

核心问题是“表示是否正确”。坐标系、变换顺序、状态定义和噪声假设一旦不一致，后续优化只会更快地求出错误模型的答案。

| 年份 | 代表论文 | 旧瓶颈 | 核心改变 |
|---|---|---|---|
| 1955 | [D–H](001-dh.md) | 连杆几何描述缺少统一约定 | 用参数化齐次矩阵串联机构 |
| 1960 | [Kalman 滤波](002-kalman.md) | 历史观测处理难以递归 | 用状态与协方差进行预测更新 |
| 1968 | [A*](003-astar.md) | 盲目展开图节点代价高 | 用可采纳启发函数指导最短路搜索 |
| 1969 | [Resolved Rate](004-resolved-rate.md) | 任务速度与关节指令不直接对应 | 通过雅可比进行速度变换 |
| 1980 | [Newton–Euler 递推](005-newton-euler.md) | 机械臂逆动力学计算昂贵 | 沿运动链前后递推速度与力 |
| 1981 | [RANSAC](006-ransac.md) | 少量错误对应污染拟合 | 用最小样本假设与一致集抵抗离群点 |
| 1983 | [构型空间](009-configuration-space.md) | 机器人体积使碰撞推理复杂 | 将机器人姿态作为点并变换障碍物 |
| 1983 | [铰接体算法](010-featherstone.md) | 显式矩阵求逆限制前向动力学速度 | 通过等效惯量递推求加速度 |
| 1984 | [指数积](011-brockett.md) | 中间坐标约定增加建模负担 | 用零位关节轴统一有限运动 |

## 1985—1995：从自由运动走向接触、冗余与未知环境

可操作度描述机器人在不同构型下的运动能力；阻抗控制和混合位置／力控制讨论与环境接触时到底应该调节什么；操作空间和自适应控制将任务目标与机器人动力学结合。势场与分层反应式系统寻求快速反馈，概率空间关系、占据栅格与粒子滤波则承认感知存在不确定性。

视觉线索逐步形成工具链：相机标定建立像素与几何的联系，角点和跟踪提供对应关系，绝对定向与 ICP 求刚体配准。抓取质量和闭合性研究提醒我们：抓住物体不是“末端到达某点”，而是能否抵抗外部扰动。

| 年份 | 代表论文 | 旧瓶颈 | 核心改变 |
|---|---|---|---|
| 1985 | [可操作度](012-manipulability.md) | 可达性不能反映方向运动难度 | 以雅可比椭球衡量局部能力 |
| 1985 | [阻抗控制](013-impedance.md) | 位置或力命令不足以描述动态接触 | 控制运动偏差与力响应之间的关系 |
| 1986 | [人工势场](014-potential-field.md) | 局部避障需要快速反馈 | 把目标与障碍转换成吸引和排斥作用 |
| 1986 | [包容架构](015-subsumption.md) | 串行世界模型链反应迟缓 | 按行为能力构建异步分层模块 |
| 1987 | [操作空间](018-operational-space.md) | 关节动力学与任务控制脱节 | 把惯性与力控制映射到任务空间 |
| 1989 | [占据栅格](025-occupancy.md) | 稀疏地标难以表达任意障碍 | 以栅格占据概率表达空间 |
| 1992 | [ICP](028-icp.md) | 三维形状对应与变换均未知 | 交替建立近邻对应和刚体配准 |
| 1992 | [抓取质量](030-grasp-quality.md) | 可抓住不等于能抗扰动 | 在物体作用力空间评估抓取 |
| 1994 | [D*](032-dstar.md) | 地图更新导致重复搜索 | 增量修复路径代价 |

## 1996—2005：搜索、概率分解与优化开始扩展规模

PRM 用可复用路网处理高维空间，RRT 与 RRT-Connect 快速寻找单次查询的可行解。D* Lite 和 AD* 在环境变化或有限时间下复用搜索成果。动态窗口把机器人制动能力放进局部避障；接触时间步进将碰撞和摩擦转化为数值约束问题。

SLAM 从概率一致性走向可计算结构：FastSLAM 条件于轨迹分解地图，GraphSLAM 将约束组织为图。SIFT 与五点法改善视觉关联与相对运动恢复。iLQG、ZMP 预瞄控制和全身优先级控制分别处理局部最优反馈、行走预见性和任务冲突。

| 年份 | 代表论文 | 旧瓶颈 | 核心改变 |
|---|---|---|---|
| 1996 | [PRM](035-prm.md) | 高维显式自由空间难以构造 | 采样节点并建立可复用路网 |
| 1997 | [动态窗口](038-dwa.md) | 几何避障忽略制动能力 | 在可达速度窗口内选择安全指令 |
| 1998 | [RRT](040-rrt.md) | 单次高维查询探索效率低 | 向随机样本扩展探索树 |
| 2000 | [平面标定](042-zhang-calibration.md) | 标定装置和采集流程复杂 | 用多个姿态的平面图案估计相机参数 |
| 2000 | [RRT-Connect](043-rrt-connect.md) | 单树到达目标较慢 | 双向树采用快速连接策略 |
| 2002 | [FastSLAM](045-fastslam.md) | 机器人与地图联合估计规模庞大 | 条件于轨迹分解地标估计 |
| 2002 | [D* Lite](046-dstar-lite.md) | 重复规划未充分利用旧信息 | 用局部一致性增量更新搜索 |
| 2003 | [ZMP 预瞄控制](047-preview-zmp.md) | 只看当前误差不足以平滑行走 | 利用未来参考 ZMP 设计质心运动 |
| 2004 | [SIFT](048-sift.md) | 视觉匹配受尺度与旋转变化影响 | 构建局部不变关键点及描述子 |
| 2005 | [迭代 LQG](051-id-iLQR.md) | 非线性最优反馈难以直接求解 | 局部近似并迭代改进控制 |

## 2006—2013：实时系统与公开评价形成共同语言

PTAM 将跟踪与建图放在不同线程；iSAM 和 iSAM2 重用图优化结构；KinectFusion 利用 RGB-D 与 GPU 构建稠密表面；OctoMap 用八叉树管理三维占据。它们没有消除前端误关联，却改变了大地图和实时运行的成本。

规划出现三条互补路线：RRT* 追求渐近最优；CHOMP、STOMP、TrajOpt 在连续轨迹空间改进候选解；OMPL 提供统一接口，便于在相同问题上比较规划器。ROS、MuJoCo、KITTI 和 TUM RGB-D 分别支持模块协作、动力学仿真以及可重复评价。

| 年份 | 代表论文 | 旧瓶颈 | 核心改变 |
|---|---|---|---|
| 2006 | [GraphSLAM](053-graphslam.md) | 大规模联合后验计算困难 | 将观测组织为稀疏约束图 |
| 2007 | [PTAM](056-ptam.md) | 跟踪与建图争用实时预算 | 分线程处理快速跟踪与较慢建图 |
| 2009 | [CHOMP](059-chomp.md) | 路径平滑和避障缺少统一优化 | 在轨迹函数空间进行梯度改进 |
| 2011 | [RRT*](062-rrtstar.md) | 可行路径质量不随计算充分改善 | 重连邻域使路径渐近趋优 |
| 2011 | [KinectFusion](064-kinfu.md) | 实时稠密三维重建代价高 | 融合深度到体素并持续跟踪 |
| 2012 | [iSAM2](068-isam2.md) | 每次增加观测都重做批量优化 | 利用 Bayes 树增量更新 |
| 2012 | [MuJoCo](071-mujoco.md) | 接触仿真需兼顾速度与控制用途 | 设计面向控制的动力学与接触求解 |
| 2013 | [TrajOpt](073-trajopt.md) | 复杂碰撞约束使轨迹优化困难 | 迭代凸近似与碰撞代价处理 |

## 2014—2022：传感器融合、稀疏优化与物理约束进一步结合

LSD-SLAM、SVO、ORB-SLAM、DSO 从直接与特征两条路线组织视觉信息；LOAM 及其后继利用激光几何，IMU 预积分与 VINS-Mono、LIO-SAM、FAST-LIO2 将高频惯性与视觉／激光约束结合。ORB-SLAM3 进一步支持视觉惯性与多地图。

Informed RRT*、BIT* 和 GPMP2 改善搜索重点和连续轨迹表达；TOPP-RA 将路径的时间参数化写成可达性问题。质心动力学、凸 MPC 和控制屏障函数让动态可行性与约束维护更直接地进入优化。SE-Sync、TEASER 等工作则研究何时能够为估计结果提供可验证的最优性证据。

KISS-ICP 的价值在于反思复杂度：稳定的几何前处理、阈值与优化组合，可能比无边界地增加组件更重要。但某个数据集上的简化成功，并不证明所有任务都不需要更丰富的模型。

| 年份 | 代表论文 | 旧瓶颈 | 核心改变 |
|---|---|---|---|
| 2014 | [LOAM](077-loam.md) | 激光配准需要同时兼顾快与准 | 区分高频里程计和低频建图 |
| 2014 | [Informed RRT*](079-informed-rrtstar.md) | 得到初解后仍采样无用区域 | 集中采样可能改善当前解的子集 |
| 2015 | [IMU 预积分](083-imu-preintegration.md) | 优化重线性化时反复积分昂贵 | 在流形上压缩关键帧间惯性约束 |
| 2016 | [GPMP2](087-gpmp2.md) | 连续轨迹优化缺少稀疏结构利用 | 以高斯过程先验与因子图建模 |
| 2016 | [SE-Sync](090-se-sync.md) | 局部优化缺少结果正确性证书 | 利用松弛结构验证全局最优性条件 |
| 2017 | [TOPP-RA](093-toppra.md) | 路径给定后速度分配仍受动力学限制 | 用可达性传播确定时间参数化 |
| 2018 | [Cheetah 凸 MPC](094-cheetah-mpc.md) | 动态腿足需预见接触力后果 | 滚动优化未来接触力 |
| 2020 | [LIO-SAM](097-liosam.md) | 激光和惯性误差需统一约束 | 因子图紧耦合惯性与激光观测 |
| 2022 | [KISS-ICP](100-kissicp.md) | 复杂组件不一定带来稳健配准 | 以简洁几何处理与自适应阈值组合 |

## 四条先修路线

| 目标 | 建议主线 | 必须区分的概念 |
|---|---|---|
| 机械臂控制 | D-H → 速度运动学 → 奇异鲁棒逆解 → 动力学递推 → 操作空间 → 阻抗与力控 | 位姿与速度；力与运动；运动学可行与动力学可行 |
| 自主移动 | A* → 构型空间 → D* → PRM/RRT → 动态窗口 → RRT* → 轨迹优化 | 离散最优与连续最优；可行解与最优解；规划与跟踪 |
| SLAM | Kalman → 空间不确定性 → 标定与配准 → FastSLAM → 图优化 → 视觉／激光惯性系统 | 对应关系与状态估计；相对误差与全局漂移；后验与点估计 |
| 腿足与操作 | 接触约束 → 摩擦与抓取 → LIPM/ZMP → 捕获点 → 质心优化 → MPC | 静态支撑与动态恢复；力闭合与可执行抓取；模型预测与真实稳定性 |

## 经典基础与机器人学习的连接

学习方法常把这些模块中的一个换成数据驱动近似：学习视觉特征、动力学、价值函数或动作策略。它们仍然需要坐标一致、时间同步、动作边界和可解释的评价条件。阅读学习论文时，可以沿本图追问：模型替代了哪个模块，保留了哪些物理约束，误差通过哪条路径进入真实动作。

各时期的原论文链接、版本和独立精读见[目录](README.md)。时代划分用于组织技术问题，不意味着后一个时期淘汰前一个时期。
