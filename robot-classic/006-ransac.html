    <textarea id="md-source" class="hidden" readonly># 006｜RANSAC：先找到可信的小群体，再估计几何模型

[系列首页](README.md) · [上一篇](005-newton-euler.md) · [下一篇](007-hybrid-force.md)

**原论文**：Martin A. Fischler、Robert C. Bolles，*Random Sample Consensus: A Paradigm for Model Fitting with Applications to Image Analysis and Automated Cartography*，1981，Communications of the ACM 24(6):381–395。[SRI原论文](https://www.sri.com/wp-content/uploads/2021/12/ransac-publication.pdf)。本文依据方法、概率分析和定位实验段落，区分原文设置与自构例子。

## 一、一分钟理解

视觉匹配中，一部分对应点根本不是同一个物体位置。把它们与正确点一起做最小二乘，得到的不是稍有噪声的答案，而可能是被错误匹配拖偏的模型。RANSAC先用很少的数据假设模型，再问其余数据是否同意这个假设。

作者的关键改变是从“先拟合全部数据，再剔除不合适点”转向“从最小样本提出假设，再寻找一致集合”。原文用直线例子及相机定位问题展示这种差别。成功依赖好样本被抽中的机会和合适的误差阈值，并非任意比例的错误数据都能轻松处理。

一句话：在几何数据包含粗大错误时，通过最小样本假设与一致性检验，提高模型拟合的鲁棒性，代价是随机计算、阈值选择与模型歧义。

## 二、噪声和错误对应不是同一件事

正确匹配可能有一两个像素的定位误差，这类误差通常围绕真实值波动。错误匹配可能偏几十像素，且不服从同一个小噪声模型。最小二乘的平方惩罚会让远处错误点拥有很大影响。

| 要素 | RANSAC中的含义 |
|---|---|
| 输入 | 待拟合观测、最小求解器、残差函数、阈值与预算 |
| 隐含未知 | 哪些点属于所求几何模型 |
| 中间量 | 随机假设及其一致集合 |
| 输出 | 有足够支持的模型与内点集合 |
| 机器人用途 | 位姿估计、视觉里程计、平面拟合与数据关联 |

一致集合并不天然等于语义上正确的数据。如果场景中两面墙都能形成平面，更多点支持的平面可能不是任务需要的桌面。RANSAC只能依据所设模型与评分标准做选择。

## 三、算法机制与概率直觉

设一个最小模型需要s个样本，随机点为内点的比例为w。理想独立抽样近似下，一次全部抽中内点的概率为$w^s$。做N次仍没有全内点样本的概率约为$(1-w^s)^N$。

要求至少一次成功概率达到p，可选：

$$
N\ge\frac{\log(1-p)}{\log(1-w^s)}.
$$

这是常见教学预算公式，原文还分析所需尝试次数的期望和离散性。注意“抽到全内点最小集”只是必要的好运：点若几何退化、噪声过大或模型不对，仍可能得到坏估计。

```text
输入：数据D，最小样本数s，求解器Fit，阈值t，预算N
best_model为空，best_support为0
重复最多N次：
    从D抽s个样本，拒绝明显退化的几何组合
    由Fit生成一个或多个候选模型
    对每个候选，计算全部数据的几何残差
    取残差小于t的一致集合C
    若支持度达到要求且优于当前最好：
        在C上重新拟合，保存模型及内点
返回模型与内点；若支持不足则报告未可靠求解
```

原始算法的接受策略与现代库的评分、局部优化和自适应迭代数可能不同。伪代码保留核心思想，不把后来的所有变体作为原始RANSAC定义。

## 四、实验如何验证

| 原文定位 | 设置与目的 | 可以支持的结论 |
|---|---|---|
| 图1、§I | 少量点的直线拟合，包含一个粗大错误 | 逐次最小二乘剔除最大残差也会误删好点 |
| §II概率分析 | 改变内点概率与最小样本数 | 抽样成本对这两个量非常敏感 |
| §IV.C定位例子 | 20组地标对应中有5组粗错 | 该例中RANSAC与剔除式拟合行为不同 |
| §IV.D、表I | 50组合成定位问题，每组30个对应 | 对所设像素噪声、错误对应与相机位置进行检验 |
| §IV.E | 航空图像的真实定位案例 | 方法可接入实际特征定位流程 |

作者报告在§IV.C的构造例中，RANSAC第二次所选三点便找到了正确解；这不是平均运行时间保证。§IV.D的表只展示其中十个典型问题，不能把这十行误当全部实验样本。论文的历史实现耗时也不能与现代硬件直接相减得到“加速倍数”。

实验支持抵抗特定粗错设置的能力，不证明所有错误都能识别。错误若形成更强的自洽模型，一致性检验可能选择它。现代复现还应记录随机种子、成功率分布及超时比例，而不是只报最快一次。

## 五、教学例子：样本数为什么如此重要

假设w=0.5，拟合直线只需两个点，单次全内点概率为0.25。若拟合某个模型需要八个点，概率降为1/256。在同样内点比例下，最小求解器越“省点”，通常越容易产生可信假设。

但不能为了减少s而使用不足以确定模型的点数。模型没有被唯一约束时，会出现连续无穷多解或多个离散解，应显式生成并检验候选，而不是随便选一个数值答案。

再想象一组激光点中，大多数来自地面，少数来自一块目标板。若目标是地面估计，最大一致集合合理；若任务是找目标板，需要位置、朝向或语义先验。鲁棒拟合解决的是数据污染，不替代任务定义。

## 六、局限与实现要点

阈值t必须与残差单位匹配。图像重投影误差以像素计，归一化相机坐标和三维距离则是其他尺度。阈值过小会丢掉好点，过大把粗错也收入一致集合。相机畸变和测量不确定性变化还会让统一阈值不够合理。

退化几何是另一来源。例如共线点不能稳定确定某些三维关系，即使这些点都是真实对应也没有足够信息。因此内点率高不等于可估计性强。应检查基线、空间分布及求解器条件。

RANSAC找到的是某个得到较强支持的假设，不保证最终残差在全部合理模型中全局最小。常见做法是在内点上进一步优化，但内点集合如果已经选错，局部优化可能更精确地拟合错误答案。

五个前置概念是：内点服从目标模型；外点可能来自另一机制；最小求解器由少量数据提出假设；几何残差衡量一致性；退化意味着信息本身不足。

如果抽样不是均匀独立，而是按匹配分数优先选择，预算公式中的概率也要重新解释。更好的平均速度不代表沿用原公式仍有相同的成功概率保证。

| 原有问题 | 改动 | 为什么有效 | 实验证据 | 代价与局限 |
|---|---|---|---|---|
| 粗错主导全数据拟合 | 随机小集假设再扩大支持 | 避开先被粗错拖偏的初始模型 | 图1及§IV定位实验 | 抽样预算、阈值、退化与多模型歧义 |

## 七、自测与参考答案

**问题1：内点比例不变，为什么模型需要的最小点数增大后计算可能急剧增加？**

参考答案：一次全内点概率为$w^s$，随s指数下降。更多样本能提高单次拟合约束，却显著降低假设完全避开外点的机会，所以需要区分最小假设阶段和内点重拟合阶段。

**问题2：抽到的全是内点，为什么还可能失败？**

参考答案：这些点可能几何退化、覆盖太窄或噪声导致求解器不稳定。全内点只解决数据来源问题，没有保证模型可观测性与数值条件。

**问题3：一致集合最大，为什么不一定是机器人需要的对象？**

参考答案：评分衡量几何支持，不识别任务意图。一个更大背景平面可以胜过目标物体平面，必须通过先验、区域限制或额外识别步骤指定目标。
