    <textarea id="md-source" class="hidden" readonly># 033 · Longformer：长文本不必让所有词两两相看

[返回目录](README.md) · [上一篇：DPR](032-dpr.md) · [下一篇：RAG](034-rag.md)

论文：Iz Beltagy、Matthew E. Peters、Arman Cohan，*Longformer: The Long-Document Transformer*，2020。[原始论文](https://arxiv.org/pdf/2004.05150)。阅读重点为§3注意力结构、§4实验、表2与表5；未独立复现底层计算核。

## 一分钟理解

普通自注意力把一篇文章里的每个词都与所有词比较，文章长度翻倍，配对数量大约变为四倍。Longformer 让大部分词只关注附近窗口，再指定少量位置能连接全文。这样既保留局部语言结构，也给远距离信息提供通路。

它解决的是长文档的计算与内存约束，不是让模型自动理解任意长度文本。窗口宽度、全局位置数量、预训练长度和具体任务都会影响有效范围。原论文同时考察字符语言建模与从 RoBERTa 继续预训练的长文档理解，两类实验不能混用预算和指标。

一句话：在需要处理长上下文的任务中，通过局部窗口与少量全局注意力，降低注意力随长度增长的成本，代价是人为限制连接模式并需要适配位置表示与训练分布。

## 长度问题为何不能只靠截断

对于文档分类，决定标签的证据可能在末尾；对于多跳问答，两个线索可能跨越不同段落。截断会直接丢失信息，分块独立编码则缺少跨块联系。扩大普通 Transformer 的输入长度又会产生大量注意力分数。

设序列长 $n$、隐维度 $d$，全注意力的配对运算通常为 $O(n^2d)$，分数矩阵为 $O(n^2)$。这不意味着整个网络只有这一项成本：前馈层、投影和激活也占资源，所以注意力变成线性后，整机速度不会自动按理论比例提升。

Longformer 属于模型架构与系统效率研究，没有环境状态、动作或奖励。输入是长序列，输出随目标而变：语言模型预测字符，预训练编码器恢复遮盖词，微调模型完成问答或分类。

## 连接图与核心公式

为位置 $i$ 定义局部邻域 $W_i$，全局位置集合为 $G$。普通位置能够访问 $W_i\cup G$；全局位置能够访问所有位置。用掩码表达单个注意力头：

$$
a_{ij}=\operatorname{softmax}_{j}\left(\frac{q_i^\top k_j}{\sqrt d}+m_{ij}\right),\qquad
m_{ij}=\begin{cases}0,&j\in W_i\cup G\text{ 或 }i\in G\\-\infty,&\text{其他}\end{cases}.
$$

输出为 $h_i'=\sum_j a_{ij}v_j$。这个式子解释允许哪些连接；实际实现不能先生成完整 $n\times n$ 矩阵再遮盖，否则节省内存的意义就消失了。论文为局部和全局连接使用不同投影，教学式省略了这一参数区分。

若窗口大小 $w$ 与全局位置数 $g$ 都固定，连接数量约为 $O(nw+ng)$。如果把所有词设成全局位置，$g$ 随 $n$ 增长，又回到了平方规模。因此“线性复杂度”有明确条件。

局部窗口叠多层后，信息可以逐步传播到更远处；全局词则提供较短路径。分类可让特殊汇总词连接全文，问答可把问题词设为全局。这不是由测试答案指定位置，不应引入答案所在段落的特权信息。论文也讨论膨胀窗口，但从 RoBERTa 迁移的配置并非所有连接变体都获益。

```text
输入：长序列x、每层窗口、任务指定的全局位置G
对每层：
    为局部和全局注意力计算所需投影
    对普通位置，仅计算窗口及全局位置的分数
    对全局位置，计算与整段序列的双向连接
    在各自允许位置上归一化并聚合value
    执行残差、归一化与前馈网络
使用任务输出头计算MLM、分类或问答损失
更新参数；在相同连接规则下评估
输出：长文本表示及任务预测
```

这份流程描述双向编码场景。自回归字符建模还必须限制未来信息；不能照搬双向掩码后报告语言模型困惑度，否则会泄漏预测目标。

## 从短模型变成长模型

RoBERTa 使用有限长度的可学习绝对位置嵌入。扩展到4096时，新增位置若随机初始化，会破坏已有表示。论文复制原有512个位置向量来初始化更长位置表，然后继续预训练。复制是初始化方案，训练后各位置仍可适配，不是宣称每512个词在语义上完全重复。

从旧权重迁移还受到注意力结构兼容性约束。论文提到，在这一路线中加入部分膨胀注意力反而损害表现，可能与预训练权重不兼容有关。这里“可能”是作者解释，不是已被完全隔离验证的因果结论。

## 实验设置

|项目|原文设置与比较目的|
|---|---|
|字符建模|text8、enwik8，以BPC评价；小模型与大模型分组，不能跨组直接比较|
|编码器预训练|从RoBERTa继续训练，序列4096，批量64，65k次更新；最大学习率$3\times10^{-5}$，预热500步|
|理解任务|WikiHop、TriviaQA、HotpotQA、OntoNotes、IMDB、Hyperpartisan等，长短分布不同|
|基线|全注意力模型、其他长序列模型、RoBERTa及初始化消融|
|系统指标|图1比较时间与内存，同时区分循环、分块向量化、自定义CUDA实现|
|任务指标|语言建模BPC越低越好；理解任务使用各自准确率或F1，不能与BPC合并平均|
|不确定性|主表未统一报告所有配置的多种子置信区间；小差异不自动等于稳定优势|

表6列出任务上下文长度分布。例如TriviaQA的平均长度与长尾都明显超过短编码器常见上限。评价长模型时应同时报告截断比例，否则很难分清收益来自新结构还是单纯保留了更多有效证据。

## 结果与三处关键证据

**证据一：图1与§3.2，理论连接怎样落到系统。** 不同稀疏实现的速度不同，图中分块向量化实现最快；这说明运算图稀疏不等于硬件利用率高。图支持长序列时的内存扩展优势，但不能证明任何长度、任何设备都比高优化的全注意力快。

**证据二：表2与表3，建模能力并未因稀疏连接消失。** 小模型在text8和enwik8测试BPC分别1.10、1.00。表3大模型enwik8为0.99，与部分类似规模稀疏模型相当，而更大模型可以更好。证据支持效率与建模质量之间可取得有用平衡，不支持它在所有参数预算下支配其他方法。

**证据三：表5，位置初始化和继续训练不可省略。** base配置扩展后随机位置初始化的MLM BPC为10.299，复制位置嵌入后降至1.957；继续2k步为1.753、65k步为1.705。这组对照清楚表明，把输入长度参数改大不等于得到可用长模型。这里的BPC是该MLM评估口径，不能与字符自回归表2的BPC直接横比。

作者报告更长输入上的多类任务收益，但任务不同，全局连接策略也不同。因此最严谨的概括是“提供了可迁移的长文本编码方法”，而不是“稀疏注意力在任何任务上更准确”。

## 一个构造例子

自构文档第一段说“项目负责人是林某”，最后一段说“负责人签署最终许可”。要回答谁签署，短截断可能只看到一端。局部窗口让相邻句先整合信息，问题的全局位置再从全文收集相关内容。

但如果几十处都出现同名人物，全局汇总仍可能混淆关系。连接存在只保证信息有传播路径，不保证优化学会正确选择。可以把证据距离逐步拉大并插入干扰段，观察准确率、显存和延迟。这是自构实验方案，未运行时不能画出虚构的退化曲线。

一个公平版本要控制答案证据是否被截断：先比较所有模型都能容纳的短样本，再比较真正需要长上下文的样本；同时区分同长度计算成本与各自最大长度任务效果。否则两个不同问题会混成一个结论。

## 贡献、局限与前置概念

贡献包括可用于多任务的局部—全局稀疏注意力、有效实现及从已有短编码器迁移的实证方案。局限包括全局位置设计、长程细节压缩、预训练分布适配，以及稀疏核的工程复杂性。它节省配对成本，却不解决数据是否可信或答案是否忠实的问题。

五个前置概念是：自注意力按内容聚合信息，感受野描述能访问的范围，全局词提供全文连接，绝对位置嵌入区分顺序，BPC用以比特表示预测损失。掌握后可以与BigBird的随机连接、Performer的核近似分别比较，而不要都称为同一种“线性注意力”。

|原有问题|作者改动|为什么可能有效|实验证据|代价与局限|
|---|---|---|---|---|
|全注意力配对随长度平方增长|局部窗口与少量全局连接|减少连接并保留远程路径|图1系统曲线、表2建模结果|全局位置过多会失去线性条件|
|短模型直接扩长失效|复制位置嵌入并继续预训练|保留已有局部结构、适配长分布|表5初始化与更新步数对照|仍需额外训练，不能无限外推|

## 自测与参考答案

**1. 把全注意力矩阵算完再遮掉大部分元素，能获得论文的内存收益吗？**

不能。完整矩阵已经占用平方内存；必须在实际计算与存储上只处理允许的连接，或用相应分块实现避免完整展开。

**2. 全局位置越来越多时，复杂度会怎样？**

全局连接为$O(ng)$，若$g$随长度线性增长，就再次成为平方量级。固定少量全局位置是线性扩展结论的重要前提。

**3. 证据在同一篇长文中，就一定能答对吗？**

不一定。可访问性、有效利用和正确推理是不同条件。位置训练不足、干扰内容以及信息压缩都可能造成失败，必须用距离与干扰实验检验。
