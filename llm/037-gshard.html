    <textarea id="md-source" class="hidden" readonly># 037 · GShard：稀疏专家如何真正分布到数千个设备

[返回目录](README.md) · [上一篇：FiD](036-fid.md) · [下一篇：BigBird](038-bigbird.md)

论文：Dmitry Lepikhin 等，*GShard: Scaling Giant Models with Conditional Computation and Automatic Sharding*，首次公开2020，ICLR 2021。[原始论文](https://arxiv.org/pdf/2006.16668)。依据§2路由、§3编译分片、§4–5训练与系统实验；未复现TPU集群。

## 一分钟理解

混合专家可以保存很多参数，却只为每个词调用少数专家。但专家分散在不同设备上以后，词必须被发送、排队、计算并送回。如果路由和通信做不好，理论节省的计算会被等待吃掉。

GShard 同时研究两层问题：模型使用有容量限制的稀疏专家路由，系统用少量张量分片标注与编译器自动生成分布式计算。最终在多语言翻译中训练了大规模模型，展示质量、样本数、墙钟时间与设备总时间的不同取舍。

一句话：在大规模多语言模型训练中，通过稀疏专家、分组路由和自动分片，扩大容量并控制每个设备的负担，代价是跨设备通信、路由溢出和复杂的数值及负载管理。

## 问题定义：容量与共享之间的矛盾

一个模型处理许多语言，高资源语言需要足够容量，低资源语言又依赖与其他语言共享知识。所有任务挤在同一套参数中可能相互干扰；彻底分开训练则放弃迁移。专家网络提供中间选择，让不同token激活不同子网络。

实际任务是从多种语言翻译成英语，输入源句，输出目标句，优化翻译负对数似然。专家不是人工指定的语言模块，也不是独立智能体；路由由数据学习，不应把某个专家的出现直接解释为语言学概念形成。

GShard 既是系统接口与编译机制，也是用于检验该系统的大模型实例。把“自动分片”与“MoE算法”混为一个概念，会难以判断后续系统是否使用相同模型，或者只是采用类似编译思路。

## 路由、容量与目标函数

设token表示为 $x$，路由概率为 $g(x)=\operatorname{softmax}(W_gx)$。候选选择分数最高的两个专家，输出简化表示为：

$$
y=\sum_{e\in S(x)}\tilde g_e(x)f_e(x),\qquad |S(x)|\le2.
$$

$f_e$是专家前馈网络，$\tilde g_e$是保留路由后的权重。这个式子还没有表达实际容量约束：每组token可向某个专家发送的数量有限，第二专家还采用随机路由策略，并非每个token始终运行两个专家。

若整批 $N$ 个token分成 $G$ 组，共有 $E$ 个专家，每组每专家容量约为 $2N/(GE)$。容量限制让张量尺寸可控，方便并行编译。若两个候选都已满，token在该MoE支路没有专家输出，仍通过残差传递，不能描述成从整个网络中删除了该token。

总损失由翻译损失与平衡辅助项组成：

$$
L=L_{NLL}+\lambda L_{balance},\qquad
L_{balance}\propto\sum_e m_e f_e^{load}.
$$

$m_e$表示平均门控概率，$f_e^{load}$表示实际路由占比。后者由离散选择得到，论文使用可微概率构造代理，避免所有token拥挤到少数专家。此处只给出结构形式，具体归一化与组内计数应按算法1实现。

```text
输入：token批次、分组规则、专家网络、容量上限
对每组token并行：
    计算专家softmax分数，选top-2候选
    统计并计算负载平衡辅助损失
    在容量范围内接纳第一专家路由
    按第二专家权重随机决定是否尝试第二路由
    容量允许时构建dispatch与combine张量
跨设备交换token，分专家执行前馈计算
交换输出并按combine权重还原token顺序
通过残差接回骨干，优化翻译与辅助损失
编译器依据张量标注生成所需分片和集合通信
输出：可分布式训练的稀疏模型
```

## 自动分片为什么重要

注意力部分可以按批量分片并复制权重，庞大专家权重则分布到不同设备。计算图在这些布局之间切换，编译器插入相应通信。单程序多数据方式让每个设备运行同一程序形态，避免为每个设备手写不同大图。

自动生成并不意味着通信消失。专家调用需要all-to-all等数据交换，网络拓扑和消息大小影响效率。辅助损失改善的是负载分配，编译分片改善的是执行方式，翻译BLEU改善来自容量、共享、训练等因素，不能把三个层级的收益混算。

## 实验设计

|项目|论文配置与问题|
|---|---|
|数据|内部网页挖掘平行语料，双向约250亿样本，本文到英语方向约130亿；语言资源极不均衡|
|模型族|表1改变深度12/36层及每MoE层128/512/2048专家，专家层间隔插入|
|训练量|主要质量比较使用处理1万亿token的检查点；部分损失阈值分析训练更久|
|基线|各语言单独训练的双语Transformer，以及96层稠密多语言模型|
|设备|128、512或2048 TPU v3 cores；设备数与每层专家数联动，非纯模型变量对照|
|指标|BLEU及相对双语基线差值、达到损失阈值的token量、步速、墙钟天数、TPU core-years|
|不确定性|巨型配置没有统一多种子置信区间；内部数据也限制第三方严格复现|

这里处理1万亿token不是拥有1万亿条独立句对。表2统计达到某个训练损失阈值的数据量，也不等同测试质量。论文明确该处训练交叉熵不包括辅助损失，避免平衡项变化扭曲拟合速度比较。

## 三组证据与边界

**证据一：算法1–2与§3，路由能否落地。** 容量、分组和随机第二路由将不规则专家调用变成规则张量操作。它们支持可执行系统设计，但容量限制会使某些token跳过专家支路，必须结合溢出和质量观察，不能只展示平均吞吐。

**证据二：图6与表3，质量和资源同时报告。** 600B、2048专家、36层配置平均BLEU44.3，所列稠密96层模型36.9。600B模型用2048 cores约4天，同时消耗22.4 TPU core-years。4天是等待时间，22.4设备年是累计资源，两者都真实，不能只用前者营造低成本印象。

**证据三：表2与表3，样本效率不等于时间效率。** 128专家12层达到训练交叉熵0.7需995B tokens，36层需321B。更深模型用更少样本达到阈值，但每步工作更多。表3按固定训练量分别列时间与设备成本，正是为了避免把“更少样本”直接译成“更便宜”。

图6还将语言按数据量排序并平滑趋势，显示增加专家与增加深度的收益分布不同。作者把部分现象解释为容量瓶颈与共享迁移的取舍；这是有实验支持的机制分析，但并非对语言相互作用的完整因果证明。

§4.3披露1T模型存在数值稳定性问题，未纳入正式质量结果。它可以作为扩展能力探索，不能与600B主结果并列称为同等可靠的已验证系统。

## 一个构造例子与诊断方案

自构例子：一批句子大多来自高资源语言，门控把相似token集中送到专家A。即便A最擅长这些输入，容量也会溢出，其他专家却空闲。增加辅助损失可以促使分流，但过强的均衡也可能迫使不合适的专家接收token。

可做一个未执行的小规模实验：固定专家总容量，改变语言混合比例与平衡权重，测每专家负载、溢出率、逐语言BLEU和通信等待。若平均BLEU改善而低资源语言下降，应报告分组结果；若溢出降低但质量恶化，说明均衡本身不是任务目标。

还应独立比较同设备数与同墙钟预算。扩大专家同时扩大设备，主要显示可扩展性；在固定硬件上换更大专家模型，则回答部署或训练预算内是否值得。两种结论都重要，但不能互相冒充。

## 贡献与阅读衔接

GShard 将稀疏容量扩展与可编译的分片执行连接起来，证明条件计算要与路由、通信和编译共同设计。代价是大集群需求、内部数据依赖、负载复杂性及极大规模稳定性。后续Switch简化路由、Mixtral探索更易使用的稀疏模型时，都可以回到这些基本约束。

五个前置概念是：MoE按输入选择子网络，容量限制控制专家缓冲，负载平衡避免拥塞，SPMD用同一程序处理分片，core-years度量累计设备时间。

|原有问题|作者改动|为什么可能有效|实验证据|代价与局限|
|---|---|---|---|---|
|大容量模型计算与通信难协调|稀疏top-2、分组容量与自动分片|限制激活工作并编译规则通信|算法1–2、§3、表3系统效率|溢出、通信、数值稳定性|
|多语言容量与共享冲突|分别扩展专家数和深度|提供容量并保留部分跨语言共享|图6语言趋势、表2样本效率|资源配置耦合，内部语料难复现|

## 自测与参考答案

**1. top-2路由意味着每个token一定执行两个专家吗？**

不是。第二路由有随机接纳策略，两个候选都受容量限制。实际激活可能更少，溢出token仍通过残差继续传播。

**2. 为什么4天训练不能简单称为低成本？**

它使用2048个TPU cores并行，累计22.4 core-years。墙钟时间说明完成速度，设备时间更接近资源投入，两者需要同时报告。

**3. 平衡损失越强是否越好？**

不一定。负载均匀可改善吞吐与溢出，但可能破坏任务需要的专家分工。应联合观察逐语言质量、路由分布与等待时间，而非只优化均匀度。
