    <textarea id="md-source" class="hidden" readonly># 040 · Performer：不存注意力矩阵，也能近似全局注意力

[返回目录](README.md) · [上一篇：MMLU](039-mmlu.md) · [下一篇：The Pile](041-pile.md)

论文：Krzysztof Choromanski 等，*Rethinking Attention with Performers*，首次公开2020，ICLR 2021。[原始论文](https://arxiv.org/pdf/2009.14794)。阅读依据为§2–4、图3–4、附录B算法及附录C表1–2；未独立复现随机特征核与训练实验。

## 一分钟理解

前面的长文本方法通过删掉注意力连接省计算。Performer走另一条路：把softmax核近似为两个较小特征向量的内积，再改变矩阵乘法顺序，避免显式计算所有位置两两关系。

它仍允许全局信息影响输出，但有限随机特征会引入近似误差。FAVOR+使用正值、正交随机特征来改善估计稳定性，并提供相应理论分析。它不是让原始softmax注意力在任何输入上精确变成线性计算。

一句话：在长序列全局注意力中，通过随机核特征与结合律，降低注意力存储和运算的长度增长成本，代价是近似误差、随机性、数值处理和特征数选择。

## 从softmax矩阵到核函数

普通注意力可写成 $A_{ij}=\exp(q_i^\top k_j/\sqrt d)$，输出为行归一化后的 $AV$。如果先构造 $A$，就需要平方规模存储。

令 $x=q/d^{1/4}$、$y=k/d^{1/4}$，则 $x^\top y=q^\top k/\sqrt d$。我们希望找到特征映射 $\phi$，使：

$$
\exp(x^\top y)\approx\phi(x)^\top\phi(y).
$$

于是可以先对所有键和值做摘要，再用每个查询读取：

$$
o_i\approx\frac{\phi(x_i)^\top\left(\sum_j\phi(y_j)v_j^\top\right)}{\phi(x_i)^\top\sum_j\phi(y_j)}.
$$

分子括号内是特征维度乘值维度的矩阵，分母是特征向量，不随序列长度平方增长。数学上只是结合律，但前提是原来的指数核已经用可分解特征表示近似；不能直接对softmax矩阵随意交换运算。

## 为什么采用正随机特征

教学性地，若 $\omega_r\sim\mathcal N(0,I)$，定义：

$$
\phi_r(x)=\frac{1}{\sqrt m}\exp(\omega_r^\top x-\|x\|^2/2).
$$

利用高斯矩母函数，有 $\mathbb E[\phi(x)^\top\phi(y)]=\exp(x^\top y)$。$m$是随机特征数，越大通常估计方差越小，但计算和存储增加。上述独立高斯形式便于理解，FAVOR+进一步采用正交化随机特征及相关变体改善方差和效率。

正值特征避免某些三角随机特征在分母中出现正负抵消的问题，但指数运算仍可能溢出或数值不稳，需要恰当的稳定实现。正交特征降低估计误差，不等于每次随机采样都优于所有独立采样。

尤其要区分：未归一化核估计无偏，不自动推出归一化输出也无偏。随机变量的比值期望通常不等于期望的比值。论文的核估计、收敛和误差保证各有条件，不能简化为“最终注意力完全无误差”。

```text
输入：Q、K、V，随机特征数m，正交随机映射
缩放Q和K，使点积对应原softmax温度
计算正值特征PhiQ、PhiK
若双向注意力：
    S = transpose(PhiK) @ V
    z = sum(PhiK, sequence_axis)
    输出 = (PhiQ @ S) / (PhiQ @ z)
若因果注意力：
    按位置维护S和z的前缀累计
    每个查询只读取截至当前位置的累计值
按数值稳定规则归一化，接回残差与前馈网络
训练时可按方案重采样随机映射
输出：近似全局注意力结果
```

双向累计不能直接用于自回归预测，否则会把未来键值泄漏给当前输出。前缀累计还存在内存与并行度取舍：存全部前缀便于并行，串行维护一个状态更省内存。这是算法与实际训练系统之间的重要连接。

## 实验设计与预算

|项目|论文设置与需要回答的问题|
|---|---|
|任务|像素预测、PG-19文本、TrEMBL蛋白序列等；单序列与拼接长序列分别分析|
|主要替换|通常只替换注意力部分，其余骨干保持一致；某些内存受限长任务不得不缩小全注意力基线|
|速度实验|图3在16GB V100上比较前后向速度与可运行长度，默认6层、8头、隐藏512、FFN2048|
|近似实验|图4使用长度4096、维度16，改变随机特征数量；15次随机输入采样报告标准差|
|训练设置|附录A默认Adam固定学习率$10^{-3}$、dropout0.1、梯度裁剪0.5；批量按设备可容纳范围调整|
|蛋白划分|附录C区分随机IID与保留部分Pfam家族的OOD；作者说明并不保证严格序列距离隔离|
|指标|核/输出近似MSE、任务准确率与PPL、内存和速度；不能用近似误差代替泛化质量|

大部分实验不是严格同墙钟、同批量、同容量三者同时相等的比较。特别是长度8192拼接蛋白任务，全注意力基线被迫缩小，而Performer可用更大模型。该结果说明内存预算内的系统优势，不是单独证明同容量下注意力机制更准确。

## 三组证据

**证据一：图3，结合律产生实际资源收益。** 图中随长度增长，Performer可以在更长序列运行，并改善前后向成本。图还给出把注意力直接返回V的理想参照，提醒读者其他网络组件仍有不可消除成本。结论绑定具体实现与16GB V100，不能外推为所有长度和硬件的固定倍数。

**证据二：图4与§2–3，特征设计确实影响误差。** 正特征相对三角特征、正交相对独立特征在所测条件下具有更低误差，15次采样标准差体现随机性。它支持FAVOR+的设计，而非说明一次近似可无损替换任意预训练模型；必要时仍需适配训练。

**证据三：附录C表2，IID收益与OOD退步。** 双向蛋白任务中，Transformer测试准确率33.32，generalized Performer36.09，softmax Performer33.00；OOD分别25.07、24.10、23.48。更好IID分数没有自动转化成更好家族外表现，且generalized核不是同一softmax近似目标，必须分列解释。

论文还研究其他可核化注意力，例如ReLU形式。若这类模型分数最好，只能支持替代核在该任务上有效，不能把它当作“softmax近似更精确所以分数更高”的证据。核选择与近似质量是两个实验变量。

## 一个构造例子与实验思路

自构序列有一千个键，但当前查询只与其中一个高度匹配。softmax可能形成很尖锐的分布，有限特征近似则可能把较小质量分配给其他键。若输出依赖精确复制一个位置，即使总体MSE不大，也可能选错答案。

可做未执行实验：固定Q/K/V与随机种子集合，改变特征数、查询键范数和分布尖锐度，记录归一化输出误差、最大位置是否一致、耗时和峰值显存。它能解释哪些输入更难近似，而不是只测一组平均随机矩阵。

再把该分析接到复制与检索任务，比较从头训练和从全注意力权重直接替换两种设置。若直接替换失效、适配后恢复，说明模型可以学会补偿近似，但不能宣称原函数保持完全不变。训练适应与数学近似应分别报告。

## 贡献与局限

Performer把正随机特征、正交化与注意力计算顺序结合，建立一条不同于删边的长序列路线。限制包括特征数与精度取舍、数值稳定、因果实现的并行成本，以及不同数据分布中的泛化差异。它保留全局交互的可能性，却压缩了键值摘要，某些精细检索任务可能受影响。

五个前置概念是：核函数衡量成对相似，随机特征用有限向量近似核，结合律改变矩阵乘法顺序，行归一化让权重求和为一，前缀和保证因果范围。它们也为后来的线性注意力和状态空间模型提供比较语言。

|原有问题|作者改动|为什么可能有效|实验证据|代价与局限|
|---|---|---|---|---|
|全局注意力矩阵需要平方存储|FAVOR+随机核特征并先聚合键值|避免显式构造全部位置配对|图3速度内存、附录B算法|有限特征近似，因果并行有取舍|
|普通随机近似误差或数值不稳|正值与正交随机特征|减少抵消与估计方差|图4与核估计分析|核无偏不等于归一化输出无偏，OOD可退步|

## 自测与参考答案

**1. Performer为何不是把注意力矩阵直接低秩分解一次？**

它用可计算的核特征映射近似成对相似度，不需要先生成原矩阵再分解。节省来自提前构造特征并改变乘法顺序。

**2. 核估计无偏，最终输出是否也无偏？**

不自动成立。最终输出包含随机分子除以随机分母，期望与除法一般不能交换。必须使用相应误差或收敛分析，不能省略归一化。

**3. generalized Performer分数更高，是否证明softmax近似更准确？**

不是。generalized版本可以选择另一种核，改变了目标注意力本身。任务质量、核形式与近似误差需要用不同对照分析。
