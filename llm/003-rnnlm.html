    <textarea id="md-source" class="hidden" readonly># 003｜RNN 语言模型：让预测器携带一个不断更新的过去

[目录](README.md) · [上一篇](002-nnlm.md) · [下一篇](004-word2vec.md)

**论文**：Tomáš Mikolov 等，*Recurrent Neural Network Based Language Model*，INTERSPEECH，2010。[会议页面](https://www.isca-archive.org/interspeech_2010/mikolov10_interspeech.html) · [正文](https://www.isca-archive.org/interspeech_2010/mikolov10_interspeech.pdf)。本文围绕网络结构、WSJ 与 NIST RT05 实验展开，表格位置以四页会议论文为准。

## 一分钟理解

有限窗口神经语言模型每次只看最近几个词。RNN 语言模型额外维护一个循环状态：读入一个词，就更新对历史的压缩表示，再预测下一个词。这个状态允许更早信息参与预测，而不必把所有历史词显式拼接成越来越长的输入。

作者在语音识别相关语料上比较困惑度和词错误率，并讨论神经模型与传统模型的组合。它的重要性是证明递归神经语言建模能够在实际识别流程中提供有用信息；局限是循环状态容量、训练成本和长程梯度。形式上依赖任意长历史，与实际可靠记忆任意长历史，是两回事。

## 背景：历史不是一个固定长度列表

想象会议先讨论数据库，几十个词后出现“索引”。此前话题可能有助于预测这个词，却不一定处在最近五个词中。扩大固定窗口会直接增加输入规模，而且难以判断哪些远处词重要。循环状态把这个问题改写为：每读一个词，应怎样更新一个有限维向量？

模型的输出仍是下一个词的条件分布，任务仍是文本似然学习。应用到语音识别时，声学系统提供候选序列，语言模型辅助重新评分；语言模型本身不直接从音频波形识别所有词。区分模块权限很重要，否则会把整个识别系统的结果误归给单个神经网络。

原论文同时讨论静态与动态使用。静态模型在评估时不再改变权重；动态适配会利用已经观察到的文本继续更新。只利用过去已揭示的信息可以是一种合法在线协议，但它与完全冻结参数的测试条件不同，必须单独标明。

## 核心方法：压缩历史，再预测

用简化记号表示网络：

$$
h_t=\sigma(Ux_t+Wh_{t-1}+b),\qquad
p_{t+1}=\operatorname{softmax}(Vh_t+d).
$$

$x_t$ 表示当前词输入，$h_{t-1}$ 为此前状态，$h_t$ 为更新后的历史表示，$p_{t+1}$ 给出下一词概率。$U,W,V$ 是共享权重。输出误差既训练预测映射，也训练状态如何保留对未来有用的信息。

对比固定窗口模型，递归权重在每个时间步复用，所以增加序列长度不要求新增一组位置专属参数。但是状态仍然有限，不会把过去每个词原封不动存下来。网络需要压缩、覆盖和选择，训练也受反向传播范围及梯度质量限制。

论文为了效率使用其具体训练与输出组织方案；下面伪代码只描述机制，不把现代任意长度 BPTT 当作原版实现。若复现，应进一步对照原文关于计算复杂度、隐藏单元规模和训练安排的说明，尤其注意模型组合与动态更新是否启用。

```text
输入：训练词序列，循环状态维度与词表
初始化共享参数和序列边界状态
逐词处理训练文本：
    h ← recurrent_update(current_word, h)
    p ← output_distribution(h)
    loss ← -log p[next_word]
    按训练协议传播误差并更新参数
验证阶段选择规模、训练轮次与混合权重
测试阶段：
    按固定的静态或动态协议计算词概率
    若用于识别，结合候选序列与其他系统得分重评分
输出：序列对数概率、困惑度，以及识别系统词错误率
```

数学上优化负对数似然，机制上增加递归状态，最终识别指标则是 WER。WER 统计替换、删除和插入错误，相对于参考词数归一化。它并不是交叉熵，因此困惑度下降不必产生同比例的 WER 下降。尤其当正确转写不在候选列表里，语言模型无法仅靠重排恢复它。

## 实验：概率改善是否能转为识别收益

| 项目 | 原文设定与比较条件 |
|---|---|
| WSJ 数据 | 文中 RNN 实验使用 6.4M 词训练数据；部分传统对照使用更多数据 |
| 另一任务 | NIST RT05，进一步考察较强语音识别系统中的作用 |
| 基线 | 修改 Kneser–Ney 的高阶 n-gram，与神经模型及其组合 |
| 指标 | PPL 检验概率拟合，WER 检验识别结果 |
| 变化因素 | 隐藏单元、模型混合、静态或动态更新，不可混作同一配置 |
| 预算与重复 | 论文给出具体模型设置；完整现代硬件吞吐与统一多种子置信区间未报告 |

**证据一，网络结构与复杂度部分。**递归状态使历史影响不被固定窗口直接截断，但没有证明所有远程信息都可恢复。读者应把结构表达能力与训练可达能力分开。

**证据二，表 2 的 WSJ DEV。**KN5 基线为 PPL 221、WER 13.5；三模型动态 RNN 与 KN 组合达到 PPL 121、WER 11.1。按显示值计算 WER 相对下降约为 17.8%。这个对比包含模型组合和动态处理，不是一个静态小网络相对基线的纯架构收益。

**证据三，表 3 与表 4。**论文把 WSJ 开发与评估、以及 RT05 结果分别报告，检验收益能否出现在不同识别条件中。RT05 中 RNN 使用约 5.4M 词域内数据，传统模型训练来源和数量不同，因此不能将所有结果解读为严格等数据实验。

这种证据结构比只报告一个困惑度更有说服力，因为它触及实际下游任务；同时也更需要小心归因。声学候选质量、插值系数、动态更新和集成数量都可能影响 WER。架构有价值与收益完全由架构独立造成，是不同结论。

## 教学例子：状态、参数和适配并不相同

构造两个前缀：“今天讨论数据库的维护……”与“今天讨论图书馆的分类……”。两者最后几个词可以相同，但循环状态可能保留不同话题，使后续词分布有所差异。这是状态变化：即使参数完全冻结，不同输入也会产生不同 $h_t$。

如果模型看到一批会议文本后更新了 $U,W,V$，那是参数适配，影响的不仅是当前句子。混淆二者，就容易把 RNN 的正常上下文处理误称为测试时训练，或把实际测试时更新隐藏在“记住历史”这种模糊描述中。

再构造两个不同长前缀，经过压缩后得到很相似的状态。如果任务要求区分其中一个早期专名，而模型已经把它覆盖，后续输出就无从恢复。递归依赖不是无损存储，这正是后来门控记忆与注意力持续研究的原因。

## 贡献、限制与后续联系

该工作把循环神经语言模型带入具体识别评价，说明有限维连续状态与传统计数模型具有互补信息。它没有取消 n-gram 的实用价值，也没有证明神经模型在所有数据量和延迟要求下占优。

训练和推理的顺序依赖是直接代价。要得到第 $t$ 步状态，通常先要计算前一步；长序列的并行方式受到限制。小状态可能丢信息，大状态又增加计算与优化难度。与 Transformer 比较时，应同时看上下文访问方式、状态内存、计算随序列增长的规律，而不是只比名称新旧。

理解本篇需要五项概念：隐藏状态保存输入相关信息；参数保存跨样本学到的规则；BPTT 将输出误差传播到较早计算；插值组合多个概率模型；WER 衡量整个识别输出中的词错误。把状态和参数严格分开，是后续理解上下文学习和测试时适配的基础。

| 原有问题 | 作者改动 | 为什么可能有效 | 实验证据 | 代价与局限 |
|---|---|---|---|---|
| 固定阶数语言模型直接截断更早历史 | 用循环隐藏状态累计历史，并用于条件词概率 | 状态能传递窗口之外的可用信息，与n-gram统计互补 | 表2–4的WSJ与RT05困惑度、WER | 状态压缩仍会丢信息；最佳结果含动态处理和模型组合，不能全算作单网络收益 |

## 自测与参考答案

**1. RNN 看到了任意长历史，为什么仍可能忘记第一句话？**

历史通过有限维状态压缩，新的内容会改变状态；训练梯度也未必能指导长期保留。公式中的递归依赖只说明存在信息路径，不说明每条信息都被保留，更不说明能在需要时正确读出。

**2. PPL 从 200 降到 100，WER 是否也应减半？**

不应。PPL 衡量真实词概率的几何平均，WER 依赖候选排序和完整识别流程。概率可以明显改善，却不足以改变最高分候选；也可能少量概率变化恰好纠正关键排序。两者要分别报告。

**3. 如何公平比较静态与动态语言模型？**

明确动态模型能访问哪些已观察文本、何时更新、是否使用真实标签，以及总更新成本。静态对照应共享候选系统和测试集。合法的在线适配仍然是额外能力与预算，不能在结果表里省略。
