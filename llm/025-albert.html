    <textarea id="md-source" class="hidden" readonly># 025｜ALBERT：共享参数可以减少存储，但不会取消重复计算

[目录](README.md) · [上一篇](024-megatron.md) · [下一篇](026-zero.md)

**论文**：Zhenzhong Lan 等，*ALBERT: A Lite BERT for Self-supervised Learning of Language Representations*，2019 年预印本、ICLR 2020。[原文](https://arxiv.org/abs/1909.11942) · [PDF](https://arxiv.org/pdf/1909.11942)。本篇把参数压缩、计算和 SOP 目标分别讨论，避免把“更少参数”直接翻译为“同倍数更快”。

## 一分钟理解

BERT 的词嵌入和多层独立权重占用大量参数。ALBERT 将词嵌入维度与隐藏维度分开，并在不同层共享参数，减少总权重；同时用句序预测 SOP 代替较容易利用主题差异的句段任务。

节省下来的参数空间可以用于更宽模型，但重复应用共享层仍消耗计算。论文展示了参数效率与任务质量取舍，也显示部分共享配置会降低表现。核心不是所有压缩都无损，而是重新分配存储、容量和训练目标。

## 背景：词表维度为什么必须等于隐藏维度？

若词表大小为 $V$、隐藏维度为 $H$，直接嵌入需要 $VH$ 参数。但词项的静态输入表示与上下文化隐藏计算承担不同功能，没有必然要求二者同维。分解为 $V\times E$ 与 $E\times H$，当 $E\ll H$ 时可以节约很多权重。

另一方面，堆叠 $L$ 层独立 Transformer 使参数随层数增长。如果相同变换被多次应用，存储可以减少，深度计算仍然保留。这类似重复使用一个操作，而不是只执行一次后复制结果；每次输入状态不同，输出也不同。

共享限制了各层独立学习功能，可能损失表达灵活性。是否可接受，要与节省后能扩大宽度或训练规模的收益一起衡量。参数更少不是一个单独保证质量的理由。

## 方法：分解、共享与句序目标

嵌入可以写为：

$$
e(w)=E_wP,\qquad E_w\in\mathbb R^E,\quad P\in\mathbb R^{E\times H}.
$$

它把原本 $VH$ 参数变为约 $VE+EH$。跨层共享则写成 $h_{l+1}=F_\theta(h_l)$，相同 $\theta$ 多次使用。共享注意力、共享前馈或全部共享是不同配置，论文分别分析，而非只有一种开关。

SOP 的正例来自同文档连续句段，负例将同样两段交换顺序。与随机取另一文档作为负例相比，主题更接近，模型较难只靠主题是否相同完成判断。它试图强调连贯顺序，但仍可能利用局部格式捷径，不能直接等同于篇章推理测验。

训练继续使用 MLM，并加入 SOP 二分类。这里同时有参数化和目标改变，因此最终成绩不能全归因于共享。必须阅读分解消融、共享消融与 SOP 消融各自的结果。

```text
构建低维词嵌入与到隐藏维的投影
按选定策略让多个Transformer层复用参数
构造连续句段对：保留顺序为正例、交换顺序为负例
按MLM协议破坏选中token
多次应用共享层，计算MLM与SOP损失
预训练后按下游任务微调
分别统计独立参数、实际FLOPs与任务成绩
```

数学目标是词恢复加句序判断；机制是参数分解共享；指标包括任务分数、总参数与速度。层共享没有减少层应用次数，因此不能将参数缩减比例直接当作计算缩减比例。

## 实验与证据

| 项目 | 原文范围 |
|---|---|
| 规模 | BASE、LARGE、XLARGE、XXLARGE 等，不同隐藏宽度 |
| 参数比较 | 对应 BERT 与 ALBERT 配置，明确嵌入维与共享策略 |
| 任务 | SQuAD、MNLI、SST、RACE、GLUE 等 |
| 消融 | 嵌入尺寸、共享范围、句段目标与训练时长 |
| 指标 | 任务分数与速度，参数数量单独报告 |
| 预算 | 更宽配置实际计算更大；1M与1.5M步等需区别 |

**证据一，表 1 与方法章节。**ALBERT-LARGE 约 18M 参数，对应表列 BERT-LARGE 约 334M。它支持显著权重存储缩减，但不意味着其每层矩阵计算按同样比例减少。

**证据二，第 4.5 节表 4。**全部共享在受控条件下可能损失任务分数，显示压缩有代价。最终大模型通过其他配置获得强结果，不应抹去这个消融中的真实下降。

**证据三，第 4.6 节表 5 的 SOP/NSP 分析。**交换句序目标检验连贯性监督，相应任务收益支持设计动机，但主结果还包含宽度、训练和其他配方。单模型、集成与不同步数必须分开读；章节和表号对应原文修订版。

参数少与更快有时同向，有时相反：较小嵌入节省部分运算，而更宽隐藏层可能增加主要计算。系统是否受内存或算力限制，也会改变实际速度。评价时应使用明确硬件与吞吐，不能仅从模型文件大小推断。

## 教学例子：共享同一层为什么仍有深度

构造 $h_{l+1}=\tanh(Wh_l)$。连续应用三次得到 $\tanh(W\tanh(W\tanh(Wh_0)))$，一般不等于一次应用。参数只存一份，但计算进行了三次，状态在每次迭代改变。

如果共享变换在某些输入上逐渐收缩到相似状态，过深重复可能损失区分；若形成有用迭代，可能逐步精炼表示。是否发生这类行为需要隐藏状态和任务实验，不能因共享就断言模型等价于循环网络的所有性质。

SOP 教学例子是“先烧水，再泡茶”与交换顺序。两段词汇和主题相同，单靠判断是否都谈茶不够。但如果标点或首句惯用词泄露顺序，模型仍可能走捷径，所以更强验证需要控制这些线索。

## 与其他参数高效方法的区别

Adapters 主要减少每个下游任务的新增参数，ALBERT 改变基座本身的参数化。两者节省资源的位置不同，可以结合，也不能直接拿一个任务增量百分比与整个预训练模型参数量比较。

MoE 则让总参数增加而单次激活相对少；ALBERT 通过重复共享让总参数减少但多层计算继续。两种方法甚至在参数与计算关系上方向相反，说明“高效”必须明确指存储、训练还是推理。

## 贡献与局限

ALBERT 将嵌入、隐藏宽度、深度和参数共享拆开，为模型规模设计提供更多选择。限制是共享表达约束、重复计算、目标捷径以及超参数和训练预算。它没有证明压缩后所有能力无损，也没有给任意任务提供最佳宽深比。

五个前置概念是矩阵分解、权重共享、重复计算、SOP 与资源口径。理解这些，才能判断“轻量”到底轻在何处，并避免被一个参数数字误导。

修订版表6还给出墙钟条件的例子：BERT-large训练400k步约34小时、汇总分87.2，ALBERT-xxlarge训练125k步约32小时、88.7。它显示同时间比较与同参数比较会得出不同观察；这些数值只适用于该配置和硬件，不能转成普遍速度倍率。

|原有问题|作者改动|为什么可能有效|实验证据|代价与局限|
|---|---|---|---|---|
|编码器权重存储与嵌入参数冗余|嵌入因式分解、跨层共享与SOP|减少重复权重并学习句序连贯性|表1参数、表4共享、表5SOP|共享可能损失性能，参数少不等于计算少|

## 自测与参考答案

**1. 共享12层权重，是否意味着只执行一次Transformer层？**

不是。相同参数被应用12次，各次输入状态不同，计算仍重复。存储减少与运算次数减少不是同一件事。

**2. SOP 为什么比随机文档配对更难只靠主题完成？**

正负例使用相同连续句段，仅交换顺序，主题基本相同。因此需要利用顺序或连贯线索。但局部格式仍可能提供捷径，不能自动保证深层篇章理解。

**3. 最终模型更强，是否证明全部共享没有损失？**

不能。最终结果还可能扩大宽度和训练预算；受控共享消融可以显示下降。应分别报告压缩代价与重新分配资源后的系统收益。
