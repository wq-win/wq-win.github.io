<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关键概念名词表 | MyLog</title>
    <script>try { if (localStorage.getItem('mylog-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#3b82f6' }, boxShadow: { 'card': '0 4px 6px -1px rgba(0,0,0,.1)', 'card-hover': '0 10px 15px -3px rgba(0,0,0,.1)' } } } };
    </script>
    <link rel="alternate" type="application/rss+xml" title="MyLog RSS" href="rss.xml">
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="site-header"></div>
    <main class="container mx-auto px-4 py-10 max-w-5xl">
        <h1 class="text-3xl font-bold mb-3">关键概念名词表</h1>
        <p class="text-gray-600 mb-8">精读里反复出现的词。点进去会跳到对应论文；正文里同样的词也会带虚线，悬停可以看到这一句解释。</p>
        <input id="glossary-filter" type="search" placeholder="过滤术语…" class="search-input w-full md:w-80 mb-6 px-4 py-2 rounded-full border border-gray-300">
        <div id="glossary-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </main>
    <div id="site-footer"></div>
    <script src="js/site-config.js"></script>
    <script src="js/glossary-data.js"></script>
    <script src="js/site-chrome.js"></script>
    <script>
        SeriesChrome.mount({ root: '' });
        function render(query) {
            const q = (query || '').toLowerCase();
            const items = (window.GLOSSARY || []).filter((item) => {
                const blob = [item.term].concat(item.aliases || []).concat([item.definition]).join(' ').toLowerCase();
                return !q || blob.indexOf(q) !== -1;
            });
            document.getElementById('glossary-list').innerHTML = items.map((item) => `
                <a class="block bg-white rounded-lg shadow-card hover:shadow-card-hover p-5" href="${item.href}">
                    <div class="font-bold text-lg mb-1">${item.term}</div>
                    <div class="text-xs text-gray-400 mb-2">${(item.aliases || []).join(' · ')}</div>
                    <p class="text-gray-600 text-sm">${item.definition}</p>
                </a>
            `).join('');
        }
        render('');
        document.getElementById('glossary-filter').addEventListener('input', (event) => render(event.target.value));
    </script>
</body>
</html>
