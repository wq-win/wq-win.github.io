[系列首页](README.md) · [上一篇](01-actor-critic.md) · [下一篇](03-dyna.md)

**原论文与版本**：*Learning to Predict by the Methods of Temporal Differences*，1988。[原论文](https://jmvidal.cse.sc.edu/library/sutton88a.pdf)。

## 一、先用一分钟讲明白

**研究问题**：长序列中的预测与信用分配

**旧方法卡点**：Monte Carlo 要等终局，早期预测难以及时修正

**作者主张**：用相邻预测差和资格迹更新历史状态

**论文证据**：原文随机游走实验与特殊条件下的理论分析支持 TD 的有效性

**一句话**：在固定过程的在线预测，通常先不学习策略中，作者通过“用相邻预测差和资格迹更新历史状态”应对“长序列中的预测与信用分配”这一问题；证据边界或代价是：函数表示、步长和 λ 改变偏差与方差，非任意设置都更好。

## 二、研究背景与问题定义

本篇将“长序列中的预测与信用分配”放在固定过程的在线预测，通常先不学习策略的边界内研究。Monte Carlo 要等终局，早期预测难以及时修正。先固定下表中的任务、反馈与信息权限，再判断后面哪一项改动真正回答了这个问题；算法机制有效与适用于任意环境是不同结论。

| 要素 | 本文设定 |
|---|---|
| 研究场景 | 固定过程的在线预测，通常先不学习策略 |
| 状态／观测 | 随机过程当前状态 |
| 动作 | 预测任务不必有可学习动作 |
| 奖励或学习信号 | 终局结果或一般化后的逐步奖励 |
| 终止／边界 | 吸收终点；终值作为预测目标 |

## 三、方法：到底改了什么

TD 先解决评价问题：不知道终局，也可让当前预测靠近下一步更有信息的预测。资格迹 e 保存过去哪些参数应该收到这次误差。λ 小让影响集中于近处，λ 大把责任传播更远。与 Q-learning 不同，本文的基础目标不是比较动作的最大 Q。

### 关键公式与符号

现代奖励形式：$\delta_t=r_t+\gamma V_w(s_{t+1})-V_w(s_t)$，$e_t=\gamma\lambda e_{t-1}+\nabla_wV_w(s_t)$，$w\leftarrow w+\alpha\delta_t e_t$。λ 是迹衰减，不是学习率。原文终局预测形式可以在中间奖励为零时对应理解。

### 输入 → 处理 → 输出：教学伪代码

以下伪代码展示核心更新流程；简化条件见代码注释与后文。

```text
输入：固定过程，V 参数 w，α,γ,λ
每个回合开始：e ← 0
逐步观察 s,r,s_next：
  next_value ← 0 if 真终止 else V(s_next)
  δ ← r + γ*next_value - V(s)
  e ← γ*λ*e + ∇w V(s)
  w ← w + α*δ*e
回合结束清空 e
输出：预测函数 V
```

**实现要点**：在线变化参数下，普通累积迹与离线前向 λ-return 的逐步严格等价不能不加条件；不要倒灌后来 true-online TD 的结论。

### 三种“优化”要分开

| 层次 | 这里具体是什么 |
|---|---|
| 数学目标／训练损失 | 拟合未来结果或策略价值；以TD残差与资格迹进行随机逼近 |
| 机制改变 | 用相邻预测差和资格迹更新历史状态 |
| 评价改善的指标 | 预测值对真实概率的误差 |

**实验解读（本文分析）**：函数表示、步长和 λ 改变偏差与方差，非任意设置都更好。比较时应分别核对真实交互、更新次数和计算时间；论文曲线的横轴只支持相应预算下的结论。

**结论边界**：原文随机游走实验与特殊条件下的理论分析支持 TD 的有效性。函数表示、步长和 λ 改变偏差与方差，非任意设置都更好。

## 六、贡献、代价与局限

**作者论证**包括特定线性情形的收敛与预测优势。**本文分析**：bootstrapping 把样本等待成本换成估计依赖；状态不是充分统计量时，相邻预测也可能系统性出错。后续 GAE 将类似混合思想用于策略优势估计，但两者优化角色不同。

## 七、帮助建立理解

### 教学例子

以下是教学推演，不是原论文实验。

状态 A→B→终点1，初始 V(A)=V(B)=0.5，γ=1。A→B 的 δ=0；B→终点的 δ=0.5。若 λ=0，主要更新 B；λ=0.8，A 的残留迹也让它得到 α×0.5×0.8 的修正。

### 五个前置概念

1. **预测学习**：估计未来结果而非直接找动作。
2. **Bootstrapping**：把另一个当前估计用于目标。
3. **资格迹**：保存历史特征的衰减记忆。
4. **λ-return**：混合不同长度回报的目标。
5. **偏差—方差**：错误先验与采样噪声的折中。

### 三个值得继续追问的问题

1. 转移噪声变大时，最优 λ 会怎样变化？
2. 若状态表示混合了两个不同真实状态，TD 的目标是什么？
3. 为什么 TD 误差小不能直接证明策略最优？
