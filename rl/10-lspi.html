## 一、先用一分钟讲明白

**研究问题**：有限经验下怎样高效评价并改善策略

**旧方法卡点**：普通 TD 小步更新可能反复消耗样本，状态价值评价难直接支持 off-policy 控制

**作者主张**：把最小二乘 TD 扩展到动作价值，交替求解线性系统和贪心改进

**论文证据**：论文理论与控制实验展示固定样本的重复利用

**一句话**：在基于批量转移、无模型、近似策略迭代中，作者通过“把最小二乘 TD 扩展到动作价值，交替求解线性系统和贪心改进”应对“有限经验下怎样高效评价并改善策略”这一问题；证据边界或代价是：线性特征、数据覆盖与矩阵条件决定可用性。

## 二、研究背景与问题定义

本篇将“有限经验下怎样高效评价并改善策略”放在基于批量转移、无模型、近似策略迭代的边界内研究。普通 TD 小步更新可能反复消耗样本，状态价值评价难直接支持 off-policy 控制。先固定下表中的任务、反馈与信息权限，再判断后面哪一项改动真正回答了这个问题；算法机制有效与适用于任意环境是不同结论。

| 要素 | 本文设定 |
|---|---|
| 研究场景 | 基于批量转移、无模型、近似策略迭代 |
| 状态／观测 | 环境状态的人工或固定特征 |
| 动作 | 可计算 argmax 的离散动作 |
| 奖励或学习信号 | 转移中的实际奖励 |
| 终止／边界 | 终止时后继特征为零 |

## 三、方法：到底改了什么

LSPI 的 Critic 是 Q_w(s,a)=φ(s,a)ᵀw。给定当前策略，用 LSTDQ 的矩阵方程评价它；再把策略改成此 Q 的贪心策略。关键是原始转移仍可重用，而每轮后继动作特征会随策略改变。它不是监督学习中固定标签的一次线性回归。

### 关键公式与符号

$$A=\sum_i\phi_i(\phi_i-\gamma\phi(s'_i,\pi(s'_i)))^\top,\quad b=\sum_i\phi_i r_i,\quad Aw=b.$$
A 一般不是普通回归的对称协方差矩阵。求解的是投影 Bellman 固定点，不能随意等同于最小化逐样本 Bellman 残差。

### 输入 → 处理 → 输出：教学伪代码

以下伪代码展示核心更新流程；简化条件见代码注释与后文。

```text
输入：固定转移集 D 与特征 φ；初始策略 π
repeat：
  A ← 0；b ← 0
  for (s,a,r,s_next,done) in D：
    x ← φ(s,a)
    x_next ← 0 if done else φ(s_next,π(s_next))
    A += x*(x-γ*x_next)ᵀ；b += x*r
  解 Aw=b（必要时明确数值正则）
  π_new(s) ← argmax_a φ(s,a)ᵀw
  判断策略或参数是否收敛
  π ← π_new
输出：Q_w 与 π
```

**实现要点**：线性特征、数据覆盖与矩阵条件决定可用性。

### 三种“优化”要分开

| 层次 | 这里具体是什么 |
|---|---|
| 数学目标／训练损失 | 近似策略迭代；LSTDQ解投影Bellman线性方程，再贪心改进 |
| 机制改变 | 把最小二乘 TD 扩展到动作价值，交替求解线性系统和贪心改进 |
| 评价改善的指标 | 控制回报／平衡表现和数据效率 |

## 六、贡献、代价与局限

**作者贡献**是把样本高效的最小二乘评价变为控制方法。**本文分析**：稀疏覆盖会使矩阵病态，也会让贪心策略追逐不可信动作；后来离线 RL 对分布外动作的限制正补这一类风险。

## 七、帮助建立理解

### 教学例子

以下是教学推演，不是原论文实验。

单特征 φ=1，γ=0.9，每条奖励都为1，持续任务下 A=0.1N，b=N，得到 w=10。若把后继特征错误当作零，会得到1，相当于把持续任务变成一步任务。

### 五个前置概念

1. **策略迭代**：交替评价与改善策略。
2. **线性价值逼近**：Q 是固定特征的线性组合。
3. **投影 Bellman 方程**：把目标映射回可表达函数空间。
4. **条件数**：衡量矩阵求解对误差的敏感性。
5. **数据覆盖**：样本是否包含决策所需信息。

### 三个值得继续追问的问题

1. 加入一个无法被数据激活的特征会怎样？
2. 同一数据重复求解为什么不等于增加独立证据？
3. 离线场景的贪心改进为何可能降低真实收益？
