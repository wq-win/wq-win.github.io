    <textarea id="md-source" class="hidden" readonly># 第 51 天｜KTO：只有“好／不好”标签，如何进行模型对齐

[系列首页](README.md) · [上一篇](50-ipo.md) · [下一篇](52-grpo.md)

**原论文与版本**：*KTO: Model Alignment as Prospect Theoretic Optimization*，2024。[原论文](https://arxiv.org/abs/2402.01306)。

## 一、先用一分钟讲明白

**研究问题**：成对偏好数据的采集要求

**旧方法卡点**：每个提示准备可比较的一对回答成本高

**作者主张**：用前景理论式效用构造可使用单条好坏标签的目标

**论文证据**：原文模型与偏好数据实验显示非成对反馈的可用性

**一句话**：在离线二元反馈的语言模型策略对齐中，作者通过“用前景理论式效用构造可使用单条好坏标签的目标”应对“成对偏好数据的采集要求”这一问题；证据边界或代价是：参考点估计、好坏比例和标签来源会改变效果。

## 二、研究背景与问题定义

本篇将“成对偏好数据的采集要求”放在离线二元反馈的语言模型策略对齐的边界内研究。每个提示准备可比较的一对回答成本高。先固定下表中的任务、反馈与信息权限，再判断后面哪一项改动真正回答了这个问题；算法机制有效与适用于任意环境是不同结论。

| 要素 | 本文设定 |
|---|---|
| 研究场景 | 离线二元反馈的语言模型策略对齐 |
| 状态／观测 | 提示x |
| 动作 | 单条回答y |
| 奖励或学习信号 | desirable／undesirable标签 |
| 终止／边界 | 回答结束 |

## 三、方法：到底改了什么

KTO比较隐式奖励与参考点，而非只比较同提示两条回答。好标签希望log比高于参考点，坏标签希望低于它；两个方向可不同加权，以处理数据比例。心理学启发用于损失设计，不等于已证明语言模型具有人的心理。

### 关键公式与符号

令 $r_\theta=\beta\log(\pi_\theta/\pi_{ref})$，参考点为z。好样本效用 $u_D=\lambda_D\sigma(r_\theta-z)$，坏样本效用 $u_U=\lambda_U\sigma(z-r_\theta)$；最小化对应最大效用减当前效用。z依原文KL估计和停止梯度处理，不直接用本条标签泄漏构造。

### 输入 → 处理 → 输出：教学伪代码

以下伪代码展示核心更新流程；简化条件见代码注释与后文。

```text
输入单条(x,y,label)数据，固定参考模型
每batch：
  估计原文规定的KL参考点z并停止其梯度
  r←β*(logπθ(y|x)-logπ_ref(y|x))
  if label=好：utility←λ_D*sigmoid(r-z)
  else：utility←λ_U*sigmoid(z-r)
  最小化各类常数上界-utility
检查好坏标签比例与权重
输出：二元反馈对齐策略
```

**实现要点**：参考点估计、好坏比例和标签来源会改变效果。

### 三种“优化”要分开

| 层次 | 这里具体是什么 |
|---|---|
| 数学目标／训练损失 | 最大化相对KL参考点的好坏样本效用，按类别权重聚合 |
| 机制改变 | 用前景理论式效用构造可使用单条好坏标签的目标 |
| 评价改善的指标 | judge胜率与标准任务评价 |

**实验解读（本文分析）**：参考点估计、好坏比例和标签来源会改变效果。比较时应分别核对真实交互、更新次数和计算时间；论文曲线的横轴只支持相应预算下的结论。

**结论边界**：原文模型与偏好数据实验显示非成对反馈的可用性。参考点估计、好坏比例和标签来源会改变效果。

## 六、贡献、代价与局限

**作者贡献**是可利用更简单反馈的对齐目标。**本文分析**：把成对偏好拆成好坏并不保证好／坏是跨提示一致的绝对判断；类别不平衡会改变梯度。数据易得与信息量相同也不能混为一谈。

## 七、帮助建立理解

### 教学例子

以下是教学推演，不是原论文实验。

同一回答在两条候选里较好，不代表它绝对优秀。若把所有胜者标好、败者标坏，标签含相对判断的噪声；KTO能使用这些标签，但不能自动消除噪声。

### 五个前置概念

1. **二元反馈**：每条回答独立标好或坏。
2. **参考点**：决定收益与损失相对尺度的基准。
3. **效用函数**：把隐式奖励映射成优化偏好。
4. **类别权重**：调整好坏样本贡献。
5. **HALO**：原文对一类人类感知式损失的命名。

### 三个值得继续追问的问题

1. 相对胜负拆成绝对标签会丢失什么？
2. 好坏比例变化时如何调整λ？
3. 参考点估计偏差会怎样影响两类样本？

## 方法与证据总结

| 原有问题 | 作者的改动 | 为什么可能有效 | 实验证据／理论证据 | 代价与局限 |
|---|---|---|---|---|
