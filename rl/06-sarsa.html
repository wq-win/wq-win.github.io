## 一、先用一分钟讲明白

**研究问题**：探索中的行为价值应该如何更新

**旧方法卡点**：Q-learning 目标假设下一步贪心，实际行为却可能继续探索

**作者主张**：以实际采样的下一动作构造 TD 目标，并研究连接主义在线更新

**论文证据**：原报告讨论移动机器人导航及在线更新；原始 PDF 文本提取受限，实验细节尚未可靠核实

**一句话**：在单智能体、无模型、on-policy 的动作价值学习中，作者通过“以实际采样的下一动作构造 TD 目标，并研究连接主义在线更新”应对“探索中的行为价值应该如何更新”这一问题；证据边界或代价是：不能将后来的教材悬崖例子写成 1994 原文实验。

## 二、研究背景与问题定义

本篇将“探索中的行为价值应该如何更新”放在单智能体、无模型、on-policy 的动作价值学习的边界内研究。Q-learning 目标假设下一步贪心，实际行为却可能继续探索。先固定下表中的任务、反馈与信息权限，再判断后面哪一项改动真正回答了这个问题；算法机制有效与适用于任意环境是不同结论。

| 要素 | 本文设定 |
|---|---|
| 研究场景 | 单智能体、无模型、on-policy 的动作价值学习 |
| 状态／观测 | 机器人感知／状态表示；教学上记为 s |
| 动作 | 当前策略采样的 a 和下一动作 a' |
| 奖励或学习信号 | 导航目标相关反馈；精确原文奖励本文未核实 |
| 终止／边界 | 到达目标或任务失败；精确阈值未核实 |

## 三、方法：到底改了什么

SARSA 的名字对应五元组 (s,a,r,s',a')。与最大 Q 目标相比，它把未来仍会探索这件事纳入评价。它仍属于基于价值的方法：策略可以从 Q 经 ε-greedy 产生，不需要单独 Actor。表格 SARSA(0) 只是理解入口；原报告涉及函数逼近、资格迹和其他更新，不能用这一页代码替代全部原文。

### 关键公式与符号

$$Q(s,a)\leftarrow Q(s,a)+\alpha[r+\gamma Q(s',a')-Q(s,a)],\quad a'\sim\pi(\cdot|s').$$

与 Q-learning 的差异只有目标中的 $Q(s',a')$ 与 $\max_bQ(s',b)$，却改变了被评价的策略。若行为持续探索，学到的是该行为下的后果。

### 输入 → 处理 → 输出：教学伪代码

以下伪代码展示核心更新流程；简化条件见代码注释与后文。

```text
初始化 Q；每回合 s ← reset()
a ← ε-greedy(Q,s)
while 未结束：
  r,s_next,done ← step(a)
  if done：
    y ← r
  else：
    a_next ← ε-greedy(Q,s_next)
    y ← r+γ*Q(s_next,a_next)
  Q(s,a) ← Q(s,a)+α*(y-Q(s,a))
  if not done: s,a ← s_next,a_next
输出：基于 Q 的行为策略
```

**实现要点**：必须执行已经用于目标的 a_next；若更新完后重新采另一个动作，需重新解释采样和目标的一致性。

### 三种“优化”要分开

| 层次 | 这里具体是什么 |
|---|---|
| 数学目标／训练损失 | 评价并改善实际探索策略；TD目标使用实际下一动作Q |
| 机制改变 | 以实际采样的下一动作构造 TD 目标，并研究连接主义在线更新 |
| 评价改善的指标 | 导航表现及训练参数敏感性，未填数值 |

## 六、贡献、代价与局限

**原论文证据受阅读范围限制。本文分析**：on-policy 的含义不等于天然安全，只是评价包含探索行为。探索概率长期不降时，最终行为与贪心最优不同；神经函数逼近也不能自动继承表格收敛性质。

## 七、帮助建立理解

### 教学例子

以下是教学推演，不是原论文实验。

下一状态两个动作的 Q 为 10 和 −10，ε-greedy 的实际概率为 0.9、0.1。Q-learning 后继项是 10；SARSA 样本可能为 10 或 −10，其期望为 8。这是自构计算，说明探索风险进入目标，不是原报告的数值实验。

### 五个前置概念

1. **on-policy**：采样与评价针对同一行为。
2. **ε-greedy**：大部分贪心、小部分探索。
3. **SARSA 五元组**：目标需要下一动作。
4. **资格迹**：把 TD 误差传给历史特征。
5. **函数逼近**：用共享参数代替完整价值表。

### 三个值得继续追问的问题

1. 把 ε 从 0.2 降到零时，评价目标如何变化？
2. 训练安全与部署贪心收益应怎样分别报告？
3. 若使用 replay，哪些条件下仍能保持 on-policy 解释？
