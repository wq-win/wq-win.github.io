    <textarea id="md-source" class="hidden" readonly># 第 15 天｜GAE：把一串 TD 误差变成更好用的策略优势

[系列首页](README.md) · [上一篇](14-trpo.md) · [下一篇](16-dqn.md)

**原论文与版本**：Schulman 等，*High-Dimensional Continuous Control Using Generalized Advantage Estimation*，2015／2016。[正文](https://arxiv.org/html/1506.02438v6)。

## 一、先用一分钟讲明白

**研究问题**：策略梯度的优势估计噪声

**旧方法卡点**：整段回报方差大，一步 TD 又依赖不准确的价值函数

**作者主张**：以几何权重混合未来 TD 残差

**论文证据**：§6 控制实验比较 γ、λ 对学习的影响

**一句话**：在on-policy Actor–Critic 的优势估计中，作者通过“以几何权重混合未来 TD 残差”应对“策略梯度的优势估计噪声”这一问题；证据边界或代价是：估计器不能替代策略优化器；偏差取决于折扣和价值误差。

## 二、研究背景与问题定义

本篇将“策略梯度的优势估计噪声”放在on-policy Actor–Critic 的优势估计的边界内研究。整段回报方差大，一步 TD 又依赖不准确的价值函数。先固定下表中的任务、反馈与信息权限，再判断后面哪一项改动真正回答了这个问题；算法机制有效与适用于任意环境是不同结论。

| 要素 | 本文设定 |
|---|---|
| 研究场景 | on-policy Actor–Critic 的优势估计 |
| 状态／观测 | 控制环境状态 |
| 动作 | 策略采样动作 |
| 奖励或学习信号 | 逐步任务奖励 |
| 终止／边界 | 真实终止与 batch 截断分别处理 |

## 三、方法：到底改了什么

GAE 没有提出新的动作网络，也不规定必须 PPO。原论文与 TRPO 配合，核心是把评价信号做好。一步残差利用 V 降低等待成本，多步残差修正短期估计误差。λ 控制相信短期 V 还是依赖长回报，γ 在原文中还作为方差调节进入分析。

### 关键公式与符号

$$\delta_t=r_t+\gamma V(s_{t+1})-V(s_t),\quad\hat A_t=\sum_{l\ge0}(\gamma\lambda)^l\delta_{t+l}.$$
反向递推为 $A_t=\delta_t+\gamma\lambda A_{t+1}$。λ=0 是一步 TD，λ=1 在完整回合中对应带价值基线的回报差；不能忘记尾部 bootstrap。

### 输入 → 处理 → 输出：教学伪代码

以下伪代码展示核心更新流程；简化条件见代码注释与后文。

```text
用旧策略和旧 V 收集 rollout
next_adv ← 0
从最后一步向前：
  bootstrap_mask ← 0 若真正终止，否则1
  trace_mask ← 0 若回合边界或 rollout 边界，否则1
  δ_t ← r_t+γ*bootstrap_mask*V(s_next)-V(s_t)
  A_t ← δ_t+γ*λ*trace_mask*next_adv
  next_adv ← A_t
冻结 A，供 TRPO/PPO 等更新策略
按选定原文回报目标训练 V
输出：优势估计与策略／价值更新所需目标
```

**实现要点**：rollout 截断处可 bootstrap V，但不能串到下一回合的优势；原文价值训练流程不应直接替换成所有现代 PPO 的实现细节。

### 三种“优化”要分开

| 层次 | 这里具体是什么 |
|---|---|
| 数学目标／训练损失 | 估计策略优势；GAE本身不是独立策略优化损失 |
| 机制改变 | 以几何权重混合未来 TD 残差 |
| 评价改善的指标 | 回报随采样或迭代变化 |

## 四、实验如何验证方法

| 实验要素 | 原文设定与证据范围 |
|---|---|
| 环境与任务 | cart-pole、双足、四足与起立控制 |
| 数据来源与规模 | 当前策略轨迹 |
| 对比基线 | 不同 γ/λ 等优势估计配置 |
| 训练预算与资源 | cart-pole每批20轨迹；双足约50k步、部分其他任务200k步每批，见§6 |
| 指标及其含义 | 回报随采样或迭代变化 |
| 随机性与不确定性 | 各实验重复与区间本文未全部核实 |
| 实际验证的假设 | 混合残差是否改善偏差—方差折中 |

**实验解读（本文分析）**：估计器不能替代策略优化器；偏差取决于折扣和价值误差。比较时应分别核对真实交互、更新次数和计算时间；论文曲线的横轴只支持相应预算下的结论。

## 五、结果：证据到底有多强

| 证据定位 | 比较什么／观察到什么 | 支持什么 | 不能证明什么 |
|---|---|---|---|
| §3 核心表达 | 多步优势与 TD 和的关系 | 解释 λ 的作用 | 不保证任何 λ 都最优 |
| §4 reward shaping 解释 | 残差与势函数变换联系 | 提供另一种理解 | 不是添加任意奖励都不改任务 |
| §6 γ/λ 实验 | 不同估计器配置的控制曲线 | 支持优势估计影响学习 | 不能把全部收益归于优化器 |

**结论边界**：§6 控制实验比较 γ、λ 对学习的影响。估计器不能替代策略优化器；偏差取决于折扣和价值误差。

## 六、贡献、代价与局限

**作者贡献**是可调的优势估计框架。**本文分析**：V 错误、截断处理错误和不一致的 γ 目标都可能改变估计。优势方差小也未必好：全为零的优势方差最小，但完全无法学习。

## 七、帮助建立理解

### 教学例子

以下是教学推演，不是原论文实验。

三步 TD 残差为1、2、−1，γλ=0.5，则 A0=1+0.5×2+0.25×(−1)=1.75。它既不是首步误差1，也不是总和2，而是按距离衰减的修正。

### 五个前置概念

1. **优势**：某动作比当前状态平均前景好多少。
2. **TD 残差**：相邻价值预测的误差信号。
3. **Bootstrap**：用价值估计补足未观测未来。
4. **λ**：控制多步误差权重。
5. **截断**：采样因预算停止但环境未终止。

### 三个值得继续追问的问题

1. V 很准确时为什么较小 λ 可能有利？
2. 把时间限制当真正终止会产生什么偏差？
3. 为什么 GAE 可以与多种策略优化器组合？

## 方法与证据总结

| 原有问题 | 作者的改动 | 为什么可能有效 | 实验证据／理论证据 | 代价与局限 |
|---|---|---|---|---|
| 策略梯度的优势估计噪声 | 以几何权重混合未来 TD 残差 | 混合不同跨度TD修正，调节价值误差与回报噪声的折中 | §6 控制实验比较 γ、λ 对学习的影响 | 估计器不能替代策略优化器；偏差取决于折扣和价值误差 |
