[系列首页](README.md) · [上一篇](21-alphago.md) · [下一篇](23-gail.md)

**原论文与版本**：*Asynchronous Methods for Deep Reinforcement Learning*，2016。[原论文](https://arxiv.org/abs/1602.01783)。

## 一、先用一分钟讲明白

**研究问题**：深度RL的相关样本与训练吞吐

**旧方法卡点**：单一环境经验相关，replay增加存储和机制复杂度

**作者主张**：多个worker独立交互并异步更新共享Actor–Critic

**论文证据**：控制与Atari实验显示CPU并发的实用表现

**一句话**：在异步多worker、通常近似on-policy的单智能体学习中，作者通过“多个worker独立交互并异步更新共享Actor–Critic”应对“深度RL的相关样本与训练吞吐”这一问题；证据边界或代价是：异步梯度有滞后，部分调参比较不完全对等。

## 二、研究背景与问题定义

本篇将“深度RL的相关样本与训练吞吐”放在异步多worker、通常近似on-policy的单智能体学习的边界内研究。单一环境经验相关，replay增加存储和机制复杂度。先固定下表中的任务、反馈与信息权限，再判断后面哪一项改动真正回答了这个问题；算法机制有效与适用于任意环境是不同结论。

| 要素 | 本文设定 |
|---|---|
| 研究场景 | 异步多worker、通常近似on-policy的单智能体学习 |
| 状态／观测 | 各worker独立环境观测 |
| 动作 | 随机策略动作 |
| 奖励或学习信号 | 各任务环境奖励 |
| 终止／边界 | 短unroll截断需bootstrap，真终止不bootstrap |

## 三、方法：到底改了什么

多个worker不是博弈中的多个智能体，而是同一个任务的采样副本。它们不同的状态轨迹缓解短期相关性，多步回报加Critic减少等待。局部参数计算梯度后应用到共享参数，更新时共享网络可能已经变化。

### 关键公式与符号

$$R_t=\sum_{k=0}^{n-1}\gamma^kr_{t+k}+\gamma^nV(s_{t+n}),\quad A_t=R_t-V(s_t).$$
Actor 用 logπ×停止梯度的 A，再加熵；Critic回归R。真正终止处末端值为零。

### 输入 → 处理 → 输出：教学伪代码

以下伪代码展示核心更新流程；简化条件见代码注释与后文。

```text
启动多个worker，共享θ,w
每个worker反复：
  同步本地参数←共享参数
  执行最多t_max步或到终止
  R←0若真终止，否则本地V(末状态)
  反向遍历本地轨迹：
    R←r+γR
    累积Actor梯度 logπ*(R-V)+熵
    累积Critic梯度 (R-V)^2
  异步把局部梯度应用到共享参数
输出：共享策略
```

**实现要点**：异步梯度有滞后，部分调参比较不完全对等。

### 三种“优化”要分开

| 层次 | 这里具体是什么 |
|---|---|
| 数学目标／训练损失 | n步优势策略梯度加熵；价值网络回归n步目标 |
| 机制改变 | 多个worker独立交互并异步更新共享Actor–Critic |
| 评价改善的指标 | 分数与墙钟学习速度 |

## 四、实验如何验证方法

| 实验要素 | 原文设定与证据范围 |
|---|---|
| 环境与任务 | 57 Atari、连续控制及3D环境 |
| 数据来源与规模 | 多个独立环境并发采样 |
| 对比基线 | DQN与其他异步价值／Actor–Critic方法 |
| 训练预算与资源 | 图1异步方法16CPU核，DQN为K40GPU |
| 指标及其含义 | 分数与墙钟学习速度 |
| 随机性与不确定性 | 图1异步取50组学习率实验中最佳5组；DQN固定超参5种子 |
| 实际验证的假设 | 异步采样是否改善相关性和计算利用 |

**实验解读（本文分析）**：异步梯度有滞后，部分调参比较不完全对等。比较时应分别核对真实交互、更新次数和计算时间；论文曲线的横轴只支持相应预算下的结论。

## 五、结果：证据到底有多强

| 证据定位 | 比较什么／观察到什么 | 支持什么 | 不能证明什么 |

**结论边界**：控制与Atari实验显示CPU并发的实用表现。异步梯度有滞后，部分调参比较不完全对等。

## 六、贡献、代价与局限

**作者实验**展示无需经典replay也能有效训练。**本文分析**：异步不可重复的更新顺序影响复现；最佳5组曲线不能当随机5次训练的无偏均值。后续IMPALA明确处理actor与learner分离后的策略滞后。

## 七、帮助建立理解

### 教学例子

以下是教学推演，不是原论文实验。

worker A还在使用θ0，worker B已经把共享参数改成θ1。A的梯度随后应用到θ1，梯度来自旧策略；不同worker的轨迹去相关，并没有自动消除这类off-policy偏差。

### 五个前置概念

1. **Worker**：独立采样与局部计算的进程。
2. **异步更新**：不等待所有进程同时结束。
3. **n步回报**：若干真实奖励加末端价值。
4. **参数滞后**：采样或求梯度时参数已过时。
5. **墙钟时间**：真实经过的训练时间。

### 三个值得继续追问的问题

1. 加倍worker后真实交互量和时间怎样变化？
2. 最佳超参数曲线应怎样公平比较？
3. 异步和同步A2C有哪些统计与系统差异？
