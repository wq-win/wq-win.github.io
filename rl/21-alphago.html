[系列首页](README.md) · [上一篇](20-dueling-dqn.md) · [下一篇](22-a3c.md)

**原论文与版本**：*Mastering the game of Go with deep neural networks and tree search*，2016。[原论文](https://storage.googleapis.com/deepmind-media/alphago/AlphaGoNaturePaper.pdf)。

## 一、先用一分钟讲明白

**研究问题**：围棋巨大搜索空间中的决策

**旧方法卡点**：穷举分支不可行，浅层启发式难评价长期胜负

**作者主张**：结合人类棋谱策略学习、自我对弈强化学习、价值网络与树搜索

**论文证据**：2016原论文报告对樊麾五局全胜

**一句话**：在双人零和棋类、自我对弈与已知规则模型规划中，作者通过“结合人类棋谱策略学习、自我对弈强化学习、价值网络与树搜索”应对“围棋巨大搜索空间中的决策”这一问题；证据边界或代价是：不是AlphaGo Zero，训练使用人类棋谱与大量搜索资源。

## 二、研究背景与问题定义

本篇将“围棋巨大搜索空间中的决策”放在双人零和棋类、自我对弈与已知规则模型规划的边界内研究。穷举分支不可行，浅层启发式难评价长期胜负。先固定下表中的任务、反馈与信息权限，再判断后面哪一项改动真正回答了这个问题；算法机制有效与适用于任意环境是不同结论。

| 要素 | 本文设定 |
|---|---|
| 研究场景 | 双人零和棋类、自我对弈与已知规则模型规划 |
| 状态／观测 | 棋盘及合法落子相关历史 |
| 动作 | 合法落子或停着 |
| 奖励或学习信号 | 最终胜负 |
| 终止／边界 | 终局规则决定胜负 |

## 三、方法：到底改了什么

策略先验让搜索集中在值得尝试的落子，价值网络估计位置胜率，快速 rollout 提供另一终局评价，MCTS把多次模拟结果累积成更可靠的选择。原版有监督策略、强化策略、快速rollout策略等角色，不能用后来AlphaZero的一套网络循环替换。

原文一个容易漏掉的细节：搜索先验使用监督策略，价值网络则由较强的RL策略自我对弈数据训练。更强的直接行动策略不一定给搜索提供更好的多样候选。

### 关键公式与符号

教学搜索规则 $a=\arg\max_a[Q(s,a)+u(s,a)]$；u 随先验概率增大、随访问次数减少。叶子评价混合价值预测与rollout结果。不同组件损失分别是棋谱似然、胜负策略梯度与胜负价值回归。

### 输入 → 处理 → 输出：教学伪代码

以下伪代码展示核心更新流程；简化条件见代码注释与后文。

```text
先用人类棋谱训练监督策略
从监督初始化策略，做自我对弈强化学习
用自我对弈局面与终局结果训练价值网络
对每个实战局面：
  多次沿 Q+探索项选择树路径
  扩展叶节点，计算策略先验
  用价值网络及快速rollout评价叶子
  将评价回传到访问计数和平均价值
  根据根节点统计选择落子
输出：搜索后的落子
```

**实现要点**：不是AlphaGo Zero，训练使用人类棋谱与大量搜索资源。

### 三种“优化”要分开

| 层次 | 这里具体是什么 |
|---|---|
| 数学目标／训练损失 | 棋谱动作似然、自我对弈胜率、胜负价值回归分别训练；搜索决定最终行动 |
| 机制改变 | 结合人类棋谱策略学习、自我对弈强化学习、价值网络与树搜索 |
| 评价改善的指标 | 胜率、棋力、搜索性能 |

## 四、实验如何验证方法

| 实验要素 | 原文设定与证据范围 |
|---|---|
| 环境与任务 | 围棋程序比较与樊麾对局 |
| 数据来源与规模 | 监督策略使用KGS的约3000万局面；价值网络使用自我对弈的约3000万不同对局各抽一个局面 |
| 对比基线 | 原文其他围棋程序与不同组件配置 |
| 训练预算与资源 | 单机搜索48CPU与8GPU；分布式版1202CPU与176GPU。图4程序比赛约5秒每步；其他对局时间规则另计 |
| 指标及其含义 | 胜率、棋力、搜索性能 |
| 随机性与不确定性 | 图4包含95%置信区间；五局人类比赛不是五个独立训练种子 |
| 实际验证的假设 | 学习到的先验与价值能否使搜索达到高棋力 |

**实验解读（本文分析）**：不是AlphaGo Zero，训练使用人类棋谱与大量搜索资源。比较时应分别核对真实交互、更新次数和计算时间；论文曲线的横轴只支持相应预算下的结论。

## 六、贡献、代价与局限

**作者贡献**是深度学习与搜索的高水平系统组合。**本文分析**：围棋规则可精确模拟，奖励清晰，部署可用搜索；真实世界通常不具备这些条件。原文系统成绩不可直接归因于某一种优化器。

## 七、帮助建立理解

### 教学例子

以下是教学推演，不是原论文实验。

策略认为A有0.7概率、B有0.2，但搜索发现A后续多败、B能稳定赢。先验负责把计算投到有希望处，搜索仍可推翻先验；若所有预算都锁死在A，价值和搜索就无法纠错。

### 五个前置概念

1. **MCTS**：用多次模拟分配搜索预算。
2. **策略先验**：提前估计值得探索的动作。
3. **价值网络**：估计局面的胜负前景。
4. **自我对弈**：模型与自身或历史版本比赛生成数据。
5. **Rollout**：快速走到终局来估计结果。

### 三个值得继续追问的问题

1. 已知棋规给搜索提供了什么额外优势？
2. 如何分别计量策略网络和搜索的收益？
3. AlphaGo与AlphaGo Zero的数据条件为何不同？
