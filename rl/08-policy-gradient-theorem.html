    <textarea id="md-source" class="hidden" readonly># 第 08 天｜策略梯度定理：Critic 近似到什么程度才不带偏 Actor

[系列首页](README.md) · [上一篇](07-options.md) · [下一篇](09-natural-policy-gradient.md)

**原论文与版本**：*Policy Gradient Methods for Reinforcement Learning with Function Approximation*，1999。[原论文](https://papers.nips.cc/paper/1999/file/464d828b85b0bed98e80ade0a5c43b0f-Paper.pdf)。

## 一、先用一分钟讲明白

**研究问题**：带函数逼近的策略如何得到可靠梯度

**旧方法卡点**：状态分布也随策略改变，直接求导似乎要对整个环境求导

**作者主张**：把目标梯度写成状态访问分布下的策略导数与 Q 的乘积，并给出兼容逼近条件

**论文证据**：Theorem 1—3 连接梯度表达、兼容 Critic 和局部收敛

**一句话**：在可微策略、平均回报或起始状态折扣回报的 MDP中，作者通过“把目标梯度写成状态访问分布下的策略导数与 Q 的乘积，并给出兼容逼近条件”应对“带函数逼近的策略如何得到可靠梯度”这一问题；证据边界或代价是：任意深度 Critic 都不自动满足兼容条件。

## 二、研究背景与问题定义

本篇将“带函数逼近的策略如何得到可靠梯度”放在可微策略、平均回报或起始状态折扣回报的 MDP的边界内研究。状态分布也随策略改变，直接求导似乎要对整个环境求导。先固定下表中的任务、反馈与信息权限，再判断后面哪一项改动真正回答了这个问题；算法机制有效与适用于任意环境是不同结论。

| 要素 | 本文设定 |
|---|---|
| 研究场景 | 可微策略、平均回报或起始状态折扣回报的 MDP |
| 状态／观测 | 状态 s，按策略访问分布加权 |
| 动作 | 随机动作 a |
| 奖励或学习信号 | 环境回报 |
| 终止／边界 | 依平均回报或回合目标分别定义 |

## 三、方法：到底改了什么

定理消去对状态分布求导的显式计算，却没有消去状态分布本身。随后要求 Critic 的特征与策略 score function 匹配；在适当加权最小二乘驻点，Critic 误差与所需梯度方向正交。它解释为什么评价者可以帮助策略优化，也说明仅有较小的回归误差，不足以保证策略梯度估计正确。

### 关键公式与符号

$$\nabla J=\sum_s d^\pi(s)\sum_a \nabla\pi(a|s)Q^\pi(s,a).$$
兼容近似可写 $f_w(s,a)=w^\top\nabla_\theta\log\pi_\theta(a|s)$。需要同时满足拟合最优性条件，不能仅令网络有相同输出维数。d 的规范化与折扣定义会影响常数。

### 输入 → 处理 → 输出：教学伪代码

以下伪代码展示核心更新流程；简化条件见代码注释与后文。

```text
输入：可微策略 πθ 与匹配的 score 特征 ψ
重复：
  用当前策略采样状态、动作与回报
  ψ(s,a) ← ∇θ logπθ(a|s)
  拟合 f_w = wᵀψ，使加权回归满足兼容条件
  g ← 样本平均 ψ(s,a)*f_w(s,a)
  θ ← θ+α*g
  重新采样，不把旧状态分布当成永久正确
输出：策略参数
注：理论式需要精确期望与条件；采样版本是近似
```

**实现要点**：任意深度 Critic 都不自动满足兼容条件。

### 三种“优化”要分开

| 层次 | 这里具体是什么 |
|---|---|
| 数学目标／训练损失 | 优化平均或折扣期望回报；证明策略梯度与兼容价值近似的联系 |
| 机制改变 | 把目标梯度写成状态访问分布下的策略导数与 Q 的乘积，并给出兼容逼近条件 |
| 评价改善的指标 | 梯度一致性、驻点性质 |

## 四、实验如何验证方法

| 实验要素 | 原文设定与证据范围 |
|---|---|
| 环境与任务 | 理论 MDP |
| 数据来源与规模 | 经验用于构造梯度估计；非固定基准数据 |
| 对比基线 | 真梯度与兼容近似梯度 |
| 训练预算与资源 | 局部渐近论证；现代 GPU 预算不适用 |
| 指标及其含义 | 梯度一致性、驻点性质 |
| 随机性与不确定性 | 理论期望与收敛，不是种子均值 |
| 实际验证的假设 | 函数逼近是否可支持策略改进 |

**实验解读（本文分析）**：任意深度 Critic 都不自动满足兼容条件。比较时应分别核对真实交互、更新次数和计算时间；论文曲线的横轴只支持相应预算下的结论。

## 五、结果：证据到底有多强

| 证据定位 | 比较什么／观察到什么 | 支持什么 | 不能证明什么 |
|---|---|---|---|
| Theorem 1 | 目标梯度的等价改写 | 无需显式微分转移规律 | 仍依赖正确访问分布 |
| Theorem 2 | 真 Q 与兼容近似 | 在条件下梯度相同 | 不保证任意 Critic |
| Theorem 3 | 交替评价与策略改进 | 相应局部收敛性质 | 不是全局最优保证 |

**结论边界**：Theorem 1—3 连接梯度表达、兼容 Critic 和局部收敛。任意深度 Critic 都不自动满足兼容条件。

## 六、贡献、代价与局限

**作者贡献**是理论条件。**本文分析**：现代 Actor–Critic 受有限采样、未充分拟合和网络共享影响，通常只能借鉴结构，不能宣称原定理逐项适用。

## 七、帮助建立理解

### 教学例子

以下是教学推演，不是原论文实验。

若 score 特征 ψ 在两种样本上为 ±1，Critic 误差在二者上恰相同为 c，则平均 ψc=0，梯度可不受影响；若误差也为 ±c，平均 ψ误差=c，Actor 就被系统带偏。准确与“对梯度无害”不是同一概念。

### 五个前置概念

1. **访问分布**：策略决定看见哪些状态。
2. **Score function**：log 策略概率的参数梯度。
3. **兼容逼近**：价值特征与策略梯度结构匹配。
4. **正交残差**：拟合误差对指定特征无投影。
5. **驻点**：目标的一阶梯度为零。

### 三个值得继续追问的问题

1. 共享 Actor/Critic 主干是否仍满足兼容条件？
2. 为什么值函数误差很小仍可能使梯度方向错误？
3. off-policy 数据需要怎样的分布修正？

| 原有问题 | 作者的改动 | 为什么可能有效 | 实验证据／理论证据 | 代价与局限 |
