    <textarea id="md-source" class="hidden" readonly># 第 27 天｜PPO：裁剪替代目标到底限制了什么

[系列首页](README.md) · [上一篇](26-her.md) · [下一篇](28-c51.md)

**原论文与版本**：Schulman 等，*Proximal Policy Optimization Algorithms*，2017。[PDF](https://arxiv.org/pdf/1707.06347v2)。

## 一、先用一分钟讲明白

**研究问题**：在稳定性与实现成本间折中

**旧方法卡点**：TRPO 求解复杂，普通多轮策略梯度可能过度利用旧样本

**作者主张**：采用概率比裁剪或 KL 惩罚，让策略更新更易实现

**论文证据**：§6 在控制与 Atari 比较中展示有效的训练配方

**一句话**：在on-policy 采样、随机策略优化，通常搭配 Actor–Critic中，作者通过“采用概率比裁剪或 KL 惩罚，让策略更新更易实现”应对“在稳定性与实现成本间折中”这一问题；证据边界或代价是：裁剪不构成所有动作概率或 KL 的硬约束。

## 二、研究背景与问题定义

本篇将“在稳定性与实现成本间折中”放在on-policy 采样、随机策略优化，通常搭配 Actor–Critic的边界内研究。TRPO 求解复杂，普通多轮策略梯度可能过度利用旧样本。先固定下表中的任务、反馈与信息权限，再判断后面哪一项改动真正回答了这个问题；算法机制有效与适用于任意环境是不同结论。

| 要素 | 本文设定 |
|---|---|
| 研究场景 | on-policy 采样、随机策略优化，通常搭配 Actor–Critic |
| 状态／观测 | 控制状态或视觉观测 |
| 动作 | 连续或离散动作 |
| 奖励或学习信号 | 环境奖励；应用到LLM时需另定义 |
| 终止／边界 | 环境终止与采样截断 |

## 三、方法：到底改了什么

先冻结 π_old 采样，再在同一批数据上优化若干轮。正优势样本概率增加太多时，其继续增加的目标收益被截平；负优势样本则对概率降低过多的方向截平。这是局部样本目标的形状改变，不是把策略概率直接钳制。

### 关键公式与符号

$$L^{clip}=E[\min(\rho A,\operatorname{clip}(\rho,1-\epsilon,1+\epsilon)A)].$$
ρ 是新旧概率比，A 是冻结优势。Actor 最大化它，完整训练通常另有价值回归和熵项；原论文也研究自适应 KL 惩罚版本。

### 输入 → 处理 → 输出：教学伪代码

以下伪代码展示核心更新流程；简化条件见代码注释与后文。

```text
重复：
  π_old ← 当前策略冻结副本
  用 π_old 收集 rollout 并保存 old_logprob
  计算优势 A 与价值目标，停止其梯度
  for epoch in 1..K：
    打乱 minibatch
    ρ ← exp(logπθ(a|s)-old_logprob)
    surrogate ← min(ρ*A,clip(ρ,1-ε,1+ε)*A)
    最小化 -mean(surrogate)+价值损失-熵奖励
  丢弃本轮 on-policy 数据，重新采样
输出：策略与价值网络
```

**实现要点**：π_old 不是 RLHF 的参考 π_ref；裁剪区间也不是直接概率边界。代码省略原文具体价值权重与调参表。

### 三种“优化”要分开

| 层次 | 这里具体是什么 |
|---|---|
| 数学目标／训练损失 | 最大化裁剪优势替代目标；另加价值回归与熵项 |
| 机制改变 | 采用概率比裁剪或 KL 惩罚，让策略更新更易实现 |
| 评价改善的指标 | 回报、采样效率与训练便利性 |

## 四、实验如何验证方法

| 实验要素 | 原文设定与证据范围 |
|---|---|
| 环境与任务 | §6 MuJoCo、Roboschool、Atari |
| 数据来源与规模 | on-policy trajectories |
| 对比基线 | 不同替代目标、A2C/ACER/TRPO等按实验分别比较 |
| 训练预算与资源 | 部分 MuJoCo 曲线为1百万步；各平台预算并不相同 |
| 指标及其含义 | 回报、采样效率与训练便利性 |
| 随机性与不确定性 | 随机重复与区间须逐图看，本文未完整核实 |
| 实际验证的假设 | 简化优化是否保持实用性能 |

**实验解读（本文分析）**：裁剪不构成所有动作概率或 KL 的硬约束。比较时应分别核对真实交互、更新次数和计算时间；论文曲线的横轴只支持相应预算下的结论。

## 五、结果：证据到底有多强

| 证据定位 | 比较什么／观察到什么 | 支持什么 | 不能证明什么 |
|---|---|---|---|

**结论边界**：§6 在控制与 Atari 比较中展示有效的训练配方。裁剪不构成所有动作概率或 KL 的硬约束。

## 六、贡献、代价与局限

**作者贡献**是实用替代目标及经验比较。**本文分析**：共享参数会让未采样动作也改变，某样本梯度被裁平不意味着整个网络停止改变它。学习率、epoch 数、优势处理和终止逻辑都可左右结果。

## 七、帮助建立理解

### 教学例子

以下是教学推演，不是原论文实验。

A=2，ρ=1.5，ε=0.2，未裁剪收益3，裁剪后为2.4，min取2.4。若 A=−2，ρ=1.5，则取−3，仍惩罚增加坏动作概率；不能不看 A 符号就决定哪一侧饱和。

### 五个前置概念

1. **概率比**：新旧策略对同一动作的相对倾向。
2. **裁剪替代目标**：限制某些方向的目标增益。
3. **旧策略**：本轮样本的实际生成策略。
4. **价值目标**：训练 Critic 的回归量。
5. **熵**：动作分布的不确定程度。

### 三个值得继续追问的问题

1. 为何 ratio 超出区间后仍可能有梯度？
2. 多轮更新时如何检测策略漂移？
3. 为什么换终止处理可比换优化器影响更大？

## 方法与证据总结

| 原有问题 | 作者的改动 | 为什么可能有效 | 实验证据／理论证据 | 代价与局限 |
|---|---|---|---|---|
| 在稳定性与实现成本间折中 | 采用概率比裁剪或 KL 惩罚，让策略更新更易实现 | 削弱反复利用同一旧样本导致的某些过大更新 | §6 在控制与 Atari 比较中展示有效的训练配方 | 裁剪不构成所有动作概率或 KL 的硬约束 |
