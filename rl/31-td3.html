    <textarea id="md-source" class="hidden" readonly># 第 31 天｜TD3：给 DDPG 的价值误差加三道约束

[系列首页](README.md) · [上一篇](30-sac.md) · [下一篇](32-impala.md)

**原论文与版本**：Fujimoto 等，*Addressing Function Approximation Error in Actor-Critic Methods*，2018。[正文](https://arxiv.org/html/1802.09477v3)。

## 一、先用一分钟讲明白

**研究问题**：Critic 错误被 Actor 放大的不稳定性

**旧方法卡点**：确定策略也会选中高估动作，快速交替更新使错误传播

**作者主张**：双 Critic 取较小目标、延迟 Actor 更新、平滑目标动作

**论文证据**：§6 七个控制任务与消融支持整体方案

**一句话**：在off-policy、无模型、确定性连续 Actor–Critic中，作者通过“双 Critic 取较小目标、延迟 Actor 更新、平滑目标动作”应对“Critic 错误被 Actor 放大的不稳定性”这一问题；证据边界或代价是：可能引入低估，不能把双 Critic 最小值当真值下界。

## 二、研究背景与问题定义

本篇将“Critic 错误被 Actor 放大的不稳定性”放在off-policy、无模型、确定性连续 Actor–Critic的边界内研究。确定策略也会选中高估动作，快速交替更新使错误传播。先固定下表中的任务、反馈与信息权限，再判断后面哪一项改动真正回答了这个问题；算法机制有效与适用于任意环境是不同结论。

| 要素 | 本文设定 |
|---|---|
| 研究场景 | off-policy、无模型、确定性连续 Actor–Critic |
| 状态／观测 | MuJoCo低维状态 |
| 动作 | 连续动作向量 |
| 奖励或学习信号 | 环境回报 |
| 终止／边界 | 任务终止／时间限制 |

## 三、方法：到底改了什么

三项修改分别针对乐观估计、未稳定的评价者和尖锐虚假峰值。目标噪声用于平滑 Bellman 目标，行为探索噪声用于采集数据，二者不是同一用途。Actor 使用一个在线 Critic 更新；目标取两者较小值。

### 关键公式与符号

$$a'=\operatorname{clip}(\mu_{\bar\theta}(s')+\operatorname{clip}(\epsilon,-c,c)),\quad y=r+\gamma(1-d)\min_{i=1,2}Q_{\bar\phi_i}(s',a').$$
两个 Critic 回归同一冻结 y；每隔 d_policy 次 Critic 更新再更新 Actor。符号 d_policy 与终止标志不要混用。

### 输入 → 处理 → 输出：教学伪代码

以下伪代码展示核心更新流程；简化条件见代码注释与后文。

```text
采集带行为探索噪声的经验到 replay
每次梯度步骤：
  抽 minibatch
  目标动作 ← 目标Actor(s_next)+截断高斯噪声
  再截断到合法动作区间
  y ← r+γ*(1-done)*min(目标Q1,目标Q2)
  更新两个 Critic 的 TD 损失
  若 update_index % policy_delay == 0：
    Actor 最大化在线 Q1(s,Actor(s))
    软更新目标 Actor 与两个目标 Critic
输出：评价时无探索噪声的 Actor
```

**实现要点**：可能引入低估，不能把双 Critic 最小值当真值下界。

### 三种“优化”要分开

| 层次 | 这里具体是什么 |
|---|---|
| 数学目标／训练损失 | 双Critic回归保守平滑目标；延迟Actor最大化Q1 |
| 机制改变 | 双 Critic 取较小目标、延迟 Actor 更新、平滑目标动作 |
| 评价改善的指标 | 表1为原文汇总回报，不是2026排行榜 |

**实验解读（本文分析）**：可能引入低估，不能把双 Critic 最小值当真值下界。比较时应分别核对真实交互、更新次数和计算时间；论文曲线的横轴只支持相应预算下的结论。

## 六、贡献、代价与局限

**作者贡献**是针对误差传播的组合修正。**本文分析**：双 Q 共享数据仍可能相关；min 的悲观程度影响探索与最终回报。目标平滑适合局部动作价值平滑的假设，尖锐但真实的最优动作也可能被抹掉。

## 七、帮助建立理解

### 教学例子

以下是教学推演，不是原论文实验。

目标Q1=8、Q2=5，r=1、γ=0.9，y=5.5，而使用Q1会得到8.2。若真实值为9，两种都低估，min 更低；机制控制的是乐观风险，不是逐样本准确性。

### 五个前置概念

1. **Clipped Double Q**：目标用两估值较小者。
2. **延迟策略更新**：让 Critic 多学几步再改 Actor。
3. **目标平滑**：对邻近目标动作平均化评价。
4. **高估传播**：自举把局部误差传到其他状态。
5. **消融**：移除组件检验其作用。

### 三个值得继续追问的问题

1. 两 Critic 完全相关时还有多少作用？
2. 为什么目标噪声不等于探索噪声？
3. 同样交互预算下更频繁 Critic 更新是否公平？
