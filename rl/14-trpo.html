[系列首页](README.md) · [上一篇](13-dpg.md) · [下一篇](15-gae.md)

**原论文与版本**：Schulman 等，*Trust Region Policy Optimization*，2015。[正文](https://arxiv.org/html/1502.05477v5)。

## 一、先用一分钟讲明白

**研究问题**：策略更新的稳定性

**旧方法卡点**：旧策略样本上的改进不一定迁移到大幅变化的新策略

**作者主张**：以 KL 信赖域限制策略变化，近似求解受约束替代目标

**论文证据**：理论界与控制实验支持保守更新的设计

**一句话**：在单智能体、on-policy 随机策略优化中，作者通过“以 KL 信赖域限制策略变化，近似求解受约束替代目标”应对“策略更新的稳定性”这一问题；证据边界或代价是：实际平均 KL 与理论最坏状态约束不同，不构成无条件单调保证。

## 二、研究背景与问题定义

本篇将“策略更新的稳定性”放在单智能体、on-policy 随机策略优化的边界内研究。旧策略样本上的改进不一定迁移到大幅变化的新策略。先固定下表中的任务、反馈与信息权限，再判断后面哪一项改动真正回答了这个问题；算法机制有效与适用于任意环境是不同结论。

| 要素 | 本文设定 |
|---|---|
| 研究场景 | 单智能体、on-policy 随机策略优化 |
| 状态／观测 | 控制状态或 Atari 图像 |
| 动作 | 连续或离散动作 |
| 奖励或学习信号 | 任务回报 |
| 终止／边界 | 真终止及 rollout 截断要区分 |

## 三、方法：到底改了什么

从旧策略得到优势与样本，使用概率比比较新旧策略对已执行动作的倾向。实际求解把目标线性化、KL 二次化，用共轭梯度求方向，再回溯验证近似是否可靠。它沿用策略梯度与自然梯度几何，新增的是受限更新及可执行近似。

### 关键公式与符号

$$\max_\theta E_{old}[\rho_t(\theta)\hat A_t],\quad E_sD_{KL}(\pi_{old}\|\pi_\theta)\le\delta,\quad\rho_t=\pi_\theta(a_t|s_t)/\pi_{old}(a_t|s_t).$$
理论推导中的最坏状态散度不能直接替换为实验平均散度后仍声称完全相同保证。

### 输入 → 处理 → 输出：教学伪代码

以下伪代码展示核心更新流程；简化条件见代码注释与后文。

```text
冻结旧策略 π_old
用 π_old 收集轨迹，估计优势 A
计算替代目标梯度 g
定义 KL Hessian-vector product Fv
用共轭梯度解 Fd≈g
缩放 d 使局部二次 KL≈δ
沿 d 回溯候选 θ：
  若样本替代目标改善且样本平均 KL≤δ：接受
  否则缩短步长；无可行步则保持 θ
更新价值估计，开始下一轮
```

**实现要点**：实际平均 KL 与理论最坏状态约束不同，不构成无条件单调保证。

### 三种“优化”要分开

| 层次 | 这里具体是什么 |
|---|---|
| 数学目标／训练损失 | 最大化旧数据上的概率比优势替代目标，受平均KL约束 |
| 机制改变 | 以 KL 信赖域限制策略变化，近似求解受约束替代目标 |
| 评价改善的指标 | 回报与学习曲线 |

## 五、结果：证据到底有多强

**结论边界**：理论界与控制实验支持保守更新的设计。实际平均 KL 与理论最坏状态约束不同，不构成无条件单调保证。

## 六、贡献、代价与局限

**作者区分**理论与实际近似。**本文分析**：vine 采样需要恢复环境状态，可能拥有现实机器人没有的权限；样本 KL 也可能漏掉未访问状态的大变化。对照 PPO 时应同时看更新速度、样本效率与实现复杂度。

## 七、帮助建立理解

### 教学例子

以下是教学推演，不是原论文实验。

旧策略动作概率0.1，新策略0.9，优势为正，替代目标会强烈奖励这个变化。但旧数据几乎没覆盖新策略大量访问的后续状态。KL 约束的意义是限制这种外推，不是证明该动作不值得增加。

### 五个前置概念

1. **信赖域**：限制一步优化偏离可靠区域。
2. **重要性比**：新旧策略对样本概率的比值。
3. **替代目标**：用旧样本估计新策略收益的代理。
4. **共轭梯度**：无需显式逆矩阵的线性求解方法。
5. **回溯搜索**：逐步缩短候选更新直到满足条件。

### 三个值得继续追问的问题

1. 平均 KL 很小却有少数状态变化巨大，可能发生什么？
2. 恢复状态的 vine 采样额外提供了什么能力？
3. 回溯通过是否意味着真实回报一定提升？
