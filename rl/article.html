<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>正在打开文章… | MyLog</title>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get("slug") || "";
            function target(name) {
                if (!name) return "index.html";
                if (name.indexOf("00-") === 0 || name === "00-timeline") return "00-timeline.html";
                if (name.indexOf("61-") === 0 || name === "61-epilogue") return "61-epilogue.html";
                return name + ".html";
            }
            window.location.replace(target(slug));
        })();
    </script>
</head>
<body>
    <p>正在打开文章，如果没有跳转请返回 <a href="index.html">系列首页</a>。</p>
</body>
</html>
