    <textarea id="md-source" class="hidden" readonly># 第 52 天｜DeepSeekMath／GRPO：用同题多回答，替代独立价值基线

[系列首页](README.md) · [上一篇](51-kto.md) · [下一篇](53-r1.md)

**原论文与版本**：Shao 等，*DeepSeekMath: Pushing the Limits of Mathematical Reasoning in Open Language Models*，2024。[正文](https://arxiv.org/html/2402.03300v1)。GRPO 在这篇论文中提出，而非首次出现在 R1。

## 一、先用一分钟讲明白

**研究问题**：语言模型RL的Critic成本与评价基线

**旧方法卡点**：PPO常需额外价值网络，单个答案难判断相对质量

**作者主张**：对同提示采样一组回答，以组内奖励统计构造优势，再做裁剪策略优化

**论文证据**：表5中7B模型MATH从SFT的46.8到GRPO的51.7

**一句话**：在语言模型数学后训练，组相对策略梯度中，作者通过“对同提示采样一组回答，以组内奖励统计构造优势，再做裁剪策略优化”应对“语言模型RL的Critic成本与评价基线”这一问题；证据边界或代价是：整篇同时包含预训练和SFT，不能把全部能力归于GRPO。

## 二、研究背景与问题定义

本篇将“语言模型RL的Critic成本与评价基线”放在语言模型数学后训练，组相对策略梯度的边界内研究。PPO常需额外价值网络，单个答案难判断相对质量。先固定下表中的任务、反馈与信息权限，再判断后面哪一项改动真正回答了这个问题；算法机制有效与适用于任意环境是不同结论。

| 要素 | 本文设定 |
|---|---|
| 研究场景 | 语言模型数学后训练，组相对策略梯度 |
| 状态／观测 | 数学提示及回答前缀 |
| 动作 | 下一个token |
| 奖励或学习信号 | 原论文含学习到的结果／过程奖励模型 |
| 终止／边界 | EOS或原文生成长度上限 |

## 三、方法：到底改了什么

Critic不是奖励模型。GRPO省的是预测回报基线的价值网络，原DeepSeekMath仍可使用学习RM。相同问题的G条回答互相比较，组内标准化的终局优势广播到回答token；过程监督变体还会累积后续步骤信号。原文算法有迭代数据／RM更新，不是今天所有框架的固定rule reward配方。

### 关键公式与符号

$$A_i=\frac{r_i-\bar r}{std(r_1,\ldots,r_G)},\quad L=\frac1G\sum_i\frac1{|y_i|}\sum_t\min(\rho_{it}A_i,clip(\rho_{it})A_i)-\beta KL.$$
数值实现必须处理std为零；旧策略概率用于ρ，参考策略用于KL。它们可在外层流程更新，但角色不可混用。

### 输入 → 处理 → 输出：教学伪代码

以下伪代码展示核心更新流程；简化条件见代码注释与后文。

```text
固定本轮参考、奖励模型；冻结π_old
对每个提示从π_old采G条回答
给每条回答评分；计算组均值和标准差
若标准差为零：按实现置相对优势为0
否则A_i←(r_i-均值)/(std+数值保护)
对有效回答token广播A_i（结果监督版）
按每回答平均的裁剪目标减KL更新策略
按原文外层流程更新数据／RM等
输出：数学策略
注：过程奖励版需另外构造逐步优势
```

**实现要点**：整篇同时包含预训练和SFT，不能把全部能力归于GRPO。

### 三种“优化”要分开

| 层次 | 这里具体是什么 |
|---|---|
| 数学目标／训练损失 | 每回答平均的组优势裁剪目标，按原文加入参考KL |
| 机制改变 | 对同提示采样一组回答，以组内奖励统计构造优势，再做裁剪策略优化 |
| 评价改善的指标 | 无工具数学正确率与有工具设定分开 |

## 四、实验如何验证方法

| 实验要素 | 原文设定与证据范围 |
|---|---|
| 环境与任务 | GSM8K、MATH等数学评价 |
| 数据来源与规模 | RL约144k问题；前置预训练／SFT数据另计 |
| 对比基线 | 基座、SFT、GRPO与不同监督设置 |
| 训练预算与资源 | 原文每题64回答，最大1024token；lr约1e-6，KL系数0.04 |
| 指标及其含义 | 无工具数学正确率与有工具设定分开 |
| 随机性与不确定性 | 训练种子、评价采样与问题数不可混淆 |
| 实际验证的假设 | 组基线能否节约Critic并提升SFT策略 |

**实验解读（本文分析）**：整篇同时包含预训练和SFT，不能把全部能力归于GRPO。比较时应分别核对真实交互、更新次数和计算时间；论文曲线的横轴只支持相应预算下的结论。

## 五、结果：证据到底有多强

| 证据定位 | 比较什么／观察到什么 | 支持什么 | 不能证明什么 |
|---|---|---|---|
| §4.1方法／算法1 | 组优势与迭代训练 | 解释省去价值网络 | 不等于无奖励模型 |
| 表5 | SFT与RL的同规模模型 | MATH46.8→51.7、GSM8K82.9→88.2 | 不把预训练收益全归RL |
| 监督粒度／分析实验（具体图表编号本文未核实） | 结果与过程等配置 | 检验反馈设计 | 不建立统一奖励结论 |

MATH绝对提升4.9个百分点，相对SFT基准约10.5%。这与把整个DeepSeekMath比其他模型的差异归给GRPO，是两种不同因果问题。

## 六、贡献、代价与局限

**作者贡献**包括数学模型训练与GRPO。**本文分析**：同题全对或全错时相对信号消失；除以组标准差改变不同难度题的梯度权重；每回答除长度会影响token贡献。后两点是后续Dr. GRPO等分析的重要入口。

## 七、帮助建立理解

### 教学例子

以下是教学推演，不是原论文实验。

奖励[0,0,1,1]，用总体标准差0.5，优势为[−1,−1,1,1]。若奖励[1,1,1,1]，相对优势应退化为零，不能计算0/0；KL项仍可能产生梯度。

### 五个前置概念

1. **组相对基线**：用同题多个回答相互比较。
2. **结果奖励**：整条回答获得一个终局评分。
3. **过程奖励**：为中间步骤提供评价。
4. **Old与Ref**：分别对应采样策略与漂移基准。
5. **零方差组**：所有回答奖励相同的组。

### 三个值得继续追问的问题

1. 全部答错时怎样获得学习信号？
2. 组标准差为何改变不同问题权重？
3. 省Critic后总生成／奖励模型成本是否下降？
