[系列首页](README.md) · [上一篇](35-pets.md) · [下一篇](37-bcq.md)

**原论文与版本**：*Exploration by Random Network Distillation*，2018。[原论文](https://arxiv.org/abs/1810.12894)。

## 一、先用一分钟讲明白

**研究问题**：难探索环境中的新颖性估计

**旧方法卡点**：动力学预测误差易受转移随机性影响

**作者主张**：固定随机目标网络，训练预测器拟合它，以拟合误差奖励新观测

**论文证据**：Montezuma等探索实验与新颖性诊断展示作用

**一句话**：在在线内在奖励探索，通常配PPO中，作者通过“固定随机目标网络，训练预测器拟合它，以拟合误差奖励新观测”应对“难探索环境中的新颖性估计”这一问题；证据边界或代价是：观测噪声、泛化和遗忘仍会影响新颖性。

## 二、研究背景与问题定义

本篇将“难探索环境中的新颖性估计”放在在线内在奖励探索，通常配PPO的边界内研究。动力学预测误差易受转移随机性影响。先固定下表中的任务、反馈与信息权限，再判断后面哪一项改动真正回答了这个问题；算法机制有效与适用于任意环境是不同结论。

| 要素 | 本文设定 |
|---|---|
| 研究场景 | 在线内在奖励探索，通常配PPO |
| 状态／观测 | 图像观测 |
| 动作 | 游戏动作 |
| 奖励或学习信号 | 外部奖励与RND误差两个信号流 |
| 终止／边界 | 内在与外在回报可使用不同回合边界处理 |

## 三、方法：到底改了什么

目标函数f在训练前随机初始化后冻结；预测器g只在访问过的观测上被训练。熟悉状态误差通常下降，没见过状态误差可能较大。它不预测下一状态，因此减少了对随机动力学结果的直接预测需求；但并不是“完全不受随机噪声影响”。

### 关键公式与符号

$$r^i(s)=\|g_\theta(s)-f_{fixed}(s)\|^2.$$
预测器最小化该误差，策略最大化沿轨迹遇到的误差与任务收益。归一化与不同价值流影响实际权重。

### 输入 → 处理 → 输出：教学伪代码

以下伪代码展示核心更新流程；简化条件见代码注释与后文。

```text
随机初始化并冻结目标f
初始化预测器g与策略／价值网络
循环：
  用策略采样观测轨迹
  在预测器更新前计算r_int=||g(s)-f(s)||²
  按选定规范化处理内外奖励
  分别计算需要的内外价值目标与优势
  用PPO更新策略
  用访问观测训练g拟合固定f
输出：带探索能力的策略
```

**实现要点**：观测噪声、泛化和遗忘仍会影响新颖性。

### 三种“优化”要分开

| 层次 | 这里具体是什么 |
|---|---|
| 数学目标／训练损失 | 预测器拟合固定随机目标；策略优化该误差加外部奖励 |
| 机制改变 | 固定随机目标网络，训练预测器拟合它，以拟合误差奖励新观测 |
| 评价改善的指标 | 房间数、游戏回报、预测误差 |

| 数据来源与规模 | 在线访问观测 |
| 对比基线 | 纯探索、不同内外奖励流、不同策略网络等 |

| 随机性与不确定性 | 部分曲线5种子；其他图单独核对 |
| 实际验证的假设 | 静态目标误差能否提供实用探索信号 |

**实验解读（本文分析）**：观测噪声、泛化和遗忘仍会影响新颖性。比较时应分别核对真实交互、更新次数和计算时间；论文曲线的横轴只支持相应预算下的结论。

**结论边界**：Montezuma等探索实验与新颖性诊断展示作用。观测噪声、泛化和遗忘仍会影响新颖性。

## 六、贡献、代价与局限

**作者设计**避开直接预测随机后继的部分问题。**本文分析**：新奇不一定有益；预测器遗忘会让旧状态重新显得新。归一化、预测器容量和训练频率改变奖励非平稳性。

## 七、帮助建立理解

### 教学例子

以下是教学推演，不是原论文实验。

走进新房间时g没学过其图像，误差大；多次重访后误差降低。如果房间只含随机闪烁屏幕，每帧都不同，也可能持续造成误差，需额外诊断。

### 五个前置概念

1. **随机目标**：初始化后不再学习的映射。
2. **蒸馏**：让可训练网络模仿目标输出。
3. **新颖性**：对学习系统而言的陌生程度。
4. **内外价值流**：分别预测探索与任务收益。
5. **奖励非平稳**：奖励函数随预测器学习改变。

### 三个值得继续追问的问题

1. 预测器过强或过弱会怎样改变探索？
2. 遗忘会不会导致无用循环？
3. 房间数与任务分数矛盾时如何判断方法？
