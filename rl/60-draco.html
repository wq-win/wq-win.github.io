    <textarea id="md-source" class="hidden" readonly># 第 60 天｜DRACO：没有成功验证器时，如何把评分准则分配到步骤

[系列首页](README.md) · [上一篇](59-ttpo.md) · [系列收尾](61-系列收尾.md)

**原论文与版本**：Gandhi 等，*DRACO: Fine-Grained Credit Assignment with Dynamic Rubrics for Long-Horizon Agent Training*，2026-09-03。[正文](https://arxiv.org/html/2609.04094v1)。

## 一、先用一分钟讲明白

**研究问题**：多轮工具任务缺少可靠终局成功标签

**旧方法卡点**：整轨迹评分粗糙，固定rubric难覆盖不断变化的行为

**作者主张**：动态生成并合并评分准则，用judge引用的步骤重分配组优势

**论文证据**：AppWorld与τ-bench主表及消融报告相应收益

**一句话**：在outcome-blind多轮Agent GRPO中，作者通过“动态生成并合并评分准则，用judge引用的步骤重分配组优势”应对“多轮工具任务缺少可靠终局成功标签”这一问题；证据边界或代价是：judge仍是额外监督，保符号分配不等于步骤因果价值。

## 二、研究背景与问题定义

本篇将“多轮工具任务缺少可靠终局成功标签”放在outcome-blind多轮Agent GRPO的边界内研究。整轨迹评分粗糙，固定rubric难覆盖不断变化的行为。先固定下表中的任务、反馈与信息权限，再判断后面哪一项改动真正回答了这个问题；算法机制有效与适用于任意环境是不同结论。

| 要素 | 本文设定 |
|---|---|
| 研究场景 | outcome-blind多轮Agent GRPO |
| 状态／观测 | 任务指令、对话与工具反馈历史 |
| 动作 | 可执行工具／代码步骤中的token |
| 奖励或学习信号 | 动态rubric通过／失败汇总，训练不读取真成功检查器 |
| 终止／边界 | AppWorld最多50轮、τ-bench100轮 |

## 三、方法：到底改了什么

judge先从任务和轨迹提出准则，合并去重并过滤无区分条目，再评价每条轨迹、引用相关步骤。轨迹分数转为组优势后，正优势偏重被判好的步骤，负优势偏重被判差的步骤。长度归一化保持原轨迹token总系数。没有训练新的归因模块，不意味着没有judge成本。

### 关键公式与符号

$$R=(p-f)/(p+f),\quad q_j=p_j/(p_j+f_j).$$
q_j是准则通过率，不是RL的Q。令胜者 $w_j=q_j$、负优势 $w_j=1-q_j$，
$$a_j=A\frac{Nw_j}{n_j\sum_kw_k},\quad\sum_jn_ja_j=AN.$$
无适用准则、未引用步骤或零分母必须按附录退化规则处理。

### 输入 → 处理 → 输出：教学伪代码

以下伪代码展示核心更新流程；简化条件见代码注释与后文。

```text
同任务采G条多轮轨迹
judge从指令与轨迹提出rubrics，合并去重
过滤规定的无区分准则，逐条评价并引用步骤
按通过／失败数计算轨迹R；无适用准则按原文退化
组内规范化得到A
每步由引用准则计算q；未引用步按附录填补规则
按A符号选w，再以步长和总长度归一a_j
遇零分母按附录回退，不直接除零
仅在规定的可训练动作token广播a_j，做GRPO更新
独立评估使用真实任务检查器
```

**实现要点**：judge仍是额外监督，保符号分配不等于步骤因果价值。

### 三种“优化”要分开

| 层次 | 这里具体是什么 |
|---|---|
| 数学目标／训练损失 | 动态rubric奖励产生的组优势，经长度守恒步骤分配后做GRPO |
| 机制改变 | 动态生成并合并评分准则，用judge引用的步骤重分配组优势 |
| 评价改善的指标 | TGC、SGC、SR；pass^k是多次都成功 |

## 四、实验如何验证方法

| 实验要素 | 原文设定与证据范围 |
|---|---|
| 环境与任务 | AppWorld90训练任务；测试168普通／417挑战；τ-bench97 |
| 数据来源与规模 | 在线工具轨迹、冻结judge评价 |
| 对比基线 | 基座、相同预算真结果奖励、静态rubric／无信用消融 |
| 训练预算与资源 | Qwen3.6-27B100步/20epochs；32B75步；8H100、LoRA；judge成本另计 |
| 指标及其含义 | TGC、SGC、SR；pass^k是多次都成功 |
| 随机性与不确定性 | 最后3个epoch检查点平均，每检查点3评估运行，不等于3训练种子 |
| 实际验证的假设 | 动态准则与步骤分配能否在无真训练标签下改善Agent |

**实验解读（本文分析）**：judge仍是额外监督，保符号分配不等于步骤因果价值。比较时应分别核对真实交互、更新次数和计算时间；论文曲线的横轴只支持相应预算下的结论。

## 五、结果：证据到底有多强

| 证据定位 | 比较什么／观察到什么 | 支持什么 | 不能证明什么 |
|---|---|---|---|
| 图1／§3 | 动态评分和信用分配 | 解释监督来源 | 不代表无监督 |
| 表2主结果 | 同基座与outcome reward | 27B普通集TGC69.4→85.3，结果奖励80.0 | 不同split不能拼接 |
| 表2消融 | 去动态／去信用 | 多数相关指标支持组合 | 部分指标非单调提高 |
| 评价协议§4.1 | 末3检查点与3次运行 | 明确避免峰值选点的协议 | 不等于独立训练重复 |
| 成本／稳健性分析（具体图表编号本文未核实） | judge与训练资源 | 提供系统代价视角 | 不能认为外部judge免费 |

普通AppWorld的TGC绝对提升：相对基座15.9个百分点，相对结果奖励基线5.3个百分点。τ-bench的常规judge与self-judge是不同设置，不能拿各自最好数字拼成一个系统。表2中的pass^k是k次都成功的一致性，不是至少一次成功的pass@k。

## 六、贡献、代价与局限

**作者设定**是训练不可访问真成功信号，评估可以访问，两者不冲突。**本文分析**：动态rubric可能引入漂移与风格偏见；所有步骤权重非负，所以负优势轨迹中被judge认为好的步骤只会少受罚，不会自动变成正向奖励。步骤引用也不是反事实因果证明。

## 七、帮助建立理解

### 教学例子

以下是教学推演，不是原论文实验。

失败轨迹A=−1，两步各10token，q=(0.9,0.1)，w=(0.1,0.9)，总长20。优势a=(−0.2,−1.8)，token总和10×−0.2+10×−1.8=−20=AN。第一步仍负，只是被罚得较轻。

### 五个前置概念

1. **Rubric**：可逐项检查的评价准则。
2. **Outcome-blind**：训练不访问真实任务成功答案。
3. **步骤引用**：judge指出判断相关的轨迹步骤。
4. **保符号重分配**：只改信用大小，不翻转原有符号。
5. **Pass^k**：多次执行全部成功的一致性指标。

### 三个值得继续追问的问题

1. judge偏好与真实成功偏离时如何诊断？
2. 负轨迹中的真正好步骤是否需要允许正优势？
3. 计入judge调用后与真奖励训练的成本差多少？

## 方法与证据总结

| 原有问题 | 作者的改动 | 为什么可能有效 | 实验证据／理论证据 | 代价与局限 |
|---|---|---|---|---|
| 多轮工具任务缺少可靠终局成功标签 | 动态生成并合并评分准则，用judge引用的步骤重分配组优势 | 细化好坏步骤的更新强度，减轻整轨迹一律奖惩 | AppWorld与τ-bench主表及消融报告相应收益 | judge仍是额外监督，保符号分配不等于步骤因果价值 |
