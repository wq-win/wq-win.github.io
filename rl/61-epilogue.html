    <textarea id="md-source" class="hidden" readonly># 系列收尾｜把 60 篇论文连成可检验的理解

[返回系列首页](README.md)

理解一个算法，不仅要能写出更新公式，还要知道它依赖哪些信息、改善了什么指标，以及在什么条件下可能失败。把相近方法放在一起比较，再构造能够推翻直觉的实验，才能把零散论文连成可检验的认识。

## 横向比较：相近算法的关键差异

| 对照 | 真正不同在哪里 | 容易混淆的地方 |
|---|---|---|
| Q-learning / REINFORCE | 前者更新动作价值；后者更新随机策略参数 | 有动作不等于有独立 Actor 网络 |
| DQN / DDPG | 前者在离散动作中比较 Q；后者学习输出连续动作的 Actor | 深度网络只是表示方式，不决定算法类别 |
| DPG / DDPG | 前者提供确定性策略梯度理论及算法；后者结合深度网络稳定化组件 | 不能把 DPG 理论直接当 DDPG 神经实现保证 |
| GAE / PPO | 一个估计优势，一个定义策略更新机制 | GAE 不是 PPO 之前被替代的一代算法 |
| TRPO / PPO | KL 约束近似优化与裁剪/惩罚替代目标 | PPO 裁剪不是硬 KL 保证 |
| DDPG / TD3 | TD3 专门控制价值误差及其传播 | 双 Critic 不等于真实回报下界 |
| TD3 / SAC | 前者确定策略；后者最大熵随机策略 | SAC 的熵进入目标和价值，不只加探索噪声 |
| CQL / IQL | 保守价值正则与只查询数据动作的价值学习 | 二者都不能凭空补全缺失数据覆盖 |
| Dreamer / MuZero | 主要在想象中训练 Actor，与行动时搜索 | 二者都有学习模型，计算放置不同 |
| PPO / DPO | 在线采样的策略优化与固定偏好对损失 | DPO 不是适用于所有 MDP 的 PPO 替代品 |
| PPO / GRPO | 学习价值基线与组内比较基线 | GRPO 无独立 Critic，但仍有奖励和 rollout 成本 |
| DAPO / Dr. GRPO | 多项训练配方修正与特定归一化偏差分析 | 两者处理长度相关问题，但分母并不相同 |
| FACTOR / DRACO | TD 决定动作级正负贡献，或 judge 对轨迹优势做保符号分配 | 均非已验证的独立 token 因果解释器 |
| TTPO / 普通后训练 | 部署/测试时继续更新参数 | 需要另计适应预算及检查点选择协议 |

上述表是教学归纳，具体设定以各篇链接版本为准。

## 统一实验阅读方法：哪些结果能够放在一起比较

**先确定实验单位。** 经典控制可能按环境 step 或 frame 计；语言模型可能按 prompt、rollout、token 或 optimizer step 计；Agent 还可能有工具调用和中间状态重启。不同单位的“训练 100 步”没有直接可比性。

| 要核对的项目 | 为什么影响结论 |
|---|---|
| 起始模型、网络、预训练 | 更强基座可能解释一部分收益 |
| 真实数据、合成数据、示范、奖励标签 | 相同优化器不代表相同信息预算 |
| 环境交互与生成总 token | 同样更新次数可能消耗完全不同的样本量 |
| GPU 时间、模型调用、人工干预 | 样本效率不是完整计算或人力效率 |
| 奖励与评估是否独立 | 被优化的评分器可能高估模型改善 |
| 随机种子与评估重复 | 一个训练种子上生成 32 次，不等于 32 个训练种子 |
| 误差条定义 | 标准差、标准误、极差、置信区间不可互换 |
| 检查点选择 | 报告测试集上的最佳检查点可能引入选择偏差 |
| 环境与数据版本 | Atari 协议、Gym 与 D4RL 版本变化会影响分数 |
| 消融的其他配置 | 移除模块时也改变训练预算，难以单独归因 |

**区分三个常见语言模型指标。**

- Avg@k：同题采 k 次后平均正确率，常用于降低单次采样评估噪声。
- Pass@k：k 个候选至少一个成功的概率或相应估计，通常会随候选数增加。
- Majority vote：选 k 个回答中最常出现的答案，再算正确率。

多轮 Agent 的 $pass^k$ 又可能表示 k 次全部成功的一致性指标。必须逐篇查看定义。

**区分两类论证。** Bellman 收敛、梯度恒等式、望远镜求和是数学结论，各有前提；真实网络的稳定性、泛化和成本主要靠实验回答。一个漂亮恒等式不能自动证明其学习到的中间量准确，一个好分数也不能单独证明作者提出的机制解释唯一正确。

## 三个贯穿系列的教学实验

三个实验分别检验价值高估、长度归一化和模型误差，连接本系列的主要方法。以下均为尚未运行的教学方案；可手算的结果单独列出，训练效果需要实际实验验证。

### 实验 A：高估、覆盖与保守性

固定两动作bandit的真实奖励分布，例如A均值1、B均值0、二者标准差1。先单独建立一个不均衡数据集：A有100条，B仅1条且恰好观测到3。这一条件数据集用于演示，不能用于宣称无条件平均性能。

实验分成两条线：第一条在相同完整数据上比较估值和选出的动作；第二条重新随机生成许多数据集，比较期望表现。Double Q应按其抽样／更新机制训练，不能在两套完全相同的精确样本均值上假装得到了独立去偏。

| 项目 | 预先指定的方案 |
|---|---|
| 自变量 | B样本数1、5、20、100；奖励噪声；保守正则强度 |
| 对比 | 单Q、双估计、简化保守价值目标 |
| 固定 | 同一轮试验的数据、动作真值、训练更新总量 |
| 主要指标 | 选中真实较优动作的比例、估值偏差、真实策略收益 |
| 不确定性 | 建议至少30个独立数据种子；报告分布与置信区间 |
| 可能推翻预期的结果 | 双估计未改善覆盖不足；过强正则错压真正好动作 |

```text
for independent_seed in 预先固定的种子列表：
  生成同一份训练数据供各方法使用
  for method in [单Q, 双估计, 保守目标]：
    以相同更新预算训练
    冻结策略，用独立奖励样本评估
    保存估值、真实均值差、选动作与收益
按种子配对比较，不能只保留最漂亮的一次
```

它把Double Q／Double DQN、TD3、BCQ／BEAR、CQL／IQL联系起来。**假设而非结果**：减少估值高估可能改善动作选择，但无法替代缺失的信息。

### 实验 B：长度分母到底改变哪个量

令两回答长度分别10和100，优势都为+1，G=2，固定最大长度100。以下是ρ=1、裁剪前的系数手算。

| 归约 | 短回答每token | 长回答每token | 短回答系数总和 | 长回答系数总和 |
|---|---:|---:|---:|---:|
| 每回答先平均，再对2条平均 | 1/20 | 1/200 | 0.5 | 0.5 |
| 全部有效token平均 | 1/110 | 1/110 | 10/110 | 100/110 |
| 固定 G×Lmax 分母 | 1/200 | 1/200 | 0.05 | 0.5 |

优势全为−1时表中系数翻转符号，绝对比例不变。本批中全局token平均与固定分母只差整体尺度，但换成其他长度批次，尺度比例会变；它们跨batch的优化过程不等价。

第二阶段才做训练实验：使用同一批轨迹、同一模型起点、同一优化器，分别记录梯度范数、有效KL、正确／错误回答长度与独立题正确率。先控制学习率，再另做匹配梯度尺度的对照，避免把纯幅度差当成新机制。

对于FACTOR，要同时验证动作内权重均值为1和action-mean归约；对于DRACO，要验证token系数总和保持AN。两者守恒对象不同，均不能推出参数梯度向量守恒。

### 实验 C：模型误差如何被策略利用

真实一维环境为s'=s+a，动作限制[-1,1]，目标位置设为5。学习模型在指定区间错误预测s'=s+2a，其他位置准确。回报可用负目标距离，另报告实际到达率，防止代理回报掩盖任务失败。

| 项目 | 预先指定的方案 |
|---|---|
| 自变量 | 想象长度1、3、10；误差区间；模型误差幅度 |
| 对比 | 长规划、短分支、加入末端价值、加入数据分布约束 |
| 固定 | 真实数据量、候选动作总预算、初始状态集合 |
| 两组预算 | 一组匹配真实交互量；一组匹配全部计算时间 |
| 指标 | 想象收益、真实收益、二者差、到达率、控制延迟 |
| 关键对照 | 给准确模型的oracle上界；给错误价值尾部的敏感性分析 |

```text
固定真实环境与带局部误差的模型
对每组初始状态与算法配置：
  在模型内选动作／训练Actor
  记录模型预测的回报
  在真实环境执行同一策略并独立评价
  保存想象—真实差距与是否进入误差区域
比较短rollout、价值尾部和分布约束各自的作用
```

这连接Dyna、PETS、MBPO、Dreamer、MuZero、MBDPO与WorldSample。**假设而非结果**：更长规划可能找到更好的真实方案，也可能更善于利用模型漏洞；实验应允许两种结果出现。

## 三处值得进一步验证的证据疑点

1. **WorldSample 数字口径**：摘要的成功率增幅，与表 1 展示均值直接相减的结果不同；步数和时间降幅对应标签也需核对。表中数据的直接计算与摘要表述存在差异，原因尚待澄清。
2. **MBDPO 扩展趋势**：正文提到较大模型在某个数据设置下降，因此不能只引用概括性的“单调扩展”。能量与行为密度的对应也依赖负样本假设。
3. **TTPO 评估协议**：无标签测试时更新加峰值检查点报告，与固定模型的独立测试不是相同设定。需要补充预先指定检查点和完整成本才能支持更强比较。

上述疑点来自论文文本分析，仍需作者说明或独立实验加以澄清。

### 证据链与澄清方式

| 疑点 | 当前能确定的内容 | 尚不能确定的内容 | 下一步有效证据 |
|---|---|---|---|
| WorldSample数字口径 | 表1展示均值可以明确手算 | 摘要增幅与标签差异的原始计算口径 | 作者说明权重、未四舍五入数据及日志 |
| MBDPO扩展趋势与能量 | 正文写出30任务340M下降；负样本来自错配动作 | 单调说法的限定范围、能量密度假设是否满足 | 分设置曲线、不同负样本分布对照 |
| TTPO检查点选择 | 原文说明保存并报告峰值检查点 | 无标签部署如何选点及完整成本 | 预先固定终点、无标签停止规则、所有生成／训练成本 |

这些差异尚不足以判断原因。进一步的解释需要对应版本的原文、计算口径和实验日志支持；来源见 [MBDPO](56-mbdpo.md)、[WorldSample](57-worldsample.md) 与 [TTPO](59-ttpo.md)。

## 学习检查：怎样判断自己真的读懂

读完一篇论文后，合上正文，尝试完成以下四项自测：

1. **画信息流**：数据从哪里来，奖励谁提供，哪些模型训练、冻结或延迟更新？
2. **写一个核心更新**：说明每个量来自真实样本、网络估计还是搜索，以及哪些路径反向传播。
3. **复述一个证据**：明确任务、基线、指标与预算，说明它支持什么、不能说明什么。
4. **构造一个失败例子**：如缺乏覆盖、模型幻觉、错误多数票、奖励偏差或优势分配错误。

### 使用 Agent 辅助阅读

以下提示词可用于概念自测和逐步推导：

> 按《强化学习 60 篇论文博客》的第 N 篇带我学习。先检查我是否理解它依赖的概念，然后只讲当前最重要的一步。请让我自己解释公式或做一道手算题，依据我的回答继续。区分原论文内容、教学例子与你的分析；核对具体版本与实验条件。不要只用缩写解释缩写，也不要把理论保证直接套在神经网络实现上。

## 阅读与复现实验记录表

每阅读一篇论文或完成一次实验，记录版本、证据与未解决的问题。下表为空白记录模板。

| 阅读日期 | 论文与版本 | 最关键公式及前提 | 已核实图表与数值 | 尚未核实内容 | 自己的反例／问题 | 复现实验与结果 |
|---|---|---|---|---|---|---|
| 首次阅读时填写 | 写明v几或出版版 | 写出符号和假设 | 写任务、预算、比较对象 | 区分未报告与未读到 | 明确自构 | 未运行就写未运行 |

一篇论文读完后，至少能回答：它改了哪个接口？用了什么额外信息？哪项证据最能支持它？哪个失败例子会推翻过强的概括？这四个问题比记住算法缩写更有用。

        }
        nav.innerHTML = chips.join('');

        const pager = document.getElementById('article-pager');
        pager.innerHTML = `
            ${prev ? `<a class="flex-1 bg-white rounded-lg shadow-card p-4 hover:shadow-card-hover" href="${prev.slug}.html"><div class="text-xs text-gray-400 mb-1">上一篇</div><div class="font-medium text-gray-800">${prev.cardTitle}</div></a>` : '<div class="flex-1"></div>'}
            ${next ? `<a class="flex-1 bg-white rounded-lg shadow-card p-4 hover:shadow-card-hover text-right" href="${next.slug}.html"><div class="text-xs text-gray-400 mb-1">下一篇</div><div class="font-medium text-gray-800">${next.cardTitle}</div></a>` : '<div class="flex-1"></div>'}
        `;
    </script>
</body>
</html>
