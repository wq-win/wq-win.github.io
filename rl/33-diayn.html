**原论文与版本**：*Diversity is All You Need: Learning Skills without a Reward Function*，2018。[原论文](https://arxiv.org/abs/1802.06070)。

## 一、先用一分钟讲明白

**研究问题**：无外部任务时的技能发现

**旧方法卡点**：随机行为不保证覆盖可复用的行为类型

**作者主张**：最大化技能与访问状态的可辨识性，同时保留技能内动作熵

**论文证据**：导航与运动示例展示多样技能和下游用途

**一句话**：在无监督技能发现、目标为技能变量z的最大熵RL中，作者通过“最大化技能与访问状态的可辨识性，同时保留技能内动作熵”应对“无外部任务时的技能发现”这一问题；证据边界或代价是：可辨识不等于有用，技能选择与实际任务还需额外学习。

## 二、研究背景与问题定义

本篇将“无外部任务时的技能发现”放在无监督技能发现、目标为技能变量z的最大熵RL的边界内研究。随机行为不保证覆盖可复用的行为类型。先固定下表中的任务、反馈与信息权限，再判断后面哪一项改动真正回答了这个问题；算法机制有效与适用于任意环境是不同结论。

| 要素 | 本文设定 |
|---|---|
| 研究场景 | 无监督技能发现、目标为技能变量z的最大熵RL |
| 状态／观测 | 环境状态s与技能ID z |
| 动作 | 条件随机策略π(a|s,z) |
| 奖励或学习信号 | log判别概率减log技能先验 |
| 终止／边界 | 通常一个回合固定技能；环境终止另处理 |

## 三、方法：到底改了什么

固定先验抽技能z，判别器从状态猜z，策略去到能让z被猜出的状态。固定先验避免训练只保留少数容易区分的技能。它借助SAC类最大熵优化；没有外部任务奖励，不等于完全没有训练信号。

### 关键公式与符号

$$r_z(s)=\log q_\phi(z|s)-\log p(z).$$
策略最大化该伪奖励与动作熵；判别器最大化正确技能标签的log概率。z来自自采样，所以无需人工技能标签。

### 输入 → 处理 → 输出：教学伪代码

以下伪代码展示核心更新流程；简化条件见代码注释与后文。

```text
固定技能先验p(z)
每回合抽z，并以π(a|s,z)交互
保存(s,a,s_next,z)到replay
抽batch：
  判别器拟合从s预测z
  计算r_z=logq(z|s)-logp(z)
  用最大熵Actor–Critic更新条件策略
评价：看技能覆盖，并单独测试下游任务
输出：技能库，不是已完成所有任务的单一策略
```

**实现要点**：可辨识不等于有用，技能选择与实际任务还需额外学习。

### 三种“优化”要分开

| 层次 | 这里具体是什么 |
|---|---|
| 数学目标／训练损失 | 最大化技能可辨识性的互信息下界与技能内动作熵 |
| 机制改变 | 最大化技能与访问状态的可辨识性，同时保留技能内动作熵 |
| 评价改善的指标 | 技能可区分性、多样行为、下游回报 |

## 六、贡献、代价与局限

**作者贡献**是简洁的无监督技能目标。**本文分析**：技能可通过无用位置差异区分；判别器输入选择会改变学到什么。下游成功可能依赖选择器训练预算，必须单独计量。

## 七、帮助建立理解

### 教学例子

以下是教学推演，不是原论文实验。

两个技能分别停在左角与右角，判别器很容易识别，目标很高；但任务若要求开门，这两个技能可能都没用。多样性是潜在资源，不是任务完成率。

### 五个前置概念

1. **技能变量**：索引一类条件行为的隐变量。
2. **互信息**：两个变量可预测彼此的程度。
3. **判别器**：从状态识别执行的技能。
4. **先验**：技能采样频率分布。
5. **技能坍缩**：多个技能变成相同或只剩少数有效技能。

### 三个值得继续追问的问题

1. 只观察位置和观察全状态会发现不同技能吗？
2. 如何测量技能对未知任务的真实帮助？
3. 固定均匀先验是否浪费困难技能的预算？
