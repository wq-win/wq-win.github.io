## 一、先用一分钟讲明白

**研究问题**：RLHF的多模型与在线训练复杂性

**旧方法卡点**：先训RM再用PPO需要生成、价值估计和多个网络

**作者主张**：把KL正则奖励最优策略代回偏好模型，直接优化偏好对

**论文证据**：受控情感、摘要和对话实验支持直接偏好训练

**一句话**：在固定偏好数据、参考策略约束的语言模型对齐中，作者通过“把KL正则奖励最优策略代回偏好模型，直接优化偏好对”应对“RLHF的多模型与在线训练复杂性”这一问题；证据边界或代价是：离线偏好覆盖和建模假设仍在，不能当通用在线RL替代。

## 二、研究背景与问题定义

本篇将“RLHF的多模型与在线训练复杂性”放在固定偏好数据、参考策略约束的语言模型对齐的边界内研究。先训RM再用PPO需要生成、价值估计和多个网络。先固定下表中的任务、反馈与信息权限，再判断后面哪一项改动真正回答了这个问题；算法机制有效与适用于任意环境是不同结论。

| 要素 | 本文设定 |
|---|---|
| 研究场景 | 固定偏好数据、参考策略约束的语言模型对齐 |
| 状态／观测 | 提示x |
| 动作 | 整段回答y；计算上分解为token |
| 奖励或学习信号 | 成对优选／拒绝标签，不单独输出显式RM |
| 终止／边界 | EOS／长度上限；只对回答token计算概率 |

## 三、方法：到底改了什么

DPO利用最优策略与奖励间的解析联系，把未知奖励差表示为新旧策略log概率比之差。归一化常数在同提示两个回答的差中消掉。只需训练策略，参考冻结；不需要在每步采新回答或训练Critic。

### 关键公式与符号

$$L=-E\log\sigma\{\beta[\log\frac{\pi_\theta(y_w|x)}{\pi_{ref}(y_w|x)}-\log\frac{\pi_\theta(y_l|x)}{\pi_{ref}(y_l|x)}]\}.$$
β控制偏好与参考约束的对应尺度。原始序列log概率是回答token之和，不擅自除以长度。

### 输入 → 处理 → 输出：教学伪代码

以下伪代码展示核心更新流程；简化条件见代码注释与后文。

```text
输入偏好三元组(x,y_win,y_lose)，固定π_ref
初始化待训练πθ
循环抽batch：
  计算胜／负回答的策略log概率和
  计算对应参考log概率（无梯度）
  margin←β*((logp_win-logref_win)-(logp_lose-logref_lose))
  loss←-mean(logsigmoid(margin))
  更新πθ，不更新参考模型
用独立偏好及能力指标评价
输出：对齐策略
```

**实现要点**：离线偏好覆盖和建模假设仍在，不能当通用在线RL替代。

### 三种“优化”要分开

| 层次 | 这里具体是什么 |
|---|---|
| 数学目标／训练损失 | 最小化参考校正log概率差的偏好logistic损失 |
| 机制改变 | 把KL正则奖励最优策略代回偏好模型，直接优化偏好对 |
| 评价改善的指标 | 已知奖励—KL前沿、GPT-4／人类胜率 |

## 六、贡献、代价与局限

**作者贡献**是直接偏好损失及解析联系。**本文分析**：离线数据不能主动探索未见行为；可分离偏好数据上持续增加margin可能过拟合。真实人类偏好有冲突，不一定可用单一标量排名解释。

## 七、帮助建立理解

### 教学例子

以下是教学推演，不是原论文实验。

偏好对的新旧log比差为2，β=0.1，则模型偏好概率sigmoid(0.2)≈0.55。降低损失会扩大这个相对差，但可能通过降低负回答概率实现，未必单独提高正回答绝对概率。

### 五个前置概念

1. **偏好对**：同提示下更好与更差的回答。
2. **Bradley–Terry**：以奖励差预测二选一偏好。
3. **隐式奖励**：由策略参考概率比对应的奖励。
4. **参考KL**：约束偏离原行为的程度。
5. **Margin**：优选与拒绝回答的相对优势。

### 三个值得继续追问的问题

1. 降低DPO loss是否保证正回答概率上升？
2. 偏好数据可分离时为什么可能过拟合？
