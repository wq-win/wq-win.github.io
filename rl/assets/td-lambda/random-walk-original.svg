<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-labelledby="title desc"><title id="title">七状态有界随机游走：原创教学示意</title><desc id="desc">从D出发，非终止状态以二分之一概率向左右移动。A和G吸收，终局目标分别为0和1。B到F到达G的真实概率依次为六分之一到六分之五。</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="#54758f"/></marker></defs><rect width="840" height="250" rx="18" fill="#f4f8fc"/><g font-family="sans-serif" text-anchor="middle"><text x="420" y="32" fill="#274563" font-size="17">原文 Figure 2 的任务 · 原创教学示意（非实验曲线）</text><path d="M100,100 H150" stroke="#54758f" stroke-width="2" marker-start="url(#arrow)"/><text x="125" y="83" font-size="12" fill="#496780">1/2</text><circle cx="66" cy="110" r="32" fill="#e2e8ee" stroke="#54758f" stroke-width="2"/><text x="66" y="117" font-size="23" fill="#243c54">A</text><text x="66" y="175" font-size="18" fill="#243c54">0</text><text x="66" y="199" font-size="12" fill="#496780">吸收终点</text><path d="M218,100 H268" stroke="#54758f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="243" y="83" font-size="12" fill="#496780">1/2</text><circle cx="184" cy="110" r="32" fill="#fff" stroke="#54758f" stroke-width="2"/><text x="184" y="117" font-size="23" fill="#243c54">B</text><text x="184" y="175" font-size="18" fill="#243c54">1/6</text><path d="M336,100 H386" stroke="#54758f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="361" y="83" font-size="12" fill="#496780">1/2</text><circle cx="302" cy="110" r="32" fill="#fff" stroke="#54758f" stroke-width="2"/><text x="302" y="117" font-size="23" fill="#243c54">C</text><text x="302" y="175" font-size="18" fill="#243c54">2/6</text><path d="M454,100 H504" stroke="#54758f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="479" y="83" font-size="12" fill="#496780">1/2</text><circle cx="420" cy="110" r="32" fill="#d1e7fd" stroke="#54758f" stroke-width="2"/><text x="420" y="117" font-size="23" fill="#243c54">D</text><text x="420" y="175" font-size="18" fill="#243c54">3/6</text><text x="420" y="151" font-size="12" fill="#2767b0">起点</text><path d="M572,100 H622" stroke="#54758f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="597" y="83" font-size="12" fill="#496780">1/2</text><circle cx="538" cy="110" r="32" fill="#fff" stroke="#54758f" stroke-width="2"/><text x="538" y="117" font-size="23" fill="#243c54">E</text><text x="538" y="175" font-size="18" fill="#243c54">4/6</text><path d="M690,100 H740" stroke="#54758f" stroke-width="2" marker-end="url(#arrow)"/><text x="715" y="83" font-size="12" fill="#496780">1/2</text><circle cx="656" cy="110" r="32" fill="#fff" stroke="#54758f" stroke-width="2"/><text x="656" y="117" font-size="23" fill="#243c54">F</text><text x="656" y="175" font-size="18" fill="#243c54">5/6</text><circle cx="774" cy="110" r="32" fill="#e2e8ee" stroke="#54758f" stroke-width="2"/><text x="774" y="117" font-size="23" fill="#243c54">G</text><text x="774" y="175" font-size="18" fill="#243c54">1</text><text x="774" y="199" font-size="12" fill="#496780">吸收终点</text><text x="420" y="231" font-size="14" fill="#496780">下行数字：最终到达 G 的真实概率（解析值，不是采样估计）</text></g></svg>